<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="心象测">
  <!--
    心象测 · Brand Mark
    Concept: vesica piscis — 双象交汇成清晰「心象」
    Palette: teal #0F766E + champagne gold #B8952E
  -->
  <!-- left disk -->
  <circle cx="73" cy="100" r="54" fill="#0F766E"/>
  <!-- right disk -->
  <circle cx="127" cy="100" r="54" fill="#0F766E"/>
  <!-- lens (exact intersection of the two circles) -->
  <path
    fill="#FFFFFF"
    d="M100 46.14
       A54 54 0 0 0 100 153.86
       A54 54 0 0 0 100 46.14 Z"/>
  <!-- insight seed -->
  <path
    fill="#B8952E"
    d="M100 90.5
       C104.8 96.8 104.8 105.2 100 111.5
       C95.2 105.2 95.2 96.8 100 90.5 Z"/>
</svg>
