<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="心象测">
  <defs>
    <linearGradient id="xxBg" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="55%" stop-color="#115e59"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="xxAccent" x1="10%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#99f6e4"/>
    </linearGradient>
    <linearGradient id="xxWarm" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
    <filter id="xxSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- rounded mark plate -->
  <rect x="14" y="14" width="172" height="172" rx="44" fill="url(#xxBg)"/>
  <!-- abstract mind arc -->
  <path d="M48 118 C58 72, 142 72, 152 118" fill="none" stroke="url(#xxAccent)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <path d="M58 126 C70 92, 130 92, 142 126" fill="none" stroke="#99f6e4" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
  <!-- central heart-pulse (心象) -->
  <g filter="url(#xxSoft)">
    <path d="M100 138
      C100 138, 68 116, 68 96
      C68 84, 76 78, 86 78
      C92 78, 97 82, 100 88
      C103 82, 108 78, 114 78
      C124 78, 132 84, 132 96
      C132 116, 100 138, 100 138 Z"
      fill="url(#xxWarm)"/>
  </g>
  <!-- spark / insight dots -->
  <circle cx="64" cy="64" r="4.5" fill="#ccfbf1" opacity="0.95"/>
  <circle cx="138" cy="58" r="3.2" fill="#fef3c7" opacity="0.9"/>
  <circle cx="148" cy="78" r="2.4" fill="#99f6e4" opacity="0.8"/>
</svg>
