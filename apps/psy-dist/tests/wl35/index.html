<script>
const questions = [
    {d:'ability',t:'能力竞争力',q:"你的专业技能在市场上稀缺吗？",o:[{t:"非常稀缺，不可替代",s:0},{t:"比较稀缺，有竞争力",s:3},{t:"一般，随时可替代",s:7},{t:"非常容易被替代",s:10}]},
    {d:'ability',t:'能力竞争力',q:"你持续学习新技能吗？",o:[{t:"每年学习多项新技能",s:0},{t:"经常学习，与时俱进",s:3},{t:"偶尔学习",s:7},{t:"基本不学习",s:10}]},
    {d:'ability',t:'能力竞争力',q:"你能独立完成核心工作吗？",o:[{t:"完全能，是团队核心",s:0},{t:"比较能，能力强",s:3},{t:"一般，需要协助",s:7},{t:"不太能",s:10}]},
    {d:'income',t:'收入稳定性',q:"你的收入结构单一吗？",o:[{t:"完全单一，只靠工资",s:10},{t:"比较单一",s:7},{t:"有多元收入",s:3},{t:"收入多元化",s:0}]},
    {d:'income',t:'收入稳定性',q:"你对自己的薪资满意吗？",o:[{t:"非常满意，有竞争力",s:0},{t:"比较满意",s:3},{t:"不太满意",s:7},{t:"很不满意",s:10}]},
    {d:'income',t:'收入稳定性',q:"如果失业，你的储蓄能支撑多久？",o:[{t:"2年以上",s:0},{t:"1-2年",s:3},{t:"3-6个月",s:7},{t:"1个月以内",s:10}]},
    {d:'competition',t:'市场竞争',q:"你觉得自己容易被年轻人取代吗？",o:[{t:"完全不容易",s:0},{t:"不太容易",s:3},{t:"比较容易被取代",s:7},{t:"非常容易被取代",s:10}]},
    {d:'competition',t:'市场竞争',q:"你的行业前景如何？",o:[{t:"朝阳行业，前景好",s:0},{t:"稳定发展",s:3},{t:"夕阳行业",s:7},{t:"正在衰退",s:10}]},
    {d:'competition',t:'市场竞争',q:"你在行业内的竞争力？",o:[{t:"TOP 5%，顶尖水平",s:0},{t:"Top 20%，较强",s:3},{t:"中等水平",s:7},{t:"较弱",s:10}]},
    {d:'mindset',t:'心态状态',q:"你对未来职业发展焦虑吗？",o:[{t:"完全不焦虑，很清晰",s:0},{t:"偶尔焦虑",s:3},{t:"经常焦虑",s:7},{t:"非常焦虑",s:10}]},
    {d:'mindset',t:'心态状态',q:"你有职业倦怠感吗？",o:[{t:"完全没有，动力十足",s:0},{t:"偶尔有",s:3},{t:"经常有",s:7},{t:"很严重",s:10}]},
    {d:'mindset',t:'心态状态',q:"你愿意接受新挑战吗？",o:[{t:"非常愿意，充满激情",s:0},{t:"比较愿意",s:3},{t:"不太愿意",s:7},{t:"完全不愿意",s:10}]},

    {d:'network',t:'人脉资源',q:"你有可以合作的朋友吗？",o:[{t:"有很多，可以创业",s:0},{t:"有几个",s:3},{t:"很少",s:7},{t:"基本没有",s:10}]},
    {d:'network',t:'人脉资源',q:"行业内有影响力吗？",o:[{t:"很有影响力",s:0},{t:"有一定影响",s:3},{t:"影响较小",s:7},{t:"没有影响力",s:10}]},
    {d:'plan',t:'职业规划',q:"你有清晰的职业规划吗？",o:[{t:"非常清晰，目标明确",s:0},{t:"比较清晰",s:3},{t:"不太清晰",s:7},{t:"完全没规划",s:10}]},
    {d:'plan',t:'职业规划',q:"你为未来做了哪些准备？",o:[{t:"准备充分，有B计划",s:0},{t:"有些准备",s:3},{t:"很少准备",s:7},{t:"完全没有准备",s:10}]},
    {d:'plan',t:'职业规划',q:"你考虑过副业或转型吗？",o:[{t:"已有成熟副业",s:0},{t:"正在发展",s:3},{t:"考虑中",s:7},{t:"完全没想过",s:10}]}
];
const levels = [
    {max:30,l:"低风险",c:"#00B894",d:"你的35岁危机风险较低！你具备较强的竞争力和抗风险能力。",advice:"继续保持，持续学习和提升，建立更广的人脉网络，为未来做好准备。",points:["保持竞争力","继续学习","建立备份计划","关注行业趋势"]},
    {max:60,l:"中等风险",c:"#FDCB6E",d:"你存在一定的35岁危机风险，需要引起重视。",advice:"尽快识别自己的短板，有针对性地进行提升和准备。",points:["提升核心竞争力","建立多元收入","扩展人脉","做好职业规划"]},
    {max:90,l:"较高风险",c:"#FF7675",d:"你的35岁危机风险较高，需要立即采取行动。",advice:"不要等到危机来临才做准备，现在就开始改变！",points:["立即提升技能","寻找发展机会","建立人脉","考虑转型"]},
    {max:180,l:"高危风险",c:"#2D3436",d:"你正处于高危状态！如果不改变，35岁危机几乎不可避免。",advice:"这是最后的窗口期，必须立即进行全面改变！",points:["全面提升竞争力","寻找新的方向","建立副业","考虑创业或转型"]}
];
let currQList=[],currIdx=0,scores={ability:0,income:0,competition:0,mindset:0,network:0,plan:0};
function goToDemo(){document.getElementById('page-intro').style.display='none';document.getElementById('page-demo').style.display='block';}
function initTest(){currQList=[...questions];currIdx=0;scores={ability:0,income:0,competition:0,mindset:0,network:0,plan:0};document.getElementById('page-demo').style.display='none';document.getElementById('page-test').style.display='flex';renderQuestion();}
function renderQuestion(){const q=currQList[currIdx];document.getElementById('progress-text').innerText=`${currIdx+1}/${currQList.length}`;document.getElementById('progress-fill').style.width=`${(currIdx/currQList.length)*100}%`;document.getElementById('dim-tag').innerText=`维度：${q.t}`;document.getElementById('q-category').innerText=q.t;const wrapper=document.getElementById('question-wrapper');wrapper.classList.remove('slide-up');void wrapper.offsetWidth;wrapper.classList.add('slide-up');document.getElementById('question-text').innerText=q.q;const box=document.getElementById('options-box');box.innerHTML='';q.o.forEach(opt=>{const btn=document.createElement('div');btn.className='option-btn';btn.innerText=opt.t;btn.onclick=()=>{Array.from(box.children).forEach(c=>c.classList.remove('selected'));btn.classList.add('selected');setTimeout(()=>handleAnswer(q.d,opt.s),200);};box.appendChild(btn);});}
function handleAnswer(dim,val){scores[dim]+=val;if(currIdx<currQList.length-1){currIdx++;renderQuestion();}else{finishTest();}}
function finishTest(){document.getElementById('page-test').style.display='none';setTimeout(()=>{document.getElementById('page-result').style.display='block';calculateResult();},2000);}
function calculateResult(){let total=Object.values(scores).reduce((a,b)=>a+b,0);let finalScore=Math.round(total);let lvl=levels.find(l=>finalScore<=l.max)||levels[levels.length-1];let start=0;const timer=setInterval(()=>{start++;document.getElementById('res-score').innerText=start;if(start>=finalScore)clearInterval(timer);},15);document.getElementById('res-level').innerText=lvl.l;document.getElementById('res-level').style.background=lvl.c;document.getElementById('res-desc').innerText=lvl.d;renderBars(scores);}
function renderBars(s){const box=document.getElementById('bars-container');const dims=[{k:'ability',n:'能力'},{k:'income',n:'收入'},{k:'competition',n:'竞争'},{k:'mindset',n:'心态'},{k:'network',n:'人脉'},{k:'plan',n:'规划'}];let html='';dims.forEach(d=>{let pct=Math.min((s[d.k]/10)*100,100);let color=s[d.k]<=35?'#00B894':(s[d.k]<=70?'#FDCB6E':'#FF7675');html+=`<div class="dim-row"><div class="dim-info"><span class="dim-name">${d.n}</span></div><div class="dim-bar-bg"><div class="dim-bar-fill" style="width:${pct}%;background:${color};"></div></div><div class="dim-val" style="color:${color}">${Math.round(pct)}%</div></div>`;});box.innerHTML=html;}
function showReport(){const total=parseInt(document.getElementById('res-score').innerText);const lvl=levels.find(l=>total<=l.max)||levels[levels.length-1];let html=`<div class="report_section"><div class="r-h1">一、35岁危机风险诊断</div><div class="r-box" style="border-left:5px solid ${lvl.c};"><div style="font-size:20px;font-weight:900;color:${lvl.c};margin-bottom:8px;">危机风险等级：${lvl.l}</div><p style="margin:0;font-size:14px;line-height:1.6;color:#555;">${lvl.d}</p><p style="margin:10px 0 0;font-size:14px;"><strong>核心建议：</strong>${lvl.advice}</p></div></div><div class="report_section"><div class="r-h2">二、六维度深度分析</div>${Object.entries(scores).map(([k,v])=>{let status=v<=35?'低风险':(v<=70?'中等风险':'高风险');let color=v<=35?'#00B894':(v<=70?'#FDCB6E':'#FF7675');return`<div style="margin-bottom:15px;padding:12px;background:#fafafa;border-radius:8px;"><div style="font-weight:700;margin-bottom:5px;">${['能力竞争力','收入稳定性','市场竞争','心态状态','人脉资源','职业规划'][['ability','income','competition','mindset','network','plan'].indexOf(k)]}</div><div style="height:6px;background:#eee;border-radius:3px;"><div style="height:100%;width:${(v/10)*100}%;background:${color};border-radius:3px;"></div></div><div style="font-size:12px;color:#999;">风险等级：<span style="color:${color}">${status}</span> (得分：${v}/10)</div></div>`}).join('')}</div><div class="report_section"><div class="r-h2">三、防御方案</div><div class="r-box"><ul style="margin:0;padding-left:20px;line-height:2;">${lvl.points.map(p=>`<li>${p}</li>`).join('')}</ul></div></div><div style="text-align:center;color:#ccc;font-size:12px;margin-top:40px;">202635岁危机风险检测·专业心理测评</div>`;document.getElementById('report-content').innerHTML=html;document.getElementById('report-modal').style.display='block';}
function closeReport(){document.getElementById('report-modal').style.display='none';}
async function exportPDF(){const{jsPDF}=window.jspdf;const doc=new jsPDF();doc.setFillColor(45,52,54);doc.rect(0,0,210,40,'F');doc.setTextColor(255,255,255);doc.setFontSize(22);doc.text('35岁危机风险深度分析报告',105,25,{align:'center'});doc.setTextColor(100,100,100);doc.setFontSize(10);doc.text('专业心理测评·2026全新版',105,35,{align:'center'});let y=55;const lvl=levels.find(l=>parseInt(document.getElementById('res-score').innerText)<=l.max)||levels[levels.length-1];doc.setTextColor(0,0,0);doc.setFontSize(16);doc.text(`危机风险等级：${lvl.l}`,15,y);y+=10;doc.setFontSize(12);doc.text(lvl.d.substring(0,150)+'...',15,y);doc.save('35岁危机风险报告.pdf');}
document.getElementById('start-btn').addEventListener('click', function() {
        
 goToDemo(); });document.getElementById('next-btn').addEventListener('click',initTest);document.getElementById('show-report-btn').addEventListener('click',showReport);document.getElementById('close-report-btn').addEventListener('click',closeReport);document.getElementById('export-pdf-btn').addEventListener('click',exportPDF);
