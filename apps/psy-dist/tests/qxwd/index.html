<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const questions = [
    {d:'fluctuation',t:'🌊 情绪波动',q:"你的情绪变化大吗？",o:[{t:"很稳定，很少波动",s:0},{t:"比较稳定",s:2},{t:"波动较大",s:5},{t:"非常不稳定",s:8}]},
    {d:'fluctuation',t:'🌊 情绪波动',q:"你会因为小事而情绪失控吗？",o:[{t:"几乎不会",s:0},{t:"偶尔",s:2},{t:"经常",s:5},{t:"经常失控",s:8}]},
    {d:'fluctuation',t:'🌊 情绪波动',q:"你的情绪会在一天内多次变化吗？",o:[{t:"很少变化",s:0},{t:"偶尔有变化",s:2},{t:"经常起伏",s:5},{t:"变化无常",s:8}]},
    {d:'fluctuation',t:'🌊 情绪波动',q:"面对压力你的情绪反应是？",o:[{t:"能保持冷静",s:0},{t:"稍有焦虑",s:2},{t:"明显焦虑",s:5},{t:"焦虑到崩溃",s:8}]},
    {d:'fluctuation',t:'🌊 情绪波动',q:"别人能预测你的情绪吗？",o:[{t:"完全不能",s:0},{t:"偶尔能",s:2},{t:"经常能",s:5},{t:"总是能",s:8}]},
    {d:'trigger',t:'⚡ 触发敏感',q:"睡眠不好会影响你一整天的情绪吗？",o:[{t:"完全不会",s:0},{t:"有一点",s:2},{t:"影响较大",s:5},{t:"严重影响",s:8}]},
    {d:'trigger',t:'⚡ 触发敏感',q:"天气变化会影响你的情绪吗？",o:[{t:"完全不影响",s:0},{t:"偶尔",s:2},{t:"经常",s:5},{t:"总是影响",s:8}]},
    {d:'trigger',t:'⚡ 触发敏感',q:"他人的评价会让你情绪波动吗？",o:[{t:"完全不会",s:0},{t:"稍微有点",s:2},{t:"经常",s:5},{t:"非常在意",s:8}]},
    {d:'trigger',t:'⚡ 触发敏感',q:"社交媒体会让你感到焦虑吗？",o:[{t:"完全不会",s:0},{t:"偶尔",s:2},{t:"经常",s:5},{t:"总是焦虑",s:8}]},
    {d:'recovery',t:'🔄 恢复能力',q:"情绪低落时你通常需要多久恢复？",o:[{t:"很快，几个小时",s:0},{t:"一天左右",s:2},{t:"需要好几天",s:5},{t:"很长时间走不出来",s:8}]},
    {d:'recovery',t:'🔄 恢复能力',q:"你有自我调节情绪的方法吗？",o:[{t:"有很多有效方法",s:0},{t:"有一些方法",s:2},{t:"偶尔能调节",s:5},{t:"完全不知道怎么做",s:8}]},
    {d:'recovery',t:'🔄 恢复能力',q:"运动能帮助你调节情绪吗？",o:[{t:"非常有效",s:0},{t:"比较有效",s:2},{t:"偶尔有效",s:5},{t:"完全无效",s:8}]},
    {d:'recovery',t:'🔄 恢复能力',q:"你能意识到自己的情绪变化吗？",o:[{t:"非常敏感，能及时察觉",s:0},{t:"一般能察觉",s:2},{t:"有时后知后觉",s:5},{t:"完全察觉不到",s:8}]},
    {d:'control',t:'🎛️ 情绪控制',q:"生气时你能控制自己的言行吗？",o:[{t:"完全能控制",s:0},{t:"基本能",s:2},{t:"偶尔失控",s:5},{t:"经常失控",s:8}]},
    {d:'control',t:'🎛️ 情绪控制',q:"你会在情绪激动时做决定吗？",o:[{t:"从来不会",s:0},{t:"很少",s:2},{t:"有时会",s:5},{t:"经常",s:8}]},
    {d:'control',t:'🎛️ 情绪控制',q:"你能接受负面情绪的存在吗？",o:[{t:"完全接受，这是正常的",s:0},{t:"比较接受",s:2},{t:"试图压制",s:5},{t:"完全无法接受负面情绪",s:8}]},
    {d:'control',t:'🎛️ 情绪控制',q:"你会因为担心未来而焦虑吗？",o:[{t:"很少，活在当下",s:0},{t:"偶尔",s:2},{t:"经常",s:5},{t:"总是焦虑未来",s:8}]},
    {d:'control',t:'🎛️ 情绪控制',q:"你经常后悔或纠结过去的事吗？",o:[{t:"很少，放下过去",s:0},{t:"偶尔",s:2},{t:"经常纠结",s:5},{t:"无法放下过去",s:8}]}
];
const levels = [
    {max:35,l:"情绪很稳定",c:"#00B894",d:"你的情绪稳定度非常高！能很好地管理自己的情绪。",advice:"继续保持这种状态，同时关注身边情绪不稳定的人，适时提供支持。",points:["保持现状","定期情绪复盘","帮助他人成长","关注身心平衡"]},
    {max:70,l:"情绪较稳定",c:"#00CEC9",d:"你的情绪稳定度较好，在大部分情况下能较好地管理情绪。",advice:"注意识别和避开你的情绪触发因素，继续提升情绪管理能力。",points:["识别触发因素","练习情绪觉察","建立支持系统","定期放松"]},
    {max:100,l:"情绪波动较大",c:"#FDCB6E",d:"你的情绪波动较大，需要关注情绪管理。",advice:"建议学习情绪调节技巧，建立规律的运动和作息习惯。",points:["学习情绪调节","建立规律作息","练习正念冥想","寻求专业支持"]},
    {max:144,l:"情绪不稳定",c:"#e17055",d:"你的情绪稳定度较低，情绪波动已经影响到生活质量。",advice:"建议寻求专业帮助，同时建立健康的生活方式和情绪支持系统。",points:["寻求专业帮助","建立情绪日记","规律运动","建立支持系统"]}
];
let currQList=[],currIdx=0,scores={fluctuation:0,trigger:0,recovery:0,control:0};
function goToDemo(){document.getElementById('page-intro').style.display='none';document.getElementById('page-demo').style.display='block';}
function initTest(){currQList=[...questions];currIdx=0;scores={fluctuation:0,trigger:0,recovery:0,control:0};document.getElementById('page-demo').style.display='none';document.getElementById('page-test').style.display='flex';renderQuestion();}
function renderQuestion(){const q=currQList[currIdx];document.getElementById('progress-text').innerText=`${currIdx+1}/${currQList.length}`;document.getElementById('progress-fill').style.width=`${(currIdx/currQList.length)*100}%`;document.getElementById('dim-tag').innerText=`维度：${q.t}`;document.getElementById('q-category').innerText=q.t;const wrapper=document.getElementById('question-wrapper');wrapper.classList.remove('slide-up');void wrapper.offsetWidth;wrapper.classList.add('slide-up');document.getElementById('question-text').innerText=q.q;const box=document.getElementById('options-box');box.innerHTML='';q.o.forEach(opt=>{const btn=document.createElement('div');btn.className='option-btn';btn.innerText=opt.t;btn.onclick=()=>{Array.from(box.children).forEach(c=>c.classList.remove('selected'));btn.classList.add('selected');setTimeout(()=>handleAnswer(q.d,opt.s),200);};box.appendChild(btn);});}
function handleAnswer(dim,val){scores[dim]+=val;if(currIdx<currQList.length-1){currIdx++;renderQuestion();}else{finishTest();}}
function finishTest(){document.getElementById('page-test').style.display='none';setTimeout(()=>{document.getElementById('page-result').style.display='block';calculateResult();},2000);}
function calculateResult(){let total=Object.values(scores).reduce((a,b)=>a+b,0);let finalScore=Math.round(total);let lvl=levels.find(l=>finalScore<=l.max)||levels[levels.length-1];let start=0;const timer=setInterval(()=>{start++;document.getElementById('res-score').innerText=start;if(start>=finalScore)clearInterval(timer);},15);document.getElementById('res-level').innerText=lvl.l;document.getElementById('res-level').style.background=lvl.c;document.getElementById('res-desc').innerText=lvl.d;renderBars(scores);}
function renderBars(s){const box=document.getElementById('bars-container');const dims=[{k:'fluctuation',n:'波动'},{k:'trigger',n:'敏感'},{k:'recovery',n:'恢复'},{k:'control',n:'控制'}];let html='';dims.forEach(d=>{let maxScore=d.k==='fluctuation'?40:d.k==='trigger'?32:d.k==='recovery'?32:d.k==='control'?32;let pct=Math.min((s[d.k]/maxScore)*100,100);let color=pct<=25?'#00B894':(pct<=50?'#FDCB6E':'#e17055');html+=`<div class="dim-row"><div class="dim-info"><span class="dim-name">${d.n}</span></div><div class="dim-bar-bg"><div class="dim-bar-fill" style="width:${pct}%;background:${color};"></div></div><div class="dim-val" style="color:${color}">${Math.round(pct)}%</div></div>`;});box.innerHTML=html;}
function showReport(){const total=parseInt(document.getElementById('res-score').innerText);const lvl=levels.find(l=>total<=l.max)||levels[levels.length-1];let html=`<div class="report_section"><div class="r-h1">一、情绪稳定度诊断</div><div class="r-box" style="border-left:5px solid ${lvl.c};"><div style="font-size:20px;font-weight:900;color:${lvl.c};margin-bottom:8px;">稳定度等级：${lvl.l}</div><p style="margin:0;font-size:14px;line-height:1.6;color:#555;">${lvl.d}</p><p style="margin:10px 0 0;font-size:14px;"><strong>核心建议：</strong>${lvl.advice}</p></div></div><div class="report_section"><div class="r-h2">二、四维情绪分析</div>${Object.entries(scores).map(([k,v])=>{let maxScore=k==='fluctuation'?40:k==='trigger'?32:k==='recovery'?32:32;let level=pct=v/maxScore*100;level=level<=25?'良好':(level<=50?'一般':'需改善');let color=level==='良好'?'#00B894':(level==='一般'?'#FDCB6E':'#e17055');return`<div style="margin-bottom:15px;padding:12px;background:#fafafa;border-radius:8px;"><div style="font-weight:700;margin-bottom:5px;">${['情绪波动度','触发敏感度','情绪恢复力','情绪控制力'][['fluctuation','trigger','recovery','control'].indexOf(k)]}</div><div style="height:6px;background:#eee;border-radius:3px;"><div style="height:100%;width:${(v/maxScore)*100}%;background:${color};border-radius:3px;"></div></div><div style="font-size:12px;color:#999;">状态：<span style="color:${color}">${level}</span></div></div>`}).join('')}</div><div class="report_section"><div class="r-h2">三、提升方案</div><div class="r-box"><ul style="margin:0;padding-left:20px;line-height:2;">${lvl.points.map(p=>`<li>${p}</li>`).join('')}</ul></div></div><div style="text-align:center;color:#ccc;font-size:12px;margin-top:40px;">2026情绪稳定度月度检测·专业心理测评</div>`;document.getElementById('report-content').innerHTML=html;document.getElementById('report-modal').style.display='block';}
function closeReport(){document.getElementById('report-modal').style.display='none';}
async function exportPDF(){const{jsPDF}=window.jspdf;const doc=new jsPDF();doc.setFillColor(0,184,148);doc.rect(0,0,210,40,'F');doc.setTextColor(255,255,255);doc.setFontSize(22);doc.text('情绪稳定度月度检测报告',105,25,{align:'center'});doc.setTextColor(100,100,100);doc.setFontSize(10);doc.text('专业心理测评·2026月度版',105,35,{align:'center'});let y=55;const lvl=levels.find(l=>parseInt(document.getElementById('res-score').innerText)<=l.max)||levels[levels.length-1];doc.setTextColor(0,0,0);doc.setFontSize(16);doc.text(`稳定度等级：${lvl.l}`,15,y);y+=10;doc.setFontSize(12);doc.text(lvl.d.substring(0,150)+'...',15,y);doc.save('情绪稳定度检测报告.pdf');}

 goToDemo(); });document.getElementById('next-btn').addEventListener('click',initTest);document.getElementById('show-report-btn').addEventListener('click',showReport);document.getElementById('close-report-btn').addEventListener('click',closeReport);document.getElementById('export-pdf-btn').addEventListener('click',exportPDF);
