<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>城市性格测试 - 开始答题</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/questionnaire.css">
    <!-- 引入安全工具库（必须在head中尽早加载） -->
    <script src="/static/js/test-security.js"></script>
    <style>
        /* 页面禁用样式 */
        body.page-disabled {
            pointer-events: none;
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            text-align: center;
            font-size: 18px;
            color: #f56c6c;
            font-weight: bold;
            padding: 20px;
            box-sizing: border-box;
        }
        .error-overlay p {
            margin: 0;
            line-height: 1.6;
        }
    </style>
</head>
<body class="page-disabled">
    <!-- 测试页主容器 -->
    <div class="questionnaire-container">
        <!-- 顶部进度条区域 -->
        <header class="questionnaire-header">
            <div class="progress-info">
                <span class="progress-text" id="progress-text">第 1 题 / 共 45 题</span>
                <span class="progress-percentage" id="progress-percentage">0%</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar">
                    <div class="progress-bar-fill" id="progress-bar-fill"></div>
                </div>
            </div>
            <div class="dimension-info" id="dimension-info">
                <span class="dimension-icon" id="dimension-icon">⏰</span>
                <span class="dimension-name" id="dimension-name">生活节奏</span>
            </div>
        </header>

        <!-- 题目展示区域 -->
        <main class="questionnaire-main">
            <div class="question-card" id="question-card">
                <h2 class="question-text" id="question-text">
                    <!-- 题目文本将通过JavaScript动态填充 -->
                </h2>
            </div>

            <!-- 选项按钮区域 -->
            <div class="options-container" id="options-container">
                <!-- 选项按钮将通过JavaScript动态生成 -->
            </div>
        </main>

        <!-- 导航按钮区域 -->
        <footer class="questionnaire-footer">
            <button class="nav-btn prev-btn" id="prev-btn" disabled>
                <span class="btn-icon">←</span>
                <span class="btn-text">上一题</span>
            </button>
            <div class="question-counter">
                <span id="current-question">1</span> / <span id="total-questions">45</span>
            </div>
            <button class="nav-btn next-btn" id="next-btn">
                <span class="btn-text">下一题</span>
                <span class="btn-icon">→</span>
            </button>
            <button class="nav-btn submit-btn" id="submit-btn" style="display: none;">
                <span class="btn-text">提交测评</span>
                <span class="btn-icon">✓</span>
            </button>
        </footer>
    </div>

    <!-- 错误提示容器 -->
    <div id="errorOverlay" class="error-overlay" style="display: none;">
        <p id="errorMessage"></p>
    </div>

    <!-- 启用安全功能（在本地开发环境会自动禁用，方便调试） -->
    <script>
        // 等待DOM加载完成后再启用安全功能
        (function() {
            function enableSecurity() {
                if (typeof TestSecurity !== 'undefined') {
                    TestSecurity.enable();
                } else {
                    console.error('[TestSecurity] 安全工具库未加载');
                }
            }
            
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', enableSecurity);
            } else {
                enableSecurity();
            }
        })();
    </script>
    
    <!-- 引入验证SDK（必需） -->
    <script src="/static/js/link-validator.js"></script>
    <script>
        // 初始化验证SDK
        let validatorInstance = null;
        
        if (typeof PsyTestValidator !== 'undefined') {
            // 明确传入testCode，因为CMT测试使用test.html而不是index.html，SDK可能无法从URL自动提取
            PsyTestValidator.init('cmt', {
                onSuccess: function(result, validator) {
                    console.log('SDK初始化成功，链接有效:', result);
                    validatorInstance = validator;
                    window.linkValidator = validator;
                    // 页面启用
                    document.body.classList.remove('page-disabled');
                    const errorOverlay = document.getElementById('errorOverlay');
                    if (errorOverlay) {
                        errorOverlay.style.display = 'none';
                    }
                },
                onError: function(error) {
                    console.error('SDK初始化失败，链接无效:', error);
                    // 尝试获取实例，即使无效
                    if (window.PsyTestValidator && typeof window.PsyTestValidator.getInstance === 'function') {
                        validatorInstance = window.PsyTestValidator.getInstance();
                    }
                    // 确保 window.linkValidator 被设置（即使验证失败）
                    if (validatorInstance) {
                        window.linkValidator = validatorInstance;
                    }
                    // 页面禁用，显示错误提示
                    document.body.classList.add('page-disabled');
                    const errorOverlay = document.getElementById('errorOverlay');
                    if (errorOverlay) {
                        const errorMessage = document.getElementById('errorMessage');
                        if (errorMessage) {
                            errorMessage.textContent = error.message || '测试链接无效，请检查链接是否正确';
                        }
                        errorOverlay.style.display = 'flex';
                    }
                },
                onLoad: function(data) {
                    console.log('SDK加载完成回调:', data);
                    // 确保获取到validator实例
                    if (!validatorInstance) {
                        if (window.PsyTestValidator && typeof window.PsyTestValidator.getInstance === 'function') {
                            validatorInstance = window.PsyTestValidator.getInstance();
                        }
                        if (!validatorInstance && window.linkValidator) {
                            validatorInstance = window.linkValidator;
                        }
                    }
                    if (validatorInstance) {
                        window.linkValidator = validatorInstance;
                    }
                    
                    // 答题页不需要推广信息，禁用SDK的自动添加推广链接功能
                    window.__RPI_DISABLE_SDK_PROMOTION = true;
                    
                    // 如果链接有效且有测试结果，跳转到报告页（需要包含token参数）
                    if (data.valid && data.has_local_result) {
                        let reportUrl = 'report.html';
                        const urlParams = new URLSearchParams();
                        const token = validatorInstance && validatorInstance.token;
                        const isUnlimited = validatorInstance && validatorInstance.unlimited;
                        if (isUnlimited && token) {
                            urlParams.set('unlimited', 'true');
                            urlParams.set('token', token);
                        } else if (token) {
                            urlParams.set('token', token);
                        }
                        const queryString = urlParams.toString();
                        if (queryString) {
                            reportUrl = `${reportUrl}?${queryString}`;
                        }
                        window.location.href = reportUrl;
                        return;
                    }
                }
            });
        } else {
            console.error('验证SDK未加载');
        }
    </script>

    <!-- 加载数据文件 -->
    <script src="js/questions.js"></script>
    <script src="js/dimensions.js"></script>
    <script src="js/cities.js"></script>
    <script src="js/calculator-standalone.js"></script>
    <script src="js/questionnaire.js"></script>
</body>
</html>
