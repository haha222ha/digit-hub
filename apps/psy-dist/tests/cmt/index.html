<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>城市匹配测试 - 发现你的命定城市</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/welcome.css">
    <!-- 引入安全工具库（必须在head中尽早加载） -->
    <script src="/static/js/test-security.js"></script>
    <style>
        /* 页面禁用样式 */
        body.page-disabled {
            pointer-events: none;
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            text-align: center;
            font-size: 18px;
            color: #f56c6c;
            font-weight: bold;
            padding: 20px;
            box-sizing: border-box;
        }
        .error-overlay p {
            margin: 0;
            line-height: 1.6;
        }
    </style>
</head>
<body class="page-disabled">
    <!-- 主容器 -->
    <div class="welcome-container">
        <!-- 顶部导航栏 -->
        <header class="top-nav">
            <div class="nav-left">
                <div class="nav-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#3182ce;stop-opacity:1" />
                                <stop offset="50%" style="stop-color:#38b2ac;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#805ad5;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <rect width="24" height="24" rx="8" fill="url(#iconGradient)"/>
                        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="white"/>
                    </svg>
                </div>
                <div class="nav-title-wrapper">
                    <h1 class="nav-title">城市匹配测试</h1>
                    <div class="nav-title-en">CITY MATCH</div>
                </div>
            </div>
        </header>

        <!-- 主欢迎区域（渐变背景） -->
        <section class="hero-section">
            <div class="hero-content">
                <!-- 信息标签 -->
                <div class="info-tag">
                    <span class="tag-dot"></span>
                    <span id="info-text">45道测评·11大维度·24座城市</span>
                </div>

                <!-- 主标题 -->
                <h2 class="hero-title">
                    <span class="title-text">发现你的</span>
                    <span class="title-highlight">
                        <span class="highlight-word highlight-orange">命定</span>
                        <span class="highlight-word highlight-blue">城市</span>
                    </span>
                </h2>

                <!-- 描述文字 -->
                <div class="hero-description">
                    <p>每个人心中都有一座城,等待被发现</p>
                    <p>测一测,哪座城市最能成为你的灵魂栖息地</p>
                </div>

                <!-- 开始探索按钮 -->
                <button class="explore-btn" id="start-test-btn">
                    <span class="play-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="12" r="10" fill="white"/>
                            <path d="M10 8v8l6-4-6-4z" fill="#FF6B35"/>
                        </svg>
                    </span>
                    <span class="btn-text">开始探索</span>
                </button>
            </div>
        </section>

        <!-- 统计卡片区域 -->
        <section class="stats-section">
            <div class="stats-card">
                <div class="stat-item">
                    <div class="stat-icon stat-icon-clock">⏰</div>
                    <div class="stat-number">6-10</div>
                    <div class="stat-label">分钟</div>
                </div>
                <div class="stat-item">
                    <div class="stat-icon stat-icon-doc">📄</div>
                    <div class="stat-number" id="question-count">45</div>
                    <div class="stat-label">题目</div>
                </div>
                <div class="stat-item">
                    <div class="stat-icon stat-icon-location">📍</div>
                    <div class="stat-number" id="city-count">24</div>
                    <div class="stat-label">城市</div>
                </div>
                <div class="stat-item">
                    <div class="stat-icon stat-icon-shield">🛡️</div>
                    <div class="stat-number">100%</div>
                    <div class="stat-label">隐私</div>
                </div>
            </div>
        </section>

        <!-- 城市滚动区域 -->
        <section class="cities-scroll-section">
            <div class="cities-scroll-container">
                <div class="cities-scroll" id="cities-scroll">
                    <!-- 城市卡片将通过JavaScript动态生成 -->
                </div>
            </div>
        </section>

        <!-- 四大类型板块 -->
        <section class="city-types-section">
            <div class="section-header">
                <div class="section-icon">📊</div>
                <h2 class="section-title">四大类型 各有精彩</h2>
                <p class="section-subtitle">从繁华都市到诗意远方,总有一座与你心灵共振</p>
            </div>
            <div class="city-types-grid" id="city-types-grid">
                <!-- 城市类型卡片将通过JavaScript动态生成 -->
            </div>
        </section>

        <!-- 11项维度板块 -->
        <section class="dimensions-section">
            <div class="section-header">
                <h2 class="section-title">
                    <span class="title-blue">11项维度</span>
                    <span class="title-purple">精准匹配</span>
                </h2>
                <p class="section-subtitle">从生活方式到价值追求,全方位解读你的城市偏好</p>
            </div>
            <div class="dimensions-grid" id="dimensions-grid">
                <!-- 维度卡片将通过JavaScript动态生成 -->
            </div>
        </section>

        <!-- 准备开始板块 -->
        <section class="ready-section">
            <div class="ready-card">
                <div class="ready-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" fill="url(#gradient1)"/>
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="white"/>
                        <defs>
                            <linearGradient id="gradient1" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" style="stop-color:#4FD1C7;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#667EEA;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h2 class="ready-title">
                    准备好发现你的<span class="title-gradient">理想城市</span>了吗?
                </h2>
                <p class="ready-description">只需几分钟,跟随直觉作答,开启你的城市探索之旅</p>
                <button class="ready-btn" id="ready-start-btn">
                    <span class="btn-text">立即开始</span>
                    <span class="btn-arrow">→</span>
                </button>
                <div class="ready-features">
                    <div class="feature-item">
                        <span class="feature-icon">✓</span>
                        <span class="feature-text">科学算法</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">🛡️</span>
                        <span class="feature-text">隐私保护</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">📄</span>
                        <span class="feature-text">详细报告</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 底部说明区域（用于SDK添加推广链接） -->
        <footer class="welcome-footer" style="padding: 24px 20px; text-align: center; margin-top: 40px;">
            <p style="color: #718096; font-size: 14px; margin: 0;">
                本测试由心象测提供
            </p>
        </footer>
    </div>

    <!-- 错误提示容器 -->
    <div id="errorOverlay" class="error-overlay" style="display: none;">
        <p id="errorMessage"></p>
    </div>

    <!-- 启用安全功能（在本地开发环境会自动禁用，方便调试） -->
    <script>
        // 等待DOM加载完成后再启用安全功能
        (function() {
            function enableSecurity() {
                if (typeof TestSecurity !== 'undefined') {
                    TestSecurity.enable();
                } else {
                    console.error('[TestSecurity] 安全工具库未加载');
                }
            }
            
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', enableSecurity);
            } else {
                enableSecurity();
            }
        })();
    </script>
    
    <!-- 引入验证SDK（必需） -->
    <script src="/static/js/link-validator.js"></script>
    <script>
        // 初始化验证SDK
        let validatorInstance = null;
        
        if (typeof PsyTestValidator !== 'undefined') {
            // 明确传入testCode，因为CMT测试使用test.html而不是index.html，SDK可能无法从URL自动提取
            PsyTestValidator.init('cmt', {
                onSuccess: function(result, validator) {
                    console.log('SDK初始化成功，链接有效:', result);
                    validatorInstance = validator;
                    window.linkValidator = validator;
                    // 页面启用
                    document.body.classList.remove('page-disabled');
                    const errorOverlay = document.getElementById('errorOverlay');
                    if (errorOverlay) {
                        errorOverlay.style.display = 'none';
                    }
                },
                onError: function(error) {
                    console.error('SDK初始化失败，链接无效:', error);
                    // 尝试获取实例，即使无效
                    if (window.PsyTestValidator && typeof window.PsyTestValidator.getInstance === 'function') {
                        validatorInstance = window.PsyTestValidator.getInstance();
                    }
                    // 确保 window.linkValidator 被设置（即使验证失败）
                    if (validatorInstance) {
                        window.linkValidator = validatorInstance;
                    }
                    // 页面不禁用，允许用户看到页面内容
                    document.body.classList.remove('page-disabled');
                    const errorOverlay = document.getElementById('errorOverlay');
                    if (errorOverlay) {
                        errorOverlay.style.display = 'none';
                    }
                },
                onLoad: function(data) {
                    console.log('SDK加载完成回调:', data);
                    // 确保获取到validator实例
                    if (!validatorInstance) {
                        if (window.PsyTestValidator && typeof window.PsyTestValidator.getInstance === 'function') {
                            validatorInstance = window.PsyTestValidator.getInstance();
                        }
                        if (!validatorInstance && window.linkValidator) {
                            validatorInstance = window.linkValidator;
                        }
                    }
                    if (validatorInstance) {
                        window.linkValidator = validatorInstance;
                    }
                    
                    // 调用addPromotionLink确保推广链接显示（首页使用welcome-footer容器）
                    setTimeout(() => {
                        if (typeof PsyTestValidator !== 'undefined' && typeof PsyTestValidator.addPromotionLink === 'function') {
                            PsyTestValidator.addPromotionLink();
                        }
                    }, 100);
                    
                    // 检查是否是重新测试（通过URL参数判断）
                    const urlParams = new URLSearchParams(window.location.search);
                    const isRestart = urlParams.get('restart') === 'true';
                    
                    // 如果是重新测试，不清除本地结果，也不自动跳转
                    if (isRestart) {
                        console.log('检测到重新测试参数，允许重新测试，不自动跳转到报告页');
                        // 清除restart参数（避免刷新后再次触发）
                        urlParams.delete('restart');
                        const newUrl = window.location.pathname + (urlParams.toString() ? '?' + urlParams.toString() : '');
                        window.history.replaceState({}, '', newUrl);
                        return;
                    }
                    
                    // 如果链接有效且有测试结果，跳转到报告页（需要包含token参数）
                    if (data.valid && data.has_local_result) {
                        let reportUrl = 'report.html';
                        const reportUrlParams = new URLSearchParams();
                        const token = validatorInstance && validatorInstance.token;
                        const isUnlimited = validatorInstance && validatorInstance.unlimited;
                        if (isUnlimited && token) {
                            reportUrlParams.set('unlimited', 'true');
                            reportUrlParams.set('token', token);
                        } else if (token) {
                            reportUrlParams.set('token', token);
                        }
                        const queryString = reportUrlParams.toString();
                        if (queryString) {
                            reportUrl = `${reportUrl}?${queryString}`;
                        }
                        window.location.href = reportUrl;
                        return;
                    }
                }
            });
        } else {
            console.error('验证SDK未加载');
        }
    </script>

    <!-- 加载数据文件 -->
    <script src="js/cities.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/dimensions.js"></script>
    <script src="js/welcome.js"></script>
</body>
</html>
