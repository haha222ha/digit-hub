<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const questions = [
    {d:'time',t:'时间分配',q:"你每天有多少时间属于自己的？",o:[{t:"2小时以上，很充裕",s:10},{t:"1-2小时，刚好够",s:7},{t:"不到1小时，很紧张",s:3},{t:"完全没有私人时间",s:0}]},
    {d:'time',t:'时间分配',q:"周末你会加班吗？",o:[{t:"从不，周末完全属于自己",s:10},{t:"偶尔，偶尔处理工作",s:7},{t:"经常，周末也要工作",s:3},{t:"每周末都加班",s:0}]},
    {d:'time',t:'时间分配',q:"你能按时下班吗？",o:[{t:"几乎每天都能",s:10},{t:"大部分时候能",s:7},{t:"偶尔能",s:3},{t:"几乎不能",s:0}]},
    {d:'time',t:'时间分配',q:"你会利用碎片时间休息吗？",o:[{t:"会，很注意休息",s:10},{t:"偶尔会",s:7},{t:"很少",s:3},{t:"完全不会",s:0}]},
    {d:'energy',t:'精力状态',q:"下班后你还有精力做其他事吗？",o:[{t:"精力充沛，还能做很多",s:10},{t:"还行，能做一些",s:7},{t:"很疲惫，只想躺着",s:3},{t:"完全没精力做任何事",s:0}]},
    {d:'energy',t:'精力状态',q:"你经常感到疲劳吗？",o:[{t:"几乎不，很精神",s:10},{t:"偶尔会",s:7},{t:"经常感到疲劳",s:3},{t:"每天都感到很累",s:0}]},
    {d:'energy',t:'精力状态',q:"你的睡眠质量如何？",o:[{t:"很好，一觉到天亮",s:10},{t:"还可以",s:7},{t:"不太好，经常失眠",s:3},{t:"很差，严重失眠",s:0}]},
    {d:'energy',t:'精力状态',q:"你会运动锻炼吗？",o:[{t:"每周规律运动",s:10},{t:"偶尔运动",s:7},{t:"很少运动",s:3},{t:"从不运动",s:0}]},
    {d:'emotion',t:'情感需求',q:"你有时间陪伴家人吗？",o:[{t:"有很多时间陪伴",s:10},{t:"有时间，但不够",s:7},{t:"很少时间陪伴",s:3},{t:"完全没有时间",s:0}]},
    {d:'emotion',t:'情感需求',q:"你与朋友还有联系吗？",o:[{t:"经常和朋友聚会",s:10},{t:"偶尔联系",s:7},{t:"很少联系",s:3},{t:"几乎没有朋友联系",s:0}]},
    {d:'emotion',t:'情感需求',q:"你感到孤独吗？",o:[{t:"完全不孤独",s:10},{t:"偶尔会",s:7},{t:"经常感到孤独",s:3},{t:"一直很孤独",s:0}]},
    {d:'emotion',t:'情感需求',q:"你的社交生活丰富吗？",o:[{t:"非常丰富",s:10},{t:"比较丰富",s:7},{t:"比较单调",s:3},{t:"完全没有社交",s:0}]},
    {d:'mindset',t:'心态状态',q:"你对目前的工作生活满意吗？",o:[{t:"非常满意",s:10},{t:"比较满意",s:7},{t:"不太满意",s:3},{t:"很不满意",s:0}]},
    {d:'mindset',t:'心态状态',q:"你会因为工作忽略生活而焦虑吗？",o:[{t:"完全不焦虑",s:10},{t:"偶尔会",s:7},{t:"经常焦虑",s:3},{t:"一直很焦虑",s:0}]},
    {d:'mindset',t:'心态状态',q:"你能接受目前的工作强度吗？",o:[{t:"完全能接受",s:10},{t:"基本能接受",s:7},{t:"不太能接受",s:3},{t:"完全不能接受",s:0}]},
    {d:'mindset',t:'心态状态',q:"你对未来有期待吗？",o:[{t:"很有希望",s:10},{t:"比较乐观",s:7},{t:"比较迷茫",s:3},{t:"很悲观",s:0}]},
    {d:'social',t:'社交健康',q:"你在职场有人支持吗？",o:[{t:"有很多支持",s:10},{t:"有一些",s:7},{t:"很少",s:3},{t:"完全没有",s:0}]},
    {d:'social',t:'社交健康',q:"你有人生导师或榜样吗？",o:[{t:"有，且经常交流",s:10},{t:"有，偶尔交流",s:7},{t:"没有",s:3},{t:"不需要",s:0}]},
    {d:'social',t:'社交健康',q:"你能从工作中获得成就感吗？",o:[{t:"经常有",s:10},{t:"偶尔有",s:7},{t:"很少有",s:3},{t:"完全没有",s:0}]},
    {d:'social',t:'社交健康',q:"你的工作对社交有帮助吗？",o:[{t:"帮助很大",s:10},{t:"有一些帮助",s:7},{t:"帮助很少",s:3},{t:"没有帮助",s:0}]}
];
const levels = [
    {max:40,l:"严重失衡",c:"#FF7675",d:"你的工作生活严重失衡！需要立即调整。",advice:"这是危险信号，建议立即减少工作量，增加休息时间。",points:["立即减少加班","每天留出休息时间","寻求工作调整","关注身心健康"]},
    {max:80,l:"中度失衡",c:"#FDCB6E",d:"你的工作生活有一定失衡，需要关注。",advice:"尽快调整，避免情况恶化。",points:["减少不必要的加班","增加运动锻炼","多陪伴家人朋友","调整工作心态"]},
    {max:120,l:"基本平衡",c:"#00CEC9",d:"你的工作生活基本平衡，保持得不错。",advice:"继续保持目前的状态，注意不要过度工作。",points:["保持现有节奏","注意劳逸结合","定期评估平衡","预防潜在风险"]},
    {max:200,l:"高度平衡",c:"#00B894",d:"你是工作生活平衡高手！状态非常好。",advice:"你已经找到了适合自己的节奏，继续保持并分享经验。",points:["继续保持","帮助他人平衡","进一步优化","享受美好生活"]}
];
let currQList=[],currIdx=0,scores={time:0,energy:0,emotion:0,mindset:0,social:0};
function goToDemo(){document.getElementById('page-intro').style.display='none';document.getElementById('page-demo').style.display='block';}
function initTest(){currQList=[...questions];currIdx=0;scores={time:0,energy:0,emotion:0,mindset:0,social:0};document.getElementById('page-demo').style.display='none';document.getElementById('page-test').style.display='flex';renderQuestion();}
function renderQuestion(){const q=currQList[currIdx];document.getElementById('progress-text').innerText=`${currIdx+1}/${currQList.length}`;document.getElementById('progress-fill').style.width=`${(currIdx/currQList.length)*100}%`;document.getElementById('dim-tag').innerText=`维度：${q.t}`;document.getElementById('q-category').innerText=q.t;const wrapper=document.getElementById('question-wrapper');wrapper.classList.remove('slide-up');void wrapper.offsetWidth;wrapper.classList.add('slide-up');document.getElementById('question-text').innerText=q.q;const box=document.getElementById('options-box');box.innerHTML='';q.o.forEach(opt=>{const btn=document.createElement('div');btn.className='option-btn';btn.innerText=opt.t;btn.onclick=()=>{Array.from(box.children).forEach(c=>c.classList.remove('selected'));btn.classList.add('selected');setTimeout(()=>handleAnswer(q.d,opt.s),200);};box.appendChild(btn);});}
function handleAnswer(dim,val){scores[dim]+=val;if(currIdx<currQList.length-1){currIdx++;renderQuestion();}else{finishTest();}}
function finishTest(){document.getElementById('page-test').style.display='none';setTimeout(()=>{document.getElementById('page-result').style.display='block';calculateResult();},2000);}
function calculateResult(){let total=Object.values(scores).reduce((a,b)=>a+b,0);let finalScore=Math.round(total);let lvl=levels.find(l=>finalScore<=l.max)||levels[levels.length-1];let start=0;const timer=setInterval(()=>{start++;document.getElementById('res-score').innerText=start;if(start>=finalScore)clearInterval(timer);},15);document.getElementById('res-level').innerText=lvl.l;document.getElementById('res-level').style.background=lvl.c;document.getElementById('res-desc').innerText=lvl.d;renderBars(scores);}
function renderBars(s){const box=document.getElementById('bars-container');const dims=[{k:'time',n:'时间'},{k:'energy',n:'精力'},{k:'emotion',n:'情感'},{k:'mindset',n:'心态'},{k:'social',n:'社交'}];let html='';dims.forEach(d=>{let pct=Math.min((s[d.k]/10)*100,100);let color=s[d.k]<=24?'#00B894':(s[d.k]<=48?'#00CEC9':'#FDCB6E');if(s[d.k]>56)color='#FF7675';html+=`<div class="dim-row"><div class="dim-info"><span class="dim-name">${d.n}</span></div><div class="dim-bar-bg"><div class="dim-bar-fill" style="width:${pct}%;background:${color};"></div></div><div class="dim-val" style="color:${color}">${Math.round(pct)}%</div></div>`;});box.innerHTML=html;}
function showReport(){const total=parseInt(document.getElementById('res-score').innerText);const lvl=levels.find(l=>total<=l.max)||levels[levels.length-1];let html=`<div class="report_section"><div class="r-h1">一、工作生活平衡诊断</div><div class="r-box" style="border-left:5px solid ${lvl.c};"><div style="font-size:20px;font-weight:900;color:${lvl.c};margin-bottom:8px;">平衡等级：${lvl.l}</div><p style="margin:0;font-size:14px;line-height:1.6;color:#555;">${lvl.d}</p><p style="margin:10px 0 0;font-size:14px;"><strong>核心建议：</strong>${lvl.advice}</p></div></div><div class="report_section"><div class="r-h2">二、五维度深度分析</div>${Object.entries(scores).map(([k,v])=>{let level=v<=24?'优秀':(v<=48?'良好':'待改善');let color=v<=24?'#00B894':(v<=48?'#00CEC9':'#FF7675');return`<div style="margin-bottom:15px;padding:12px;background:#fafafa;border-radius:8px;"><div style="font-weight:700;margin-bottom:5px;">${['时间分配','精力状态','情感需求','心态状态','社交健康'][['time','energy','emotion','mindset','social'].indexOf(k)]}</div><div style="height:6px;background:#eee;border-radius:3px;"><div style="height:100%;width:${(v/10)*100}%;background:${color};border-radius:3px;"></div></div><div style="font-size:12px;color:#999;">状态：<span style="color:${color}">${level}</span> (得分：${v}/10)</div></div>`}).join('')}</div><div class="report_section"><div class="r-h2">三、平衡提升方案</div><div class="r-box"><ul style="margin:0;padding-left:20px;line-height:2;">${lvl.points.map(p=>`<li>${p}</li>`).join('')}</ul></div></div><div style="text-align:center;color:#ccc;font-size:12px;margin-top:40px;">2026工作生活平衡测试·专业心理测评</div>`;document.getElementById('report-content').innerHTML=html;document.getElementById('report-modal').style.display='block';}
function closeReport(){document.getElementById('report-modal').style.display='none';}
async function exportPDF(){const{jsPDF}=window.jspdf;const doc=new jsPDF();doc.setFillColor(0,206,201);doc.rect(0,0,210,40,'F');doc.setTextColor(255,255,255);doc.setFontSize(22);doc.text('工作生活平衡深度分析报告',105,25,{align:'center'});doc.setTextColor(100,100,100);doc.setFontSize(10);doc.text('专业心理测评·2026全新版',105,35,{align:'center'});let y=55;const lvl=levels.find(l=>parseInt(document.getElementById('res-score').innerText)<=l.max)||levels[levels.length-1];doc.setTextColor(0,0,0);doc.setFontSize(16);doc.text(`平衡等级：${lvl.l}`,15,y);y+=10;doc.setFontSize(12);doc.text(lvl.d.substring(0,150)+'...',15,y);doc.save('工作生活平衡报告.pdf');}
document.getElementById('start-btn').addEventListener('click', function() {
        
 goToDemo(); });document.getElementById('next-btn').addEventListener('click',initTest);document.getElementById('show-report-btn').addEventListener('click',showReport);document.getElementById('close-report-btn').addEventListener('click',closeReport);document.getElementById('export-pdf-btn').addEventListener('click',exportPDF);
