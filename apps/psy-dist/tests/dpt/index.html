<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="你体内藏着哪种危险人格？三十五题，照见你不愿承认的那一面。本测试纯属娱乐，不代表任何医学诊断。">
<title>你体内藏着哪种危险人格？</title>
<script src="/static/js/test-security.js"></script>
<script>
  if (typeof TestSecurity !== 'undefined') {
    TestSecurity.enable();
  }
</script>
<link rel="stylesheet" href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@400;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@400;700&display=swap"></noscript>
<style>
  :root{
    --cream:#FCFAF7;
    --cream-2:#F5EFE6;
    --darkBerry:#42242E;
    --warmBrown:#856647;
    --cherry:#DB143C;
    --cherry-soft:#E84A6B;
    --peach:#FBE5DA;
    --line:#E5D9C8;
    --deep:#8B0000;
    /* 人格主题色（默认病娇，结果页动态覆盖） */
    --p-color:#8B2A4A;
    --p-deep:#4A1020;
    --p-soft:#C44A6E;
    --p-grad1:#8B2A4A;
    --p-grad2:#4A1020;
    /* 淡主题底色（默认cream，结果页动态覆盖） */
    --p-bg:#FCFAF7;
    /* 卡片分类色 */
    --c-base:#6B5B95;
    --c-trigger:#D4761F;
    --c-danger:#B91C1C;
    --c-aware:#2A7A6E;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    background:var(--p-bg);
    color:var(--darkBerry);
    font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;
    line-height:1.7;
    overflow-x:hidden;
  }
  .stage{max-width:440px;margin:0 auto;position:relative}
  .page{display:none;min-height:100vh}
  .page.active{display:block}
  .hidden{display:none!important}

  /* ========== 首页 ========== */
  .home{padding:0 24px 60px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;position:relative}
  .home .seal{
    position:absolute;top:28px;right:24px;
    width:54px;height:54px;background:var(--cherry);color:#fff;
    font-family:'Noto Serif SC','STKaiti','KaiTi',cursive;font-size:22px;
    line-height:54px;text-align:center;border-radius:4px;
    box-shadow:0 2px 12px rgba(219,20,60,.3);transform:rotate(6deg);
  }
  .home .kicker{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-size:12px;color:var(--warmBrown);letter-spacing:.4em;margin-bottom:24px}
  .home h1{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-weight:900;font-size:48px;line-height:1.2;letter-spacing:.04em;margin-bottom:8px;color:var(--darkBerry)}
  .home h1 .ch{color:var(--cherry);position:relative;display:inline-block}
  .home h1 .ch::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:8px;background:var(--peach);z-index:-1;border-radius:4px}
  .home .sub{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-size:15px;color:var(--warmBrown);margin-bottom:32px;letter-spacing:.08em}
  .home .intro{font-size:14px;color:var(--darkBerry);margin-bottom:14px;line-height:2;opacity:.85}
  .home .intro em{color:var(--cherry);font-style:normal;font-weight:500}
  .home .cta{display:inline-flex;align-items:center;gap:12px;padding:16px 40px;background:linear-gradient(135deg,var(--cherry),var(--cherry-soft));color:#fff;font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-weight:700;font-size:16px;letter-spacing:.15em;border:none;border-radius:999px;box-shadow:0 8px 24px rgba(219,20,60,.28);cursor:pointer;transition:transform .25s,box-shadow .25s;margin-top:24px}
  .home .cta:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(219,20,60,.36)}
  .home .disc{margin-top:44px;font-size:11px;color:var(--warmBrown);letter-spacing:.1em;text-align:center;opacity:.7}

  body.page-disabled{pointer-events:none;opacity:.6;cursor:not-allowed}
  .welcome-footer,.report-footer{display:block!important;visibility:visible!important;width:100%;box-sizing:border-box}
  .welcome-footer #link-validator-promotion-link,
  .report-footer #link-validator-promotion-link{
    width:100%;text-align:center;padding-top:12px;margin-top:12px;
    border-top:1px solid var(--line);box-sizing:border-box;
    display:block!important;visibility:visible!important;opacity:1!important;
    font-size:12px;color:var(--warmBrown);line-height:1.6;
  }
  .result-sdk-foot{padding:0 24px 40px;text-align:center}
  .result-sdk-foot .disc{margin-top:8px;font-size:11px;color:var(--warmBrown);letter-spacing:.1em;opacity:.7}

  /* ========== 答题页 ========== */
  .quiz{padding:0 24px 60px;min-height:100vh;display:flex;flex-direction:column}
  .quiz-top{display:flex;justify-content:center;align-items:center;margin-bottom:20px;padding-top:16px}
  .quiz-prog{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-size:14px;color:var(--cherry);font-weight:700}
  .quiz-prog b{font-size:20px}
  .bar{height:3px;background:var(--line);margin-bottom:44px;position:relative;border-radius:2px;overflow:hidden}
  .bar i{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,var(--cherry),var(--cherry-soft));border-radius:2px;transition:width .4s ease}
  .q-eyebrow{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-size:12px;color:var(--cherry);letter-spacing:.2em;margin-bottom:10px}
  .q-text{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-weight:700;font-size:25px;line-height:1.5;margin-bottom:40px;color:var(--darkBerry)}
  .opts{display:flex;flex-direction:column;gap:14px;flex:1}
  .opt{background:#fff;border:1px solid var(--line);padding:18px 20px;color:var(--darkBerry);font-size:15px;line-height:1.5;cursor:pointer;display:flex;align-items:center;gap:16px;border-radius:14px;transition:all .25s;box-shadow:0 1px 3px rgba(66,36,46,.04)}
  @media (hover:hover) and (pointer:fine){
    .opt:hover{border-color:var(--cherry);box-shadow:0 4px 12px rgba(219,20,60,.12);transform:translateY(-1px)}
  }
  .opt:active{border-color:var(--cherry);box-shadow:0 4px 12px rgba(219,20,60,.12);transform:scale(.98)}
  .opt .key{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-weight:700;color:var(--cherry);font-size:16px;width:30px;height:30px;border:1px solid var(--cherry);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .25s}
  .opt.selected{background:linear-gradient(135deg,#fff,var(--peach));border-color:var(--cherry);transform:scale(.98)}
  .opt.selected .key{background:var(--cherry);color:#fff}
  .quiz-cta{margin-top:32px;padding:14px;width:100%;background:#fff;color:var(--warmBrown);font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-weight:500;text-align:center;letter-spacing:.15em;border-radius:999px;cursor:pointer;border:1px solid var(--line);font-size:14px;transition:all .25s}
  .quiz-cta:hover:not(:disabled){border-color:var(--warmBrown);color:var(--darkBerry)}
  .quiz-cta:disabled{opacity:.35;cursor:default;pointer-events:none}
  .q-hint{margin-top:18px;text-align:center;font-size:12px;color:var(--warmBrown);opacity:.6;letter-spacing:.05em}

  /* ========== 报告页 ========== */
  .result{padding:0 24px 80px;min-height:100vh}
  .result .r-title{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-size:13px;color:var(--warmBrown);letter-spacing:.25em;text-align:center;margin-bottom:6px;padding-top:24px}
  .result .r-title-2{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-weight:700;font-size:21px;text-align:center;margin-bottom:8px;color:var(--darkBerry)}
  .result .r-title-2 .ch{color:var(--p-color)}
  .brush{height:14px;margin:24px 0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 14'><path d='M0,7 Q60,2 120,7 T240,7 T360,6 L400,7' stroke='%23DB143C' stroke-width='1.5' fill='none' opacity='.5'/><path d='M20,7 Q80,9 140,7 T260,7 T380,7' stroke='%23856647' stroke-width='1' fill='none' opacity='.4'/></svg>") center/100% 100% no-repeat}

  /* 身份主卡（增强版） */
  .hero{background:linear-gradient(160deg,var(--p-grad1) 0%,var(--p-grad2) 100%);border-radius:24px;padding:36px 26px;position:relative;overflow:hidden;margin-bottom:20px;box-shadow:0 8px 32px rgba(0,0,0,.15);color:#fff}
  .hero::before{content:attr(data-char);position:absolute;font-family:'Noto Serif SC','STKaiti','KaiTi',cursive;font-size:180px;color:rgba(255,255,255,.08);right:-20px;bottom:-50px;line-height:1;pointer-events:none}
  .hero-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
  .hero-tags{display:flex;flex-direction:column;gap:8px}
  .tag-level{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.3);color:#fff;font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-weight:700;font-size:13px;letter-spacing:.2em;padding:7px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.35)}
  .tag-tier{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);color:#fff;font-size:13px;letter-spacing:.1em;padding:6px 14px;border-radius:999px;width:fit-content}
  .hero-rank{text-align:right;flex-shrink:0}
  .hero-rank .num{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-weight:900;font-size:30px;line-height:1;color:#fff}
  .hero-rank .lbl{font-size:12px;color:rgba(255,255,255,.65);letter-spacing:.1em;margin-top:4px}
  .hero-name{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-weight:900;font-size:58px;color:#fff;line-height:1;margin-bottom:8px;letter-spacing:.08em;text-shadow:0 2px 12px rgba(0,0,0,.2)}
  .hero-sub{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-size:13px;color:rgba(255,255,255,.75);letter-spacing:.2em;margin-bottom:20px}
  .hero-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .hero-chips .chip{background:rgba(255,255,255,.18);font-size:13px;padding:6px 15px;border-radius:999px;color:#fff}
  .hero-quote{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-style:italic;font-size:17px;line-height:1.7;color:#fff;padding-top:16px;border-top:1px dashed rgba(255,255,255,.3)}

  /* 稀缺卡（独立小卡） */
  .scarce-card{background:#fff;border-radius:16px;padding:22px 24px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(66,36,46,.06)}
  .scarce-card .left{flex:1}
  .scarce-card .num{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-weight:900;font-size:34px;color:var(--p-color);line-height:1}
  .scarce-card .num small{font-size:20px}
  .scarce-card .lbl{font-size:13px;color:var(--warmBrown);margin-top:6px;letter-spacing:.05em}
  .scarce-card .right{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-size:13px;color:var(--warmBrown);text-align:right;letter-spacing:.1em;line-height:1.6}
  .scarce-card .right b{color:var(--p-color);font-size:16px}

  /* section 标题 */
  .sec-h{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-size:16px;font-weight:700;color:var(--darkBerry);letter-spacing:.05em;margin:32px 0 16px;display:flex;align-items:center;gap:10px}
  .sec-h::before{content:"";width:4px;height:20px;background:var(--p-color);border-radius:2px}
  .sec-h .en{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-size:11px;color:var(--warmBrown);letter-spacing:.2em;font-weight:400;margin-left:auto}

  /* 雷达图卡 */
  .radar-card{background:#fff;border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 2px 12px rgba(66,36,46,.06)}
  .radar-wrap{display:flex;justify-content:center}
  .radar-wrap svg{width:340px;height:340px}
  .radar-grid{stroke:#D4C4B0;fill:none;stroke-width:1}
  .radar-axis{stroke:#D4C4B0;stroke-width:1}
  .radar-data{fill:var(--p-fill);stroke:var(--p-color);stroke-width:2.5}
  .radar-pt{fill:#fff;stroke:var(--p-color);stroke-width:2.5}
  .radar-lbl{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-size:13px;fill:var(--darkBerry);font-weight:700}

  /* 维度评分卡 */
  .dims-card{background:#fff;border-radius:16px;padding:22px 24px;margin-bottom:20px;box-shadow:0 2px 12px rgba(66,36,46,.06)}
  .dim-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:15px}
  .dim-row:last-child{margin-bottom:0}
  .dim-row .nm{width:60px;color:var(--darkBerry);font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif}
  .dim-row .track{flex:1;height:9px;background:var(--cream-2);border-radius:5px;overflow:hidden}
  .dim-row .track i{display:block;height:100%;background:linear-gradient(90deg,var(--p-soft),var(--p-color));border-radius:5px}
  .dim-row .track.peak i{background:linear-gradient(90deg,var(--p-color),var(--p-deep))}
  .dim-row .val{width:48px;text-align:right;font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;color:var(--p-color);font-weight:700;font-size:14px}

  /* 人格定位九宫格 */
  .grid-card{background:#fff;border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 2px 12px rgba(66,36,46,.06)}
  .grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .grid9 .cell{aspect-ratio:1;border-radius:10px;background:var(--cream-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;text-align:center;position:relative;overflow:hidden}
  .grid9 .cell .gname{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-size:15px;font-weight:700;color:var(--darkBerry)}
  .grid9 .cell .grare{font-size:11px;color:var(--warmBrown);opacity:.7;letter-spacing:.05em}
  .grid9 .cell.active{background:linear-gradient(135deg,var(--p-grad1),var(--p-grad2));box-shadow:0 4px 14px rgba(0,0,0,.2)}
  .grid9 .cell.active .gname{color:#fff;font-size:17px}
  .grid9 .cell.active .grare{color:rgba(255,255,255,.85);font-size:12px}
  .grid9 .cell.active::after{content:"你";position:absolute;font-family:'Noto Serif SC','STKaiti','KaiTi',cursive;font-size:32px;color:rgba(255,255,255,.2)}
  .grid-foot{margin-top:14px;font-size:13px;color:var(--warmBrown);text-align:center;letter-spacing:.05em}
  .grid-foot b{color:var(--p-color)}

  /* 危险档案卡组 */
  .file-card{background:#fff;border-radius:16px;padding:22px 24px;margin-bottom:14px;box-shadow:0 2px 12px rgba(66,36,46,.06);border-left:4px solid var(--line);position:relative}
  .file-card.base{border-left-color:var(--c-base)}
  .file-card.trigger{border-left-color:var(--c-trigger)}
  .file-card.danger{border-left-color:var(--c-danger)}
  .file-card.aware{border-left-color:var(--c-aware)}
  .file-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .file-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-weight:900;font-size:16px;color:#fff;flex-shrink:0}
  .file-card.base .file-icon{background:var(--c-base)}
  .file-card.trigger .file-icon{background:var(--c-trigger)}
  .file-card.danger .file-icon{background:var(--c-danger)}
  .file-card.aware .file-icon{background:var(--c-aware)}
  .file-title{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-weight:700;font-size:17px;color:var(--darkBerry)}
  .file-title .sub{font-size:12px;color:var(--warmBrown);font-weight:400;margin-left:6px;letter-spacing:.05em}
  .file-body{font-size:15px;line-height:1.9;color:var(--darkBerry);opacity:.9}
  .file-body p{margin-bottom:8px}
  .file-body p:last-child{margin-bottom:0}
  .file-body em{font-style:normal;color:var(--p-color);font-weight:500}
  .file-quote{margin-top:12px;padding:14px 16px;background:var(--cream-2);border-radius:10px;font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-style:italic;font-size:15px;color:var(--darkBerry);line-height:1.7}

  /* 完整分析 */
  .analysis{margin-bottom:20px}
  .analysis p{font-size:14px;line-height:2.1;color:var(--darkBerry);margin-bottom:16px;opacity:.88}
  .radar-text{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-style:italic;font-size:19px;line-height:1.7;color:var(--p-color);padding:24px 20px;background:linear-gradient(135deg,#fff,var(--peach));border-radius:16px;margin-top:8px;text-align:center;position:relative}

  /* 人格CP */
  .cp{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
  .cp-card{background:#fff;border-radius:16px;padding:20px 22px;display:flex;align-items:flex-start;gap:14px;box-shadow:0 2px 12px rgba(66,36,46,.06);border-left:4px solid var(--line)}
  .cp-card.match{border-left-color:#C9A961}
  .cp-card.clash{border-left-color:var(--p-color)}
  .cp-mark{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-size:13px;font-weight:700;letter-spacing:.15em;padding:6px 14px;flex-shrink:0;border-radius:999px}
  .cp-card.match .cp-mark{background:#FFF4D6;color:#8C6D1F}
  .cp-card.clash .cp-mark{background:var(--peach);color:var(--p-color)}
  .cp-body .cp-name{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-weight:700;font-size:18px;margin-bottom:4px;color:var(--darkBerry)}
  .cp-body .cp-reason{font-size:14px;color:var(--warmBrown);line-height:1.6}

  /* 成长处方 */
  .rx-card{background:#fff;border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 2px 12px rgba(66,36,46,.06)}
  .rx-item{display:flex;gap:14px;margin-bottom:18px;position:relative}
  .rx-item:last-child{margin-bottom:0}
  .rx-item::before{content:"";position:absolute;left:15px;top:34px;bottom:-18px;width:2px;background:var(--cream-2)}
  .rx-item:last-child::before{display:none}
  .rx-num{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--p-color),var(--p-soft));color:#fff;font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:1}
  .rx-content{flex:1;padding-top:2px}
  .rx-title{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-weight:700;font-size:16px;color:var(--darkBerry);margin-bottom:4px}
  .rx-desc{font-size:14px;color:var(--warmBrown);line-height:1.7}

  /* 分享卡 */
  .share-card{background:linear-gradient(160deg,var(--p-grad1) 0%,var(--p-grad2) 100%);color:#fff;padding:36px 26px;text-align:center;position:relative;margin-bottom:20px;border-radius:24px;overflow:hidden;box-shadow:0 12px 36px rgba(0,0,0,.2)}
  .share-card::before{content:attr(data-char);position:absolute;font-family:'Noto Serif SC','STKaiti','KaiTi',cursive;font-size:200px;color:rgba(255,255,255,.08);right:-30px;top:-40px;line-height:1;pointer-events:none}
  .share-card .badge{display:inline-block;background:rgba(255,255,255,.2);color:#fff;font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-weight:700;font-size:11px;letter-spacing:.25em;padding:6px 14px;margin-bottom:18px;border-radius:999px;border:1px solid rgba(255,255,255,.3)}
  .share-card .sname{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-weight:900;font-size:48px;margin-bottom:6px;letter-spacing:.1em}
  .share-card .srate{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-size:12px;color:rgba(255,255,255,.75);margin-bottom:20px;letter-spacing:.1em}
  .share-card .quote{font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-style:italic;font-size:18px;line-height:1.7;padding:0 8px}
  .share-card .foot{margin-top:20px;font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-size:10px;color:rgba(255,255,255,.5);letter-spacing:.2em;border-top:1px solid rgba(255,255,255,.15);padding-top:14px}

  /* 按钮 */
  .r-btns{display:flex;gap:12px;margin-top:8px}
  .r-btn{flex:1;padding:15px;text-align:center;font-family:'Noto Serif SC','Songti SC','STSong','SimSun',serif;font-weight:700;font-size:15px;cursor:pointer;letter-spacing:.15em;border-radius:999px;border:none}

function hl(text, key, field){
  const words = DANGER_HL[key]?.[field];
  if(!words) return text;
  let r = text;
  words.forEach(w=>{
    const esc = w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    r = r.replace(new RegExp(esc,'g'),`<em>${w}</em>`);
  });
  return r;
}

function getStorageKey(token) {
  return 'test_result_' + (token || (window.linkValidator && window.linkValidator.token) || 'local');
}

function getCompletionFlagKey() {
  const token = window.linkValidator && window.linkValidator.token;
  return 'dpt_test_completed_' + (token || '');
}

function addPromotionLinkDelayed() {
  setTimeout(function () {
    if (window.PsyTestValidator && typeof window.PsyTestValidator.addPromotionLink === 'function') {
      window.PsyTestValidator.addPromotionLink();
    }
  }, 200);
}

async function waitForValidator() {
  let waitCount = 0;
  while (!window.linkValidator && waitCount < 30) {
    await new Promise(function (resolve) { setTimeout(resolve, 100); });
    waitCount++;
    if (waitCount % 10 === 0 && window.PsyTestValidator && typeof window.PsyTestValidator.getInstance === 'function') {
      const instance = window.PsyTestValidator.getInstance();
      if (instance) {
        window.linkValidator = instance;
        break;
      }
    }
  }
  return window.linkValidator;
}

async function validateAndStartTest() {
  const validator = await waitForValidator();
  if (!validator) {
    alert('验证SDK未初始化，无法开始测试。请刷新页面重试。');
    return false;
  }

  let isValid = false;
  if (typeof validator.validateForUserAction === 'function') {
    try {
      isValid = await validator.validateForUserAction();
      if (!isValid || validator.valid === false) return false;
    } catch (error) {
      console.error('链接验证失败:', error);
      validator.valid = false;
      return false;
    }
  } else {
    if (validator.valid === false) {
      alert(validator.validationError || '测试链接无效，请检查链接是否正确');
      return false;
    }
    isValid = validator.valid !== false;
  }

  if (!isValid || validator.valid === false) return false;

  const urlParams = new URLSearchParams(window.location.search);
  const isRestart = urlParams.get('restart') === 'true' || window.__dpt_retest_mode === true;
  if (!isRestart && !testStarted) {
    try {
      await validator.startTest();
      testStarted = true;
      console.log('测试开始记录成功');
    } catch (error) {
      console.error('记录测试开始失败:', error);
      return false;
    }
  } else {
    testStarted = true;
    window.__dpt_retest_mode = false;
    console.log('重新测试模式，跳过 startTest()');
  }

  return true;
}

function saveTestResult(testResult) {
  const token = window.linkValidator && window.linkValidator.token;
  if (!token) return;
  try {
    localStorage.setItem(getStorageKey(token), JSON.stringify({
      token: token,
      result: testResult,
      timestamp: testResult.timestamp
    }));
  } catch (error) {
    console.error('保存测试结果失败:', error);
  }
}

    if(answers[currentQ]===i) div.classList.add('selected');
    div.innerHTML = `<span class="key">${keys[i]}</span>${opt}`;
    div.onclick = ()=>selectOption(i);
    optsEl.appendChild(div);
  });
  const cta = document.getElementById('qCta');
  cta.disabled = currentQ===0;
  const hint = document.getElementById('qHint');
  if(currentQ===34){
    hint.textContent = '选择后将自动生成报告';
  } else {
    hint.textContent = '选择后自动进入下一题';
  }
}

function cnNum(n){
  const arr=['一','二','三','四','五','六','七','八','九','十'];
  if(n<=10) return arr[n-1];
  return n;
}

function selectOption(i){
  if(isTransitioning) return;
  answers[currentQ] = i;
  // 标记选中态
  const optsEl = document.getElementById('qOpts');
  Array.from(optsEl.children).forEach((el,idx)=>{
    el.classList.toggle('selected', idx===i);
  });
  isTransitioning = true;
  // 延迟自动跳转，让用户看到选中反馈
  setTimeout(()=>{
    isTransitioning = false;
    if(currentQ < 34){
      currentQ++;
      renderQuestion();
      window.scrollTo({top:0,behavior:'smooth'});
    } else {
      submitQuiz();
    }
  }, 380);
}

function nextQuestion(){
  if(answers[currentQ]===undefined) return;
  if(currentQ < 34){
    currentQ++;
    renderQuestion();
  } else {
    submitQuiz();
  }
}

function prevQuestion(){
  if(currentQ > 0){
    currentQ--;
    renderQuestion();
  } else {
    showPage('home');
  }
}

// ============ 计分 ============
function calculateResult(){
  const scores = {};
  DIMS.forEach(d=>scores[d]=0);
  for(let i=0;i<35;i++){
    if(answers[i]!==undefined){
      const dim = QUESTIONS[i].s[answers[i]];
      scores[dim] += 2;
    }
  }
  // 找最高分
  let maxScore = 0;
  DIMS.forEach(d=>{if(scores[d]>maxScore) maxScore=scores[d]});
  if(maxScore===0) return 'controller';
  let winners = DIMS.filter(d=>scores[d]===maxScore);
  if(winners.length===1) return winners[0];
  // 平局：算关联分
  let best = winners[0];
  let bestRel = -1;
  winners.forEach(w=>{
    const rel = YL[w].reduce((sum,r)=>sum+scores[r],0);
    if(rel > bestRel){ bestRel = rel; best = w; }
  });
  // 仍平则按JL优先级
  const stillTie = winners.filter(w=>{
    const rel = YL[w].reduce((sum,r)=>sum+scores[r],0);
    return rel === bestRel;
  });
  if(stillTie.length > 1){
    for(const d of JL){
      if(stillTie.includes(d)) return d;
    }
  }
  return best;
}

// 雷达抖动
function jitterRadar(personaKey){
  const persona = PERSONAS[personaKey];
  const radar = [...persona.radar];
  const mainIdx = DIMS.indexOf(personaKey);
  const subs = persona.subs;
  for(let i=0;i<9;i++){
    if(radar[i]===100) continue;
    if(subs.includes(DIMS[i])){
      const j = (Math.random()-0.5)*0.2;
      radar[i] = Math.min(95, Math.max(0, radar[i]*(1+j)));
    } else {
      const j = (Math.random()-0.5)*0.6;
      radar[i] = Math.min(90, Math.max(0, radar[i]*(1+j)));
    }
    radar[i] = Math.round(radar[i]);
  }
  return radar;
}

// ============ 提交 -> 生成报告 ============
function submitQuiz(){
  document.getElementById('loading').classList.add('show');
  setTimeout(async ()=>{
    const resultKey = calculateResult();
    const radar = jitterRadar(resultKey);
    renderResult(resultKey, radar);

    const persona = PERSONAS[resultKey];
    const testResult = {
      personaKey: resultKey,
      personaName: persona && persona.name,
      level: persona && persona.level,
      rare: persona && persona.rare,
      dangerIndex: persona && persona.dangerIndex,
      radar: radar,
      answers: answers,
      timestamp: new Date().toISOString()
    };
    saveTestResult(testResult);

    const completionFlagKey = getCompletionFlagKey();
    const alreadyCompleted = window.__dpt_test_completed || localStorage.getItem(completionFlagKey) === 'true';
    if (!alreadyCompleted && window.linkValidator) {
      try {
        window.__dpt_test_completed = true;
        localStorage.setItem(completionFlagKey, 'true');
        await window.linkValidator.completeTest(undefined, testResult);
        console.log('测试完成记录成功');
      } catch (error) {
        console.error('记录测试完成失败:', error);
        window.__dpt_test_completed = false;
        localStorage.removeItem(completionFlagKey);
      }
    }

    document.getElementById('loading').classList.remove('show');
    showPage('result');
    addPromotionLinkDelayed();
  }, 1500);
}

// ============ 雷达SVG（9边形） ============
function buildRadarSvg(values, labels){
  const cx=170, cy=170, r=125;
  const n=9;
  let grid = '';
  let axis = '';
  let pts = [];
  let lbls = '';

  // 网格（3层9边形）
  for(let layer=1;layer<=3;layer++){
    const lr = r*layer/3;
    let polyPts = [];
    for(let i=0;i<n;i++){
      const ang = (-90 + i*40) * Math.PI/180;
      polyPts.push(`${(cx+lr*Math.cos(ang)).toFixed(1)},${(cy+lr*Math.sin(ang)).toFixed(1)}`);
    }
    grid += `<polygon class="radar-grid" points="${polyPts.join(' ')}"/>`;
  }
  // 9条轴线
  for(let i=0;i<n;i++){
    const ang = (-90 + i*40) * Math.PI/180;
    axis += `<line class="radar-axis" x1="${cx}" y1="${cy}" x2="${(cx+r*Math.cos(ang)).toFixed(1)}" y2="${(cy+r*Math.sin(ang)).toFixed(1)}"/>`;
  }
  // 数据点
  for(let i=0;i<n;i++){
    const ang = (-90 + i*40) * Math.PI/180;
    const val = values[i]/100;
    const px = cx + r*val*Math.cos(ang);
    const py = cy + r*val*Math.sin(ang);
    pts.push(`${px.toFixed(1)},${py.toFixed(1)}`);
  }
  // 标签
  for(let i=0;i<n;i++){
    const ang = (-90 + i*40) * Math.PI/180;
    const lx = cx + (r+24)*Math.cos(ang);
    const ly = cy + (r+24)*Math.sin(ang)+5;
    lbls += `<text class="radar-lbl" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle">${labels[i]}</text>`;
  }

  return `<svg viewBox="0 0 340 340">
    ${grid}${axis}
    <polygon class="radar-data" points="${pts.join(' ')}"/>
    ${pts.map(p=>{const[x,y]=p.split(',');return `<circle class="radar-pt" cx="${x}" cy="${y}" r="4"/>`}).join('')}
    ${lbls}
  </svg>`;
}

// ============ 重新测试 ============
function restart(){
  if (window.linkValidator && typeof window.linkValidator.clearLocalResult === 'function') {
    window.linkValidator.clearLocalResult();
  }

  const urlParams = new URLSearchParams(window.location.search);
  let token = urlParams.get('token');
  if (!token && window.linkValidator && window.linkValidator.token) {
    token = window.linkValidator.token;
  }

  if (token) {
    const newUrlParams = new URLSearchParams();
    newUrlParams.set('token', token);
    newUrlParams.set('restart', 'true');
    if (urlParams.get('unlimited') === 'true') {
      newUrlParams.set('unlimited', 'true');
    }
    window.location.href = window.location.pathname + '?' + newUrlParams.toString();
    return;
  }

  window.__dpt_test_completed = false;
  localStorage.removeItem(getCompletionFlagKey());
  testStarted = false;
  currentQ = 0;
  answers = {};
  document.documentElement.style.setProperty('--p-bg', '#FCFAF7');
  showPage('home');
  addPromotionLinkDelayed();
}

function restoreResultFromStorage() {
  const token = window.linkValidator && window.linkValidator.token;
  if (!token) return false;
  try {
    const saved = localStorage.getItem(getStorageKey(token));
    if (!saved) return false;
    const parsed = JSON.parse(saved);
    const data = parsed.result || parsed;
    if (!data || !data.personaKey || !PERSONAS[data.personaKey]) return false;

    window.__dpt_test_completed = true;
    renderResult(data.personaKey, data.radar);
    showPage('result');
    addPromotionLinkDelayed();
    return true;
  } catch (error) {
    console.error('恢复测试结果失败:', error);
    return false;
  }
}

window.dptRestoreResult = restoreResultFromStorage;

// ============ 分享卡片生成 ============
function loadScript(url){
  return new Promise((resolve,reject)=>{
    if(document.querySelector(`script[src="${url}"]`)){ resolve(); return; }
    const s = document.createElement('script');
    s.src = url;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

function shareResult(){
  const shareCard = document.querySelector('.share-card');
  if(!shareCard){ return; }
  const loading = document.getElementById('shareLoading');
  loading.classList.add('show');
  loadScript('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js').then(()=>{
    return html2canvas(shareCard, {
      scale: 2,
      backgroundColor: null,
      useCORS: true,
      logging: false
    });
  }).then(canvas => {
    loading.classList.remove('show');
    const img = document.getElementById('sharePreviewImg');
    img.src = canvas.toDataURL('image/png');
    document.getElementById('sharePreview').classList.add('show');
  }).catch(err => {
    loading.classList.remove('show');
    alert('截图生成失败，请手动截图分享');
    console.error(err);
  });
}

function closeSharePreview(){
  document.getElementById('sharePreview').classList.remove('show');
}
