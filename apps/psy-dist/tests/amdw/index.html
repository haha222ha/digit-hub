    { max: 70, l: "黄金段位", c: "#F1C40F", d: "你有较强的暧昧能力，段位不错。", advice: "继续提升，成为高手。", points: ["精进聊天", "加强心理战术", "保持优势", "适度主动", "注意边界"] },
    { max: 90, l: "铂金段位", c: "#2ECC71", d: "你是暧昧高手，段位较高。", advice: "你已经超过大多数人。", points: ["保持节奏", "精进博弈", "帮助闺蜜", "注意分寸", "不要玩过火"] },
    { max: 120, l: "钻石段位", c: "#9B59B6", d: "你是暧昧高手段位，能力很强。", advice: "你已经超过了大多数人。", points: ["你是高手", "精进技术", "引导他人", "注意分寸", "别太渣"] },

let currQList = [], currIdx = 0, userInfo = {}, scores = { game:0, psych:0, chat:0, boundary:0, mind:0 };
function goToDemo() { document.getElementById('page-intro').style.display = 'none'; document.getElementById('page-demographics').style.display = 'block'; }
function initTest() {
    userInfo.experience = document.getElementById('input-experience').value;
    userInfo.type = document.getElementById('input-type').value;
    currQList = [...questions]; currIdx = 0; scores = { game:0, psych:0, chat:0, boundary:0, mind:0 };
    document.getElementById('page-demographics').style.display = 'none'; document.getElementById('page-test').style.display = 'flex'; renderQuestion();
}
function renderQuestion() {
    const q = currQList[currIdx];
    document.getElementById('progress-text').innerText = `${currIdx + 1} / ${currQList.length}`;
    document.getElementById('progress-fill').style.width = `${((currIdx)/currQList.length)*100}%`;
    document.getElementById('dim-tag').innerText = `维度：${getDimName(q.d)}`;
    document.getElementById('q-category').innerText = q.t;
    const wrapper = document.getElementById('question-wrapper'); wrapper.classList.remove('slide-up'); void wrapper.offsetWidth; wrapper.classList.add('slide-up');
    document.getElementById('question-text').innerText = q.q;
    const box = document.getElementById('options-box'); box.innerHTML = '';
    q.o.forEach(opt => {
        const btn = document.createElement('div'); btn.className = 'option-btn'; btn.innerText = opt.t;
        btn.onclick = () => { Array.from(box.children).forEach(c => c.classList.remove('selected')); btn.classList.add('selected'); setTimeout(() => handleAnswer(q.d, opt.s), 200); };
        box.appendChild(btn);
    });
}
function handleAnswer(dim, val) { scores[dim] += val; if (currIdx < currQList.length - 1) { currIdx++; renderQuestion(); } else { finishTest(); } }
function finishTest() { document.getElementById('page-test').style.display = 'none'; document.getElementById('page-loading').style.display = 'flex'; setTimeout(() => { document.getElementById('page-loading').style.display = 'none'; document.getElementById('page-result').style.display = 'block'; calculateResult(); }, 2500); }
function resetTest() { document.getElementById('page-result').style.display = 'none'; document.getElementById('page-intro').style.display = 'flex'; currIdx = 0; scores = { game:0, psych:0, chat:0, boundary:0, mind:0 }; }
function calculateResult() {
    let totalRaw = Object.values(scores).reduce((a,b)=>a+b, 0); let finalScore = Math.round(totalRaw);
    let lvl = levels.find(l => finalScore <= l.max) || levels[levels.length-1];
    const numEl = document.getElementById('res-score'); animateValue(numEl, 0, finalScore, 1500);
    const badge = document.getElementById('res-level'); badge.innerText = lvl.l; badge.style.background = lvl.c;
    document.getElementById('res-desc').innerText = lvl.d; renderBars(scores); drawRadar(scores);
}
function renderBars(s) {
    const box = document.getElementById('bars-container');
    const dims = [{k:'game', n:'博弈'}, {k:'psych', n:'心理'}, {k:'chat', n:'聊天'}, {k:'boundary', n:'边界'}, {k:'mind', n:'心态'}];
    let html = ''; dims.forEach(d => {
        let pct = Math.min((s[d.k] / 10) * 100, 100);
        let color = pct> 60 ? '#FF6B81' : (pct> 30 ? '#F1C40F' : '#2ED573');
        let txt = pct> 70 ? '突出' : (pct> 40 ? '中等' : '普通');
        html += `<div class="dim-row"><div class="dim-info"><span class="dim-name">${d.n}</span><span class="dim-sub">${getDimName(d.k)}</span></div><div class="dim-bar-bg"><div class="dim-bar-fill" style="width:${pct}%; background:${color};"></div></div><div class="dim-val" style="color:${color}">${txt}</div></div>`;
    }); box.innerHTML = html;
}
function getDimName(k) { const map = {game:'博弈能力', psych:'心理战术', chat:'聊天能力', boundary:'边界把控', mind:'心态建设'}; return map[k]; }
function showReport() {
    const total = parseInt(document.getElementById('res-score').innerText);
    const lvl = levels.find(l => total <= l.max) || levels[levels.length-1];
    let html = `<div class="report-section"><div class="r-h1">一、暧昧段位诊断</div><p class="r-p" style="background:#fafafa; padding:12px; border-radius:8px; font-size:14px;">📋 个人档案：经验${userInfo.experience} | 类型${userInfo.type}</p><div class="r-box" style="border-left:5px solid ${lvl.c};"><div style="font-size:22px; font-weight:900; color:${lvl.c}; margin-bottom:8px;">暧昧段位：${lvl.l}</div><p style="margin:0; font-size:15px;">${lvl.d}</p><p style="margin:10px 0 0;">${lvl.advice}</p></div></div><div class="report_section"><div class="r-h2">二、五维能力深度分析</div>${generateDimAnalysis('game', scores.game)}${generateDimAnalysis('psych', scores.psych)}${generateDimAnalysis('chat', scores.chat)}${generateDimAnalysis('boundary', scores.boundary)}${generateDimAnalysis('mind', scores.mind)}</div><div class="report_section"><div class="r-h2">三、暧昧提升方案</div><div class="r-box"><div class="r-h3">💡 提升建议</div><ul>${lvl.points.map(p => `<li>${p}</li>`).join('')}</ul></div></div><div style="text-align:center; color:#ccc; font-size:12px; margin-top:50px;">2026暧昧段位检测 · 专业心理测评</div>`;
    document.getElementById('report-content').innerHTML = html; document.getElementById('report-modal').style.display = 'block';
}
function closeReport() { document.getElementById('report-modal').style.display = 'none'; }
function generateDimAnalysis(key, val) {
    let level = val> 7 ? 'high' : (val> 4 ? 'med' : 'low');
    const config = { high: { color: '#FF6B81', bg: '#fff0f3', tag: '🌟 突出', titleColor: '#FF6B81' }, med: { color: '#F1C40F', bg: '#fef9e7', tag: '✨ 一般', titleColor: '#F1C40F' }, low: { color: '#2ED573', bg: '#f0fff4', tag: '🌿 普通', titleColor: '#2ED573' } };
    const c = config[level];
    return `<div style="margin-bottom:20px; padding:16px; background:${c.bg}; border-radius:8px; border-left:4px solid ${c.color};"><div class="r-h3" style="color:${c.titleColor}; margin-top:0;">${getDimName(key)} <span style="font-size:12px; margin-left:8px;">(得分:${val}/10)</span><span style="float:right; font-size:12px; background:${c.color}; color:#fff; padding:2px 8px; border-radius:10px;">${c.tag}</span></div></div>`;
}
function animateValue(obj, start, end, duration) { let startTimestamp = null; const step = (timestamp) => { if (!startTimestamp) startTimestamp = timestamp; const progress = Math.min((timestamp - startTimestamp) / duration, 1); obj.innerHTML = Math.floor(progress * (end - start) + start); if (progress < 1) window.requestAnimationFrame(step); }; window.requestAnimationFrame(step); }
function drawRadar(s) {
    const c = document.getElementById('radarChart'); const ctx = c.getContext('2d'); const dpr = window.devicePixelRatio || 1;
    c.style.width = '240px'; c.style.height = '240px'; c.width = 240 * dpr; c.height = 240 * dpr; ctx.scale(dpr, dpr);
    const cx=120, cy=120, r=90, keys = ['game','psych','chat','boundary','mind'], labels = ['博弈','心理','聊天','边界','心态'];
    ctx.strokeStyle = '#ffe6eb'; ctx.lineWidth = 1;
    for(let i=1; i<=4; i++) { ctx.beginPath(); for(let j=0; j<5; j++) { let a = (Math.PI*2/5)*j - Math.PI/2; ctx.lineTo(cx + Math.cos(a)*(r/4)*i, cy + Math.sin(a)*(r/4)*i); } ctx.closePath(); ctx.stroke(); }
    ctx.beginPath(); keys.forEach((k, i) => { let ratio = Math.min(s[k] / 10, 1.1); let a = (Math.PI*2/5)*i - Math.PI/2; ctx.lineTo(cx + Math.cos(a)*r*ratio, cy + Math.sin(a)*r*ratio); }); ctx.closePath();
    let grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, r); grd.addColorStop(0, "rgba(255, 107, 129, 0.1)"); grd.addColorStop(1, "rgba(255, 107, 129, 0.6)");
    ctx.fillStyle = grd; ctx.fill(); ctx.strokeStyle = '#FF6B81'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#2D3436'; ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center';
    labels.forEach((l, i) => { let a = (Math.PI*2/5)*i - Math.PI/2; ctx.fillText(l, cx + Math.cos(a)*(r+20), cy + Math.sin(a)*(r+20) + 4); });
}

 goToDemo(); });
