          { value: 'freelance', label: '自由职业', icon: '🎨', desc: '完全自由' }
        ]
      },
      {
        id: 'degreeType',
        type: 'select',
        tag: '🎓 教育背景',
        title: '你的最高<br>学历是？',
        hint: '学历影响职业发展天花板',
        options: [
          { value: '0.8', label: '专科及以下', icon: '🎒', desc: '专科/中专/高中' },
          { value: '1.0', label: '普通本科', icon: '🎓', desc: '普通院校本科' },
          { value: '1.2', label: '重点本科', icon: '🏆', desc: '211/985/QS100' },
          { value: '1.4', label: '普通硕士', icon: '📚', desc: '普通院校硕士' },
          { value: '1.6', label: '重点硕士', icon: '📖', desc: '211/985硕士' },
          { value: '1.8', label: '普通博士', icon: '🔬', desc: '普通院校博士' },
          { value: '2.0', label: '重点博士', icon: '🧠', desc: '顶尖院校博士' }
        ]
      },
      {
        id: 'workYears',
        type: 'select',
        tag: '📈 工作经验',
        title: '你工作<br>多少年了？',
        hint: '影响薪资议价能力和稳定性需求',
        options: [
          { value: '0', label: '应届生', icon: '🌱', desc: '刚毕业' },
          { value: '1', label: '1-3年', icon: '📗', desc: '职场新人' },
          { value: '2', label: '3-5年', icon: '📙', desc: '成长阶段' },
          { value: '4', label: '5-8年', icon: '📘', desc: '资深阶段' },
          { value: '6', label: '8-10年', icon: '📕', desc: '专家级别' },
          { value: '10', label: '10-12年', icon: '📓', desc: '高层管理' },
          { value: '15', label: '12年以上', icon: '📒', desc: '资深领袖' }
        ]
      }
    ];

    // ====== 状态管理 ======
    let currentIndex = 0;
    let answers = {};
    let isAnimating = false;
    let validatorInstance = null;

    // ====== SDK初始化 ======
    if (typeof PsyTestValidator !== 'undefined') {
      PsyTestValidator.init('wjt', {
        onSuccess: function(result, validator) {
          console.log('SDK初始化成功:', result);
          validatorInstance = validator;
          window.linkValidator = validator;
          document.body.classList.remove('page-disabled');
          const errorOverlay = document.getElementById('errorOverlay');
          if (errorOverlay) errorOverlay.style.display = 'none';
        },
        onError: function(error) {
          console.error('SDK初始化失败:', error);
          if (window.PsyTestValidator && typeof window.PsyTestValidator.getInstance === 'function') {
            validatorInstance = window.PsyTestValidator.getInstance();
          }
          if (validatorInstance) window.linkValidator = validatorInstance;
          document.body.classList.remove('page-disabled');
        },
        onLoad: function(data) {
          console.log('SDK加载完成:', data);
          if (!validatorInstance) {
            if (window.PsyTestValidator && typeof window.PsyTestValidator.getInstance === 'function') {
              validatorInstance = window.PsyTestValidator.getInstance();
            }
            if (!validatorInstance && window.linkValidator) validatorInstance = window.linkValidator;
          }
          if (validatorInstance) window.linkValidator = validatorInstance;

          // 答题页禁用推广信息
          window.__RPI_DISABLE_SDK_PROMOTION = true;

          // 检查是否是重新测试
          const urlParams = new URLSearchParams(window.location.search);
          const isRestart = urlParams.get('restart') === 'true';
          if (isRestart) {
            console.log('检测到重新测试参数，清除答题进度');
            urlParams.delete('restart');
            const newUrl = window.location.pathname + (urlParams.toString() ? '?' + urlParams.toString() : '');
            window.history.replaceState({}, '', newUrl);
            // 不恢复进度，从头开始
          } else {
            // 恢复答题进度
            const savedAnswers = localStorage.getItem('wjt_quiz_answers');
            const savedIndex = localStorage.getItem('wjt_quiz_index');
            if (savedAnswers) {
              try {
                answers = JSON.parse(savedAnswers);
              } catch(e) {}
            }
            if (savedIndex && !isNaN(parseInt(savedIndex))) {
              currentIndex = Math.max(0, parseInt(savedIndex));
            }
          }
        }
      });
    } else {
      console.error('验证SDK未加载');
      document.body.classList.remove('page-disabled');
    }

    // ====== 返回按钮 ======
    document.getElementById('backBtn').addEventListener('click', function() {
      // 清除答题进度
      localStorage.removeItem('wjt_quiz_answers');
      localStorage.removeItem('wjt_quiz_index');
      // 构建index.html URL并跳转
      const urlParams = new URLSearchParams();
      const token = window.linkValidator && window.linkValidator.token;
      const isUnlimited = window.linkValidator && window.linkValidator.unlimited;
      if (isUnlimited && token) {
        urlParams.set('unlimited', 'true');
        urlParams.set('token', token);
      } else if (token) {
        urlParams.set('token', token);
      }
      const queryString = urlParams.toString();
      const indexUrl = queryString ? `index.html?${queryString}` : 'index.html';
      window.location.href = indexUrl;
    });

    // ====== 渲染题目 ======
    function renderQuestion(index) {
      const q = questions[index];
      const stage = document.getElementById('stage');

      let html = `<div class="q-slide active" id="q-current">`;
      html += `<div class="q-step-tag">${q.tag}</div>`;
      html += `<div class="q-title">${q.title}</div>`;
      html += `<div class="q-hint">${q.hint}</div>`;

      if (q.type === 'number') {
        html += `<div class="big-input-wrap">`;
        html += `<input type="number" class="big-input" id="numInput" placeholder="${q.placeholder}" `;
        html += `min="${q.min}" max="${q.max}" step="${q.step}" `;
        html += `value="${answers[q.id] || ''}">`;
        html += `<span class="input-unit">${q.unit}</span>`;
        html += `</div>`;
      } else if (q.type === 'slider') {
        const val = answers[q.id] ?? q.default;
        answers[q.id] = val;
        html += `<div class="slider-section">`;
        html += `<div class="slider-display">`;
        html += `<div class="slider-big-val" id="sliderVal">${val}</div>`;
        html += `<div class="slider-unit">${q.unit}</div>`;
        html += `</div>`;
        html += `<input type="range" min="${q.min}" max="${q.max}" value="${val}" step="${q.step}" id="sliderInput" `;
        html += `oninput="updateSlider(this.value, '${q.display}')">`;
        html += `<div class="slider-labels"><span>${q.labels[0]}</span><span>${q.labels[1]}</span><span>${q.labels[2]}</span></div>`;
        html += `</div>`;
      } else if (q.type === 'select') {
        html += `<div class="options-list">`;
        q.options.forEach(opt => {
          const isSelected = answers[q.id] === opt.value;
          html += `<div class="opt${isSelected ? ' selected' : ''}" onclick="selectOpt('${q.id}', '${opt.value}')">`;
          html += `<div class="opt-icon">${opt.icon}</div>`;
          html += `<div class="opt-body">`;
          html += `<div class="opt-name">${opt.label}</div>`;
          if (opt.desc) html += `<div class="opt-desc">${opt.desc}</div>`;
          html += `</div>`;
          html += `<div class="opt-radio"><div class="opt-radio-dot"></div></div>`;
          html += `</div>`;
        });
        html += `</div>`;
      } else if (q.type === 'shuttle' || q.type === 'canteen') {
        html += `<div class="options-list">`;
        q.options.forEach(opt => {
          const isSelected = answers[q.id] === opt.value;
          html += `<div class="opt${isSelected ? ' selected' : ''}" onclick="selectOpt('${q.id}', '${opt.value}')">`;
          html += `<div class="opt-icon">${opt.icon}</div>`;
          html += `<div class="opt-body"><div class="opt-name">${opt.label}</div>`;
          html += `<div class="opt-desc">${opt.desc}</div></div>`;
          html += `<div class="opt-radio"><div class="opt-radio-dot"></div></div>`;
          html += `</div>`;
        });
        html += `</div>`;
      }

      html += `</div>`;
      html += `<div class="q-slide enter-from-right" id="q-next"></div>`;

      stage.innerHTML = html;

      const numInput = document.getElementById('numInput');
      if (numInput) {
        numInput.addEventListener('input', (e) => {
          const val = e.target.value;
          answers[q.id] = val ? parseFloat(val) : null;
          updateNextButton();
          saveProgress();
        });
        numInput.focus();
      }
    }

    function updateSlider(value, display) {
      document.getElementById('sliderVal').textContent = value;
      const q = questions[currentIndex];
      answers[q.id] = parseFloat(value);
      updateNextButton();
      saveProgress();
    }

    function selectOpt(questionId, value) {
      answers[questionId] = value;
      document.querySelectorAll('.q-slide.active .opt').forEach(o => o.classList.remove('selected'));
      event.currentTarget.classList.add('selected');
      updateNextButton();
      saveProgress();
    }

    function updateNextButton() {
      const btn = document.getElementById('btnNext');
      const hint = document.getElementById('selectHint');
      const q = questions[currentIndex];
      let isReady = false;

      if (q.type === 'number') {
        isReady = answers[q.id] !== null && answers[q.id] !== undefined && answers[q.id] !== '';
      } else if (q.type === 'slider') {
        isReady = answers[q.id] !== null && answers[q.id] !== undefined;
      } else {
        isReady = answers[q.id] !== undefined;
      }

      btn.classList.toggle('ready', isReady);
      hint.classList.toggle('hidden', isReady);
    }

    // ====== 保存进度 ======
    function saveProgress() {
      try {
        localStorage.setItem('wjt_quiz_answers', JSON.stringify(answers));
        localStorage.setItem('wjt_quiz_index', String(currentIndex));
      } catch(e) {}
    }

    // ====== 导航 ======
    document.getElementById('btnNext').addEventListener('click', function() {
      if (isAnimating) return;
      const btn = document.getElementById('btnNext');
      if (!btn.classList.contains('ready')) {
        document.getElementById('selectHint').classList.remove('hidden');
        return;
      }

      isAnimating = true;
      const cur = document.getElementById('q-current');
      const nxt = document.getElementById('q-next');

      if (currentIndex < questions.length - 1) {
        cur.classList.remove('active');
        cur.classList.add('exit-to-left');

        currentIndex++;
        saveProgress();
        renderQuestion(currentIndex);

        setTimeout(() => {
          cur.classList.remove('exit-to-left');
          cur.classList.add('enter-from-right');
          updateProgress();
          updateNextButton();
          isAnimating = false;
        }, 350);
      } else {
        generateReport();
      }
    });

    function updateProgress() {
      const pct = Math.round((currentIndex + 1) / questions.length * 100);
      document.getElementById('stepLabel').textContent = `第 ${currentIndex + 1} 题 / 共 ${questions.length} 题`;
      document.getElementById('pctLabel').textContent = `${pct}%`;
      document.getElementById('progressFill').style.width = `${pct}%`;

      const pills = document.getElementById('stepPills');
      pills.innerHTML = questions.map((_, i) => {
        let cls = 'pill';
        if (i < currentIndex) cls += ' done';
        else if (i === currentIndex) cls += ' active';
        return `<div class="${cls}"></div>`;
      }).join('');

      const btn = document.getElementById('btnNext');
      btn.textContent = currentIndex === questions.length - 1 ? '查看报告 →' : '下一题 →';
    }

    // ====== 生成报告 ======
    async function generateReport() {
      saveProgress();

      // 优先使用SDK的token
      let token = null;
      if (window.linkValidator && window.linkValidator.token) {
        token = window.linkValidator.token;
      } else {
        token = 'local_' + Date.now();
      }

      // 保存到localStorage（使用SDK token作为key）
      const storageKey = `wjt_result_${token}`;
      try {
        localStorage.setItem(storageKey, JSON.stringify({
          token: token,
          answers: answers,
          timestamp: new Date().toISOString()
        }));
        // 兼容旧key
        localStorage.setItem('worthjob_answers', JSON.stringify(answers));
      } catch(e) {}

      // 调用测试完成
      if (window.linkValidator) {
        try {
          await window.linkValidator.completeTest(undefined, { completed: true });
          console.log('测试完成记录成功');
        } catch(e) {
          console.error('记录测试完成失败:', e);
        }
      }

      // 清除答题进度
      localStorage.removeItem('wjt_quiz_answers');
      localStorage.removeItem('wjt_quiz_index');

      // 构建报告页URL
      let reportUrl = 'report.html';
      const urlParams = new URLSearchParams();
      const isUnlimited = window.linkValidator && window.linkValidator.unlimited;
      if (isUnlimited && token) {
        urlParams.set('unlimited', 'true');
        urlParams.set('token', token);
      } else if (token) {
        urlParams.set('token', token);
      }
      const queryString = urlParams.toString();
      if (queryString) reportUrl = `${reportUrl}?${queryString}`;
      window.location.href = reportUrl;
    }

    // ====== 初始化 ======
    function init() {
      const pills = document.getElementById('stepPills');
      pills.innerHTML = questions.map(() => '<div class="pill"></div>').join('');

      renderQuestion(currentIndex);
      updateProgress();
    }

    init();
  </script>
</body>
</html>
