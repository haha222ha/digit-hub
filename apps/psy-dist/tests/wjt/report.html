      opacity: 0.6;

      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center;
      z-index: 10000; text-align: center; font-size: 16px;
      color: #fff; padding: 20px; box-sizing: border-box;
    }
    .error-overlay p { margin: 0; line-height: 1.6; }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;

      color: #1a1a1a;
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
    }

    nav {

      background: #f0eeea;
      position: sticky; top: 0; z-index: 50;
      border-bottom: 1px solid #e4e1db;
    }
    .nav-title {
      font-size: 22px;
      font-weight: 900;
      color: #1a1a1a;
      letter-spacing: -0.01em;
    }

    .hero-card {
      margin: 14px 14px 0;
      border-radius: 24px;
      background: linear-gradient(150deg, #ede9ff 0%, #fce7f3 55%, #fff3e0 100%);
      padding: 24px 20px 22px;
      position: relative; overflow: hidden;
      animation: fadeUp 0.5s ease both;
      box-shadow: 0 2px 16px rgba(124,58,237,0.08), 0 0 0 1px rgba(124,58,237,0.06);
    }
    .hero-card::before {
      content: '';
      position: absolute; top: -40px; right: -40px;
      width: 180px; height: 180px; border-radius: 50%;
      background: radial-gradient(circle, rgba(167,139,250,0.2) 0%, transparent 65%);
      pointer-events: none;
    }
    .hero-card::after {
      content: '';
      position: absolute; bottom: -30px; left: -20px;
      width: 150px; height: 150px; border-radius: 50%;
      background: radial-gradient(circle, rgba(251,191,36,0.15) 0%, transparent 65%);
      pointer-events: none;
    }

    .hero-meta {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 22px; position: relative; z-index: 1;
    }
    .hero-report-id {
      font-size: 11px; color: #a78bfa;
      font-family: 'Courier New', monospace; letter-spacing: 0.08em; font-weight: 700;
    }
    .hero-date { font-size: 11px; color: #bbb; }

    .hero-icon-wrap {
      display: flex; justify-content: center;
      margin-bottom: 20px; position: relative; z-index: 1;
    }
    .hero-icon-bg {
      width: 88px; height: 88px; border-radius: 50%;
      background: rgba(255,255,255,0.7);
      border: 1.5px solid rgba(124,58,237,0.12);
      display: flex; align-items: center; justify-content: center;
      font-size: 46px;
      box-shadow: 0 4px 20px rgba(124,58,237,0.1), 0 0 0 12px rgba(255,255,255,0.35);
    }

    .hero-grade-row {
      display: flex; align-items: center; justify-content: center;
      gap: 14px; margin-bottom: 16px; position: relative; z-index: 1;
    }
    .hero-level {
      font-size: 18px; font-weight: 700;
      color: #9ca3af;
      letter-spacing: 0.02em;
    }
    .hero-divider {
      width: 1.5px; height: 22px;
      background: #d1d5db; border-radius: 1px;
    }
    .hero-name {
      font-size: 32px; font-weight: 900; color: #1a1a1a;
      letter-spacing: -0.01em;
    }

    .hero-tags {
      display: flex; justify-content: center; gap: 8px;
      flex-wrap: wrap; margin-bottom: 22px;
      position: relative; z-index: 1;
    }
    .hero-tag {
      font-size: 13px; font-weight: 600;
      color: #7c3aed;
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(124,58,237,0.15);
      padding: 6px 16px; border-radius: 50px;
    }

    .hero-progress { margin-bottom: 20px; position: relative; z-index: 1; }
    .hero-progress-label {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 10px;
    }
    .hero-progress-key { font-size: 13px; color: #999; font-weight: 500; }
    .hero-progress-val { font-size: 22px; font-weight: 900; color: #1a1a1a; }
    .hero-progress-val span { font-size: 14px; color: #bbb; font-weight: 400; margin-left: 2px; }
    .hero-bar-track {
      height: 8px;
      background: rgba(124,58,237,0.1);
      border-radius: 4px; overflow: hidden;
    }
    .hero-bar-fill {
      height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, #7c3aed, #db2777, #f97316);
      transition: width 1.2s cubic-bezier(0.4,0,0.2,1);
    }
    .hero-bar-ticks {
      display: flex; justify-content: space-between;
      font-size: 10px; color: #bbb; margin-top: 6px;
    }

    .hero-quote {
      text-align: center;
      font-size: 14px; color: #888;
      font-style: italic; line-height: 1.6;
      padding: 16px 4px 0;
      position: relative; z-index: 1;
      border-top: 1px solid rgba(124,58,237,0.1);
    }

    .quick-card {
      margin: 12px 14px 0;
      background: #fff; border-radius: 18px;
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      box-shadow: 0 1px 6px rgba(0,0,0,0.05);
      overflow: hidden;
      animation: fadeUp 0.5s ease 0.08s both;
    }
    .qr-item {
      padding: 18px 10px; text-align: center;
      border-right: 1px solid #f0ede8;
    }
    .qr-item:last-child { border-right: none; }
    .qr-icon { font-size: 20px; margin-bottom: 6px; }
    .qr-val { font-size: 18px; font-weight: 900; color: #1a1a1a; margin-bottom: 4px; }
    .qr-key { font-size: 12px; color: #aaa; }

    .dim-card {
      margin: 12px 14px 0;
      background: #fff; border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 1px 6px rgba(0,0,0,0.05);
      animation: fadeUp 0.5s ease 0.14s both;
    }
    .sec-title {
      padding: 16px 18px 12px;
      font-size: 12px; font-weight: 800; color: #bbb;
      letter-spacing: 0.1em; text-transform: uppercase;
      display: flex; align-items: center; gap: 8px;
    }
    .sec-title::after { content: ''; flex: 1; height: 1px; background: #f0ede8; }

    .dim-row {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 16px 18px;
      border-top: 1px solid #f5f2ee;
    }
    .dim-row-icon {
      font-size: 22px; width: 48px; height: 48px;
      background: #f5f4f0; border-radius: 13px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .dim-row-body { flex: 1; min-width: 0; }
    .dim-row-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 6px;
    }
    .dim-row-name { font-size: 15px; font-weight: 800; color: #1a1a1a; }
    .dim-chip {
      font-size: 11px; font-weight: 700;
      padding: 3px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
    }
    .chip-green  { background: #f0fdf4; color: #16a34a; }
    .chip-orange { background: #fff7ed; color: #ea580c; }
    .chip-red    { background: #fef2f2; color: #dc2626; }
    .chip-purple { background: #f3f0ff; color: #7c3aed; }
    .chip-blue   { background: #eff6ff; color: #2563eb; }
    .chip-yellow { background: #fefce8; color: #ca8a04; }
    .dim-row-comment {
      font-size: 13px; color: #777; line-height: 1.65; margin-bottom: 10px;
    }
    .dim-mini-bar { height: 4px; background: #f0ede8; border-radius: 2px; overflow: hidden; }
    .dim-mini-fill { height: 100%; border-radius: 2px; }

    .fill-orange { background: linear-gradient(90deg,#f59e0b,#fbbf24); }
    .fill-red    { background: linear-gradient(90deg,#ef4444,#f87171); }
    .fill-purple { background: linear-gradient(90deg,#7c3aed,#a78bfa); }
    .fill-blue   { background: linear-gradient(90deg,#3b82f6,#60a5fa); }
    .fill-yellow { background: linear-gradient(90deg,#eab308,#facc15); }

      margin: 12px 14px 0;
      background: #fff; border-radius: 18px;
      padding: 18px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.05);

      width: 30px; height: 30px; border-radius: 8px;

    .advice-body {
      font-size: 14px; color: #555; line-height: 1.9;
      background: #faf9f7; border-radius: 12px; padding: 14px 16px;
      border-left: 3px solid #a78bfa;
    }
    .advice-body strong { color: #1a1a1a; }

      margin: 12px 14px 0;
      background: #fff; border-radius: 18px;
      padding: 16px 18px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 1px 6px rgba(0,0,0,0.05);
      animation: fadeUp 0.5s ease 0.24s both;
    }
    .rf-title { font-size: 13px; font-weight: 800; color: #1a1a1a; }
    .stamp {
      width: 54px; height: 54px; border-radius: 50%;
      border: 2px solid #16a34a;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transform: rotate(-12deg); flex-shrink: 0;
    }
    .stamp-emoji { font-size: 18px; line-height: 1; }
    .stamp-text  { font-size: 8px; font-weight: 800; color: #16a34a; letter-spacing: 0.04em; margin-top: 2px; }

    .action-wrap {
      padding: 14px 14px 44px;
      animation: fadeUp 0.5s ease 0.28s both;
    }
    .btn-retry {
      width: 100%; background: #1a1a1a; color: #fff;
      border: none; font-size: 17px; font-weight: 700;
      padding: 18px; border-radius: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.14); transition: all 0.2s;
      margin-bottom: 12px;
    }
    .btn-retry:active { transform: scale(0.98); }
    .disclaimer {
      text-align: center;
      font-size: 11px;
      color: #bbb;
      line-height: 1.6;
      padding: 0 8px;
    }

    /* 底部推广链接区域（SDK自动添加） */
    .report-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 32px;
      padding: 24px;
      width: 100%;
      box-sizing: border-box;
    }
    .report-footer #link-validator-promotion-link {
      width: 100%;
      text-align: center;
      padding-top: 16px;
      margin-top: 16px;
      border-top: 1px solid #e5e7eb;
      box-sizing: border-box;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

    // ====== 计算逻辑 ======
    function calculateResult(answers) {
      const {
        salary, country, workDaysPerWeek, workHours, commuteHours, restTime,
        wfhDaysPerWeek, annualLeave, cityFactor, workEnvironment,
        workIntensity, leadership, teamwork, attractiveness, homeTown,
        hasShuttle, hasCanteen, jobStability, degreeType, workYears
      } = answers;

      const salaryNum = parseFloat(salary) * 10000;
      const ppp = PPP_TABLE[country] || 4.19;
      const paidSickLeave = 3;

      const workDaysPerYear = Math.max(
        52 * parseFloat(workDaysPerWeek) - (parseFloat(annualLeave) + 13 + 0.6 * paidSickLeave),
        0
      );

      const dailySalaryPPP = (salaryNum * 4.19 / ppp) / workDaysPerYear;

      const wfhRatio = parseFloat(workDaysPerWeek) > 0 ? parseFloat(wfhDaysPerWeek) / parseFloat(workDaysPerWeek) : 0;
      const officeRatio = 1 - wfhRatio;
      const shuttleFactor = hasShuttle === 'none' ? 1.0 : (parseFloat(hasShuttle) || 1.0);
      const effectiveCommute = parseFloat(commuteHours) * officeRatio * shuttleFactor;

      const canteenFactor = hasCanteen === 'none' ? 1.0 : (parseFloat(hasCanteen) || 1.0);
      const comfortFactor = parseFloat(workEnvironment) * parseFloat(leadership) *
                           parseFloat(teamwork) * parseFloat(cityFactor) *
                           parseFloat(attractiveness) * canteenFactor;

      let stabilityFactor;
      const years = parseInt(workYears);
      if (years === 0) {
        const freshFactors = { government: 0.8, state: 0.9, foreign: 0.95, private: 1.0, dispatch: 1.1, freelance: 1.1 };
        stabilityFactor = freshFactors[jobStability] || 1.0;
      } else {
        const expBonus = { 1: 1.5, 2: 2.2, 4: 2.7, 6: 3.2, 10: 3.6, 15: 3.9 };
        const expFactors = { government: 0.2, state: 0.4, foreign: 0.8, private: 1.0, dispatch: 1.2, freelance: 1.2 };
        const bonus = expBonus[years] || 1.5;
        const mod = expFactors[jobStability] || 1.0;
        stabilityFactor = 1 + (bonus - 1) * mod;
      }

      const actualDailyHours = parseFloat(workHours) + effectiveCommute - 0.5 * parseFloat(restTime);

      const valueIndex = (dailySalaryPPP * comfortFactor) /
                        (35 * actualDailyHours * parseFloat(degreeType) * stabilityFactor * parseFloat(workIntensity));

      let rating = RATINGS[0];
      for (const r of RATINGS) {
        if (valueIndex < r.max) {
          rating = r;
          break;
        }
      }

      const tags = [];
      if (valueIndex >= 2.5) tags.push('💰 薪资给力');
      if (parseFloat(leadership) >= 1.1) tags.push('👔 领导好');
      if (parseFloat(teamwork) >= 1.1) tags.push('👥 氛围融洽');
      if (parseFloat(workIntensity) <= 1.0) tags.push('🔥 强度适中');
      if (effectiveCommute <= 0.5) tags.push('🚌 通勤轻松');
      if (wfhRatio >= 0.4) tags.push('🏠 居家办公');

      const barWidth = Math.min(valueIndex / 5 * 100, 100);

      return {
        valueIndex,
        dailySalaryPPP,
        workDaysPerYear,
        actualDailyHours,
        barWidth,
        rating,
        tags,
        comments: generateComments(answers, valueIndex, dailySalaryPPP, effectiveCommute)
      };
    }

    function generateComments(answers, valueIndex, dailySalary, commute) {
      const comments = [];
      const {
        homeTown, cityFactor, commuteHours, wfhDaysPerWeek, hasShuttle, workEnvironment,
        leadership, teamwork, attractiveness, workIntensity, workHours, restTime,
        annualLeave, degreeType, workYears, jobStability, hasCanteen
      } = answers;

      comments.push({
        icon: '🏠',
        name: '家乡状态',
        value: homeTown === 'yes' ? '在家乡' : '不在家乡',
        comment: COMMENTS.hometown[homeTown === 'yes' ? 'yes' : 'no'],
        type: homeTown === 'yes' ? 'green' : 'orange',
        fill: homeTown === 'yes' ? 75 : 40
      });

      const cityLevel = parseFloat(cityFactor);
      let cityComment = '', cityFill = 50, cityType = 'orange';
      if (cityLevel <= 0.8) { cityComment = COMMENTS.city.tier1; cityFill = 30; cityType = 'orange'; }
      else if (cityLevel <= 1.0) { cityComment = COMMENTS.city.tier2; cityFill = 55; cityType = 'green'; }
      else { cityComment = COMMENTS.city.tier4; cityFill = 75; cityType = 'green'; }
      comments.push({ icon: '🏙️', name: '城市系数', value: CITY_NAMES[cityFactor] || cityFactor, comment: cityComment, type: cityType, fill: cityFill });

      const commuteNum = parseFloat(commuteHours);
      let commuteType = 'green', commuteFill = 70;
      if (commuteNum <= 0.5) { commuteType = 'green'; commuteFill = 80; }
      else if (commuteNum <= 1.5) { commuteType = 'orange'; commuteFill = 55; }
      else { commuteType = 'red'; commuteFill = 30; }
      comments.push({ icon: '🚇', name: '通勤成本', value: `${commuteNum}小时`, comment: commuteComments(commuteNum, answers.wfhDaysPerWeek, answers.hasShuttle), type: commuteType, fill: commuteFill });

      const wfhRatio = parseInt(wfhDaysPerWeek) / 5;
      if (wfhRatio >= 0.4) {
        comments.push({ icon: '🏠', name: '居家办公', value: `${wfhDaysPerWeek}天/周`, comment: COMMENTS.wfh.high, type: 'green', fill: 85 });
      } else if (wfhRatio > 0) {
        comments.push({ icon: '🏠', name: '居家办公', value: `${wfhDaysPerWeek}天/周`, comment: COMMENTS.wfh.medium, type: 'orange', fill: 50 });
      }

      const envNum = parseFloat(workEnvironment);
      let envType = 'orange', envFill = 50;
      if (envNum >= 1.0) { envType = 'green'; envFill = 75; }
      else if (envNum >= 0.9) { envType = 'orange'; envFill = 55; }
      else { envType = 'red'; envFill = 35; }
      let envComment = COMMENTS.env.normal;
      if (envNum >= 1.1) envComment = COMMENTS.env.cbd;
      else if (envNum < 1.0) envComment = COMMENTS.env.factory;
      comments.push({ icon: '🏢', name: '办公环境', value: ENV_NAMES[workEnvironment] || workEnvironment, comment: envComment, type: envType, fill: envFill });

      const intNum = parseFloat(workIntensity);
      let intComment = COMMENTS.intensity.normal;
      let intType = 'green', intFill = 60;
      if (intNum <= 0.7) { intComment = COMMENTS.intensity.veryLow; intFill = 90; }
      else if (intNum <= 0.85) { intComment = COMMENTS.intensity.low; intFill = 75; }
      else if (intNum >= 1.2) { intComment = intNum >= 1.5 ? COMMENTS.intensity.veryHigh : COMMENTS.intensity.high; intType = 'red'; intFill = 35; }
      comments.push({ icon: '🔥', name: '工作强度', value: INTENSITY_NAMES[workIntensity] || workIntensity, comment: intComment, type: intType, fill: intFill });

      const leadNum = parseFloat(leadership);
      let leadComment = COMMENTS.leadership.normal;
      let leadType = 'orange', leadFill = 50;
      if (leadNum >= 1.1) { leadComment = leadNum >= 1.3 ? COMMENTS.leadership.excellent : COMMENTS.leadership.good; leadType = 'green'; leadFill = 80; }
      else if (leadNum <= 0.7) { leadComment = COMMENTS.leadership.bad; leadType = 'red'; leadFill = 30; }
      comments.push({ icon: '👔', name: '领导关系', value: LEADERSHIP_NAMES[leadership] || leadership, comment: leadComment, type: leadType, fill: leadFill });

      const teamNum = parseFloat(teamwork);
      let teamComment = COMMENTS.teamwork.normal;
      let teamType = 'orange', teamFill = 55;
      if (teamNum >= 1.1) { teamComment = teamNum >= 1.2 ? COMMENTS.teamwork.excellent : COMMENTS.teamwork.good; teamType = 'green'; teamFill = 80; }
      else if (teamNum <= 0.9) { teamComment = COMMENTS.teamwork.bad; teamType = 'red'; teamFill = 35; }
      comments.push({ icon: '👥', name: '同事关系', value: TEAMWORK_NAMES[teamwork] || teamwork, comment: teamComment, type: teamType, fill: teamFill });

      comments.push({ icon: '💕', name: '异性环境', value: ATTRACTIVENESS_NAMES[attractiveness] || attractiveness, comment: COMMENTS.attractiveness[attractiveness] || '', type: parseFloat(attractiveness) >= 1.1 ? 'green' : 'orange', fill: parseFloat(attractiveness) >= 1.1 ? 75 : 50 });

      const degNum = parseFloat(degreeType);
      let degComment = COMMENTS.degree.bachelor;
      let degType = 'purple', degFill = 50;
      if (degNum >= 2.0) { degComment = COMMENTS.degree.elitePhd; degFill = 95; }
      else if (degNum >= 1.8) { degComment = COMMENTS.degree.phd; degFill = 85; }
      else if (degNum >= 1.6) { degComment = COMMENTS.degree.eliteMaster; degFill = 75; }
      else if (degNum >= 1.4) { degComment = COMMENTS.degree.master; degFill = 65; }
      else if (degNum >= 1.2) { degComment = COMMENTS.degree.eliteBachelor; degFill = 55; }
      else if (degNum < 1.0) { degComment = COMMENTS.degree.below; degFill = 40; }
      comments.push({ icon: '🎓', name: '学历背景', value: DEGREE_NAMES[degreeType] || degreeType, comment: degComment, type: degType, fill: degFill });

      const years = parseInt(workYears);
      let yearsComment = COMMENTS.years.fresh;
      let yearsType = 'blue', yearsFill = 40;
      if (years >= 5) { yearsComment = COMMENTS.years.senior; yearsFill = 85; }
      else if (years >= 1) { yearsComment = COMMENTS.years.mid; yearsFill = 60; }
      comments.push({ icon: '📈', name: '工作经验', value: YEARS_NAMES[workYears] || workYears, comment: yearsComment, type: yearsType, fill: yearsFill });

      let advice = '';
      if (valueIndex < 1.0) advice = `虽然目前的工作性价比较低，但这可能是积累经验的必经阶段。记住每份工作都有其价值，努力汲取经验，为下一步发展打好基础。`;
      else if (valueIndex < 2.5) advice = `你的工作性价比处于中等水平，有优点也有不足。可以专注于现有优势，同时寻找提升不足方面的方法，让工作体验更加全面。`;
      else advice = `恭喜你拥有高性价比的工作！这样的机会难得，要珍惜现在的环境，继续发挥自己的优势，享受工作带来的成就感和满足感。`;

      return { details: comments, advice };
    }

    function commuteComments(hours, wfh, hasShuttle) {
      let base = '';
      if (hours <= 0.5) base = COMMENTS.commute.short;
      else if (hours <= 1.5) base = COMMENTS.commute.medium;
      else base = COMMENTS.commute.long;

      const wfhRatio = parseInt(wfh) / 5;
      if (wfhRatio >= 0.4) return base + ' ' + COMMENTS.wfh.high;
      if (wfhRatio > 0) return base + ' ' + COMMENTS.wfh.medium;
      if (hasShuttle && hasShuttle !== 'none' && parseFloat(hasShuttle) <= 0.7) return base + ' ' + COMMENTS.shuttle;
      return base;
    }

    // ====== 从多来源获取token ======
    function getToken() {
      const urlParams = new URLSearchParams(window.location.search);
      let token = urlParams.get('token');
      if (!token && window.linkValidator && window.linkValidator.token) {
        token = window.linkValidator.token;
      }
      if (!token) {
        try {
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith('wjt_result_')) {
              token = key.replace('wjt_result_', '');
              break;
            }
          }
        } catch(e) {}
      }
      return token;
    }

    // ====== 获取测试结果 ======
    function getTestResult() {
      const token = getToken();
      if (token) {
        const storageKey = `wjt_result_${token}`;
        const resultJson = localStorage.getItem(storageKey);
        if (resultJson) {
          try { return JSON.parse(resultJson); } catch(e) {}
        }
      }
      // 兼容旧key
      const oldJson = localStorage.getItem('worthjob_answers');
      if (oldJson) {
        try {
          const answers = JSON.parse(oldJson);
          return { answers };
        } catch(e) {}
      }
      return null;
    }

    // ====== 重新测试 ======
    document.getElementById('btn-retry').addEventListener('click', function() {
      // 清除SDK本地结果
      if (window.linkValidator && typeof window.linkValidator.clearLocalResult === 'function') {
        window.linkValidator.clearLocalResult();
      }
      // 清除localStorage中的测试结果
      const token = getToken();
      if (token) {
        localStorage.removeItem(`wjt_result_${token}`);
      }
      localStorage.removeItem('worthjob_answers');
      // 清除答题进度
      localStorage.removeItem('wjt_quiz_answers');
      localStorage.removeItem('wjt_quiz_index');

      // 构建index.html URL（带restart参数）
      const urlParams = new URLSearchParams();
      const currentUrlParams = new URLSearchParams(window.location.search);
      let currentToken = currentUrlParams.get('token');
      let isUnlimited = currentUrlParams.get('unlimited') === 'true';
      if (!currentToken && window.linkValidator && window.linkValidator.token) {
        currentToken = window.linkValidator.token;
        isUnlimited = window.linkValidator.unlimited || false;
      }
      if (currentToken) {
        if (isUnlimited) urlParams.set('unlimited', 'true');
        urlParams.set('token', currentToken);
        urlParams.set('restart', 'true');
      }
      const queryString = urlParams.toString();
      const indexUrl = queryString ? `index.html?${queryString}` : 'index.html';
      window.location.href = indexUrl;
    });

    // ====== SDK初始化 ======
    let validatorInstance = null;

    if (typeof PsyTestValidator !== 'undefined') {
      PsyTestValidator.init('wjt', {
        onSuccess: function(result, validator) {
          console.log('SDK初始化成功:', result);
          validatorInstance = validator;
          window.linkValidator = validator;
          document.body.classList.remove('page-disabled');
          const errorOverlay = document.getElementById('errorOverlay');
          if (errorOverlay) errorOverlay.style.display = 'none';

          // 显示推广链接
          setTimeout(() => {
            if (typeof PsyTestValidator !== 'undefined' && typeof PsyTestValidator.addPromotionLink === 'function') {
              PsyTestValidator.addPromotionLink();
            }
          }, 200);
        },
        onError: function(error) {
          console.error('SDK初始化失败:', error);
          if (window.PsyTestValidator && typeof window.PsyTestValidator.getInstance === 'function') {
            validatorInstance = window.PsyTestValidator.getInstance();
          }
          if (validatorInstance) window.linkValidator = validatorInstance;
          document.body.classList.remove('page-disabled');
          const errorOverlay = document.getElementById('errorOverlay');
          if (errorOverlay) errorOverlay.style.display = 'none';
        },
        onLoad: function(data) {
          console.log('SDK加载完成:', data);
          if (!validatorInstance) {
            if (window.PsyTestValidator && typeof window.PsyTestValidator.getInstance === 'function') {
              validatorInstance = window.PsyTestValidator.getInstance();
            }
            if (!validatorInstance && window.linkValidator) validatorInstance = window.linkValidator;
          }
          if (validatorInstance) window.linkValidator = validatorInstance;

          // 显示推广链接
          setTimeout(() => {
            if (typeof PsyTestValidator !== 'undefined' && typeof PsyTestValidator.addPromotionLink === 'function') {
              PsyTestValidator.addPromotionLink();
            }
          }, 200);

          // 初始化报告
          init();
        }
      });
    } else {
      console.error('验证SDK未加载');
      document.body.classList.remove('page-disabled');
      init();
    }

    // ====== 初始化 ======
    function init() {
      const savedResult = getTestResult();
      if (!savedResult || !savedResult.answers) {
        document.getElementById('reportContent').innerHTML = `
          <div style="padding:40px 20px;text-align:center;">
            <div style="font-size:48px;margin-bottom:16px;">🔍</div>
            <div style="font-size:18px;font-weight:700;margin-bottom:8px;">暂无测试数据</div>
            <div style="color:#aaa;font-size:14px;">请先完成测试</div>
            <button onclick="window.location.href='quiz.html'" style="
              margin-top:24px;
              background:#1a1a1a;color:#fff;
              border:none;padding:16px 32px;border-radius:12px;
              font-size:16px;font-weight:700;cursor:pointer;
            ">开始测试</button>
          </div>
        `;
        return;
      }

      const answers = savedResult.answers;
      const result = calculateResult(answers);
      renderReport(result, answers);
    }
  </script>
</body>
</html>
