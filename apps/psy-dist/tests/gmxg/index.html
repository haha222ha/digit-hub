<div class="container">

            <div class="feature-box"><div class="feature-icon">✨</div><div class="feature-title">性格反差</div><div class="feature-desc">找到你们性格的差异点。</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const questions = [
    {d:'extrovert',t:'外向性',q:"你更愿意用哪种方式交朋友？",o:[{t:"主动搭话，快速熟络",s:3},{t:"慢慢接触，熟悉后放开",s:2},{t:"等别人主动",s:1},{t:"只和认识的人玩",s:0}]},
    {d:'extrovert',t:'外向性',q:"在聚会中你通常？",o:[{t:"活跃气氛，带动话题",s:3},{t:"和熟悉的人聊天",s:2},{t:"安静观察",s:1},{t:"想快点离开",s:0}]},
    {d:'decision',t:'决策力',q:"出门旅游谁负责规划？",o:[{t:"我来做计划",s:3},{t:"我提建议，一起决定",s:2},{t:"听对方的",s:1},{t:"走一步看一步",s:0}]},
    {d:'decision',t:'决策力',q:"遇到选择困难时？",o:[{t:"快速决定",s:3},{t:"分析后决定",s:2},{t:"纠结很久",s:1},{t:"让别人决定",s:0}]},
    {d:'emotion',t:'情绪表达',q:"你表达情绪的方式？",o:[{t:"直接说出来",s:3},{t:"写下来或找人说",s:2},{t:"自己消化",s:1},{t:"压抑着",s:0}]},
    {d:'emotion',t:'情绪表达',q:"哭的时候你会？",o:[{t:"大声哭出来",s:3},{t:"偷偷流泪",s:2},{t:"忍回去",s:1},{t:"不会哭",s:0}]},
    {d:'lifestyle',t:'生活方式',q:"你的房间通常？",o:[{t:"整洁有序",s:3},{t:"大致整洁",s:2},{t:"比较乱",s:1},{t:"很乱但自己找得到",s:0}]},
    {d:'lifestyle',t:'生活方式',q:"你更喜欢？",o:[{t:"计划性强",s:3},{t:"有些计划",s:2},{t:"随性而为",s:1},{t:"完全随机",s:0}]},
    {d:'communication',t:'沟通风格',q:"你们吵架后会？",o:[{t:"立刻和好",s:3},{t:"冷静后沟通",s:2},{t:"等对方先道歉",s:1},{t:"冷战后和好",s:0}]},
    {d:'communication',t:'沟通风格',q:"你更喜欢哪种沟通？",o:[{t:"面对面聊天",s:3},{t:"发消息沟通",s:2},{t:"文字表达",s:1},{t:"不太沟通",s:0}]}
];
const profiles = [
    {name:'社交达人',desc:'外向活泼，喜欢结交新朋友，擅长活跃气氛，是聚会中的焦点。'},
    {name:'慢热内向',desc:'熟悉后才会展现真实一面，表面安静其实内心丰富，需要时间来建立信任。'},
    {name:'理性决策者',desc:'遇事冷静，善于分析利弊，做决定果断，是团队中的主心骨。'},
    {name:'随性自由派',desc:'喜欢随遇而安，不喜欢被束缚，享受过程大于追求结果。'},
    {name:'情感丰富',desc:'共情能力强，容易被感动，情绪外露但真诚，是朋友的情感支撑。'},
    {name:'内敛沉稳',desc:'情绪不外露，但内心细腻善于观察，是值得信赖的倾听者。'},
    {name:'计划控',desc:'喜欢一切井井有条，有强烈的掌控感，是生活中的靠谱担当。'},
    {name:'随性派',desc:'喜欢灵活自由，不喜欢被计划束缚，是生活中的开心果。'}
];
let currQList=[],currIdx=0,myScores={extrovert:0,decision:0,emotion:0,lifestyle:0,communication:0};
function startTest(){currQList=[...questions];currIdx=0;myScores={extrovert:0,decision:0,emotion:0,lifestyle:0,communication:0};document.getElementById('page-intro').style.display='none';document.getElementById('page-test').style.display='flex';renderQuestion();}
function renderQuestion(){const q=currQList[currIdx];document.getElementById('progress-text').innerText=`${currIdx+1}/${currQList.length}`;document.getElementById('progress-fill').style.width=`${(currIdx/currQList.length)*100}%`;document.getElementById('dim-tag').innerText=`维度：${q.t}`;document.getElementById('q-category').innerText=q.t;const wrapper=document.getElementById('question-wrapper');wrapper.classList.remove('slide-up');void wrapper.offsetWidth;wrapper.classList.add('slide-up');document.getElementById('question-text').innerText=q.q;const box=document.getElementById('options-box');box.innerHTML='';q.o.forEach(opt=>{const btn=document.createElement('div');btn.className='option-btn';btn.innerText=opt.t;btn.onclick=()=>{Array.from(box.children).forEach(c=>c.classList.remove('selected'));btn.classList.add('selected');setTimeout(()=>handleAnswer(q.d,opt.s),200);};box.appendChild(btn);});}
function handleAnswer(dim,val){myScores[dim]+=val;if(currIdx<currQList.length-1){currIdx++;renderQuestion();}else{finishTest();}}
function finishTest(){document.getElementById('page-test').style.display='none';setTimeout(()=>{document.getElementById('page-result').style.display='block';calculateResult();},1000);}
function calculateResult(){let total=Object.values(myScores).reduce((a,b)=>a+b,0);let myType=profiles[Math.floor(Math.random()*profiles.length)];let friendType=profiles[Math.floor(Math.random()*profiles.length)];let contrast=100-Math.abs(total%30-15)*3;document.getElementById('me-desc').innerText=myType.name+':'+myType.desc;document.getElementById('friend-desc').innerText=friendType.name+':'+friendType.desc;document.getElementById('res-score').innerText=contrast+'%';document.getElementById('insight-text').innerText=`你们的性格反差为${contrast}%。${contrast>70?'你们是完美互补型！一个外向一个内向，一个主导一个配合，这样的组合往往能互相补充，共同成长。':'你们的性格有一定差异，但正是这种差异让你们的关系更加丰富多彩。学会欣赏对方的不同，互补会让你们更默契。'}`;}
async function exportPDF(){const{jsPDF}=window.jspdf;const doc=new jsPDF();doc.setFillColor(255,107,129);doc.rect(0,0,210,40,'F');doc.setTextColor(255,255,255);doc.setFontSize(22);doc.text('闺蜜性格反差测试报告',105,25,{align:'center'});doc.setTextColor(100,100,100);doc.setFontSize(10);doc.text('专业心理测评·2026全新版',105,35,{align:'center'});let y=55;doc.setTextColor(0,0,0);doc.setFontSize(14);doc.text('你们是完美互补型闺蜜！',15,y);y+=10;doc.setFontSize(10);doc.text('性格反差让你们的友谊更加深厚。',15,y);doc.save('闺蜜性格反差报告.pdf');}
document.getElementById('start-btn').addEventListener('click',function(){startTest();document.getElementById('page-intro').style.display='none';document.getElementById('page-test').style.display='flex';});document.getElementById('retry-btn').addEventListener('click',()=>location.reload());document.getElementById('export-pdf-btn').addEventListener('click',exportPDF);
</script>
