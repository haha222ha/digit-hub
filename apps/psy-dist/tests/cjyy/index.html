<div class="container">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const questions = [
    {d:'communication',t:'沟通模式',q:"你们吵架时通常怎么说话？",o:[{t:"互相指责，音量越来越高",s:0},{t:"冷战，谁也不理谁",s:1},{t:"就事论事，理性讨论",s:3},{t:"很快冷静下来沟通",s:4}]},
    {d:'communication',t:'沟通模式',q:"吵完架后你会道歉吗？",o:[{t:"几乎不觉得自己有错",s:0},{t:"偶尔会道歉",s:2},{t:"通常会主动道歉",s:3},{t:"总是先道歉求和",s:4}]},
    {d:'communication',t:'沟通模式',q:"你会重复指责对方吗？",o:[{t:"经常翻旧账",s:0},{t:"偶尔会",s:2},{t:"很少",s:3},{t:"从不",s:4}]},
    {d:'emotion',t:'情绪管理',q:"吵架时你能控制情绪吗？",o:[{t:"完全控制不住",s:0},{t:"偶尔能控制",s:2},{t:"大部分能控制",s:3},{t:"总能保持冷静",s:4}]},
    {d:'emotion',t:'情绪管理',q:"你会在激动时说狠话吗？",o:[{t:"经常说伤害性的话",s:0},{t:"偶尔会说",s:2},{t:"很少说",s:3},{t:"从来不说",s:4}]},
    {d:'emotion',t:'情绪管理',q:"对方生气时你会？",o:[{t:"更生气，对吵",s:0},{t:"冷战，等对方消气",s:1},{t:"尽量冷静，暂停",s:3},{t:"立刻道歉安抚",s:4}]},
    {d:'need',t:'需求差异',q:"你希望对方多陪伴吗？",o:[{t:"非常希望，占有欲强",s:0},{t:"比较希望",s:2},{t:"还好，各自空间",s:3},{t:"不需要太多",s:4}]},
    {d:'need',t:'需求差异',q:"对方忽略你时你会？",o:[{t:"非常愤怒，立刻质问",s:0},{t:"心里不舒服但不说",s:1},{t:"会沟通表达",s:3},{t:"理解对方，不在意",s:4}]},
    {d:'need',t:'需求差异',q:"你更看重对方的什么？",o:[{t:"对我好，照顾我",s:2},{t:"事业有成",s:2},{t:"理解我，支持我",s:3},{t:"性格合适，三观合",s:4}]},
    {d:'value',t:'价值观',q:"你们对花钱看法一致吗？",o:[{t:"完全不一致，经常为此吵",s:0},{t:"有时会分歧",s:2},{t:"大部分一致",s:3},{t:"完全一致",s:4}]},
    {d:'value',t:'价值观',q:"对未来规划有分歧吗？",o:[{t:"完全没有共识",s:0},{t:"有一些分歧",s:2},{t:"基本一致",s:3},{t:"完全一致",s:4}]},
    {d:'value',t:'价值观',q:"对家庭关系的看法？",o:[{t:"完全不一样",s:0},{t:"有分歧",s:2},{t:"比较一致",s:3},{t:"完全一致",s:4}]},
    {d:'habit',t:'生活习惯',q:"生活习惯差异大吗？",o:[{t:"完全不一样，磨合难",s:0},{t:"有一些差异",s:2},{t:"比较相似",s:3},{t:"几乎一样",s:4}]},
    {d:'habit',t:'生活习惯',q:"你会因为小事生气吗？",o:[{t:"经常为小事爆炸",s:0},{t:"偶尔会",s:2},{t:"很少",s:3},{t:"几乎不会",s:4}]},
    {d:'habit',t:'生活习惯',q:"对方的行为让你不满时？",o:[{t:"直接发火",s:0},{t:"憋在心里",s:1},{t:"会沟通但可能升级",s:2},{t:"直接沟通解决",s:4}]},
    {d:'pressure',t:'外部压力',q:"工作压力会影响你们吗？",o:[{t:"经常把情绪带回家",s:0},{t:"偶尔会",s:2},{t:"尽量不影響",s:3},{t:"完全不影响",s:4}]},
    {d:'pressure',t:'外部压力',q:"家庭压力会让你们吵架吗？",o:[{t:"经常为此争吵",s:0},{t:"偶尔会",s:2},{t:"很少",s:3},{t:"完全不会",s:4}]},
    {d:'pressure',t:'外部压力',q:"你会把对方当出气筒吗？",o:[{t:"经常",s:0},{t:"偶尔",s:2},{t:"很少",s:3},{t:"从不",s:4}]}
];
const reasons = {
    communication: {icon:'💬',name:'沟通模式问题',desc:'你们的沟通方式存在问题。一个说东一个说西，或者一方只会指责另一方沉默。',solution:'学习非暴力沟通，用"我感受"代替"你总是"，避免指责，学会倾听。'},
    emotion: {icon:'😤',name:'情绪管理不足',desc:'双方都在情绪激动时失去理智，说出伤害对方的话。',solution:'建立情绪暂停机制，激动时先冷静10分钟再沟通，学习情绪调节技巧。'},
    need: {icon:'💔',name:'需求不匹配',desc:'你对陪伴的需求和对方能给予的不一致，导致一方感到被忽视。',solution:'明确表达自己的需求，同时也理解对方的需求，找到平衡点。'},
    value: {icon:'⚖️',name:'价值观差异',desc:'在花钱、未来规划、家庭观念等方面存在根本分歧。',solution:'深入沟通了解彼此的价值观差异，寻找共同点，尊重差异。'},
    habit: {icon:'🔄',name:'生活习惯冲突',desc:'生活细节上的不同让双方感到不适，小事积累成大问题。',solution:'互相尊重和妥协，建立共同的 生活习惯，给彼此空间。'},
    pressure: {icon:'😰',name:'外部压力影响',desc:'工作压力、家庭压力等外部因素影响了感情。',solution:'学会分开处理情绪和事情，不把压力转嫁到伴侣身上，共同面对。'}
};
let scores={communication:0,emotion:0,need:0,value:0,habit:0,pressure:0},currQList=[],currIdx=0;
function goToDemo(){document.getElementById('page-intro').style.display='none';document.getElementById('page-demo').style.display='block';}
function initTest(){currQList=[...questions];currIdx=0;scores={communication:0,emotion:0,need:0,value:0,habit:0,pressure:0};document.getElementById('page-demo').style.display='none';document.getElementById('page-test').style.display='flex';renderQuestion();}
function renderQuestion(){const q=currQList[currIdx];document.getElementById('progress-text').innerText=`${currIdx+1}/${currQList.length}`;document.getElementById('progress-fill').style.width=`${(currIdx/currQList.length)*100}%`;document.getElementById('dim-tag').innerText=`维度：${q.t}`;document.getElementById('q-category').innerText=q.t;const wrapper=document.getElementById('question-wrapper');wrapper.classList.remove('slide-up');void wrapper.offsetWidth;wrapper.classList.add('slide-up');document.getElementById('question-text').innerText=q.q;const box=document.getElementById('options-box');box.innerHTML='';q.o.forEach(opt=>{const btn=document.createElement('div');btn.className='option-btn';btn.innerText=opt.t;btn.onclick=()=>{Array.from(box.children).forEach(c=>c.classList.remove('selected'));btn.classList.add('selected');setTimeout(()=>handleAnswer(q.d,opt.s),200);};box.appendChild(btn);});}
function handleAnswer(dim,val){scores[dim]+=val;if(currIdx<currQList.length-1){currIdx++;renderQuestion();}else{finishTest();}}
function finishTest(){document.getElementById('page-test').style.display='none';setTimeout(()=>{document.getElementById('page-result').style.display='block';calculateResult();},2000);}
function calculateResult(){let sorted=Object.entries(scores).sort((a,b)=>a[1]-b[1]);let main=sorted[0][0];let mainReason=reasons[main];document.getElementById('main-icon').innerText=mainReason.icon;document.getElementById('main-title').innerText=mainReason.name;document.getElementById('main-desc').innerText=mainReason.desc;const listContainer=document.getElementById('reason-list');let listHtml='';sorted.forEach((item,index)==>{let r=reasons[item[0]];let level=item[1]<=12?'轻':(item[1]<=20?'中':'重');let color=item[1]<=12?'#2ED573':(item[1]<=20?'#FDCB6E':'#FF7675');listHtml+=`<div class="reason-item"><div class="reason-icon">${r.icon}</div><div class="reason-name">${r.name}</div><div class="reason-score" style="color:${color}">${level}</div></div>`;});listContainer.innerHTML=listHtml;document.getElementById('solution-text').innerText=mainReason.solution;}
function goToReport(){document.getElementById('report-modal').style.display='block';}
async function exportPDF(){const{jsPDF}=window.jspdf;const doc=new jsPDF();doc.setFillColor(255,118,117);doc.rect(0,0,210,40,'F');doc.setTextColor(255,255,255);doc.setFontSize(22);doc.text('吵架原因深度分析报告',105,25,{align:'center'});doc.setTextColor(100,100,100);doc.setFontSize(10);doc.text('专业心理测评·2026全新版',105,35,{align:'center'});let y=55;const main=reasons[Object.entries(scores).sort((a,b)=>a[1]-b[1])[0][0]];doc.setTextColor(0,0,0);doc.setFontSize(16);doc.text(`主要问题：${main.name}`,15,y);y+=10;doc.setFontSize(12);doc.text(main.desc.substring(0,150)+'...',15,y);doc.save('吵架原因分析.pdf');}
document.getElementById('start-btn').addEventListener('click', function() {
        
 goToDemo(); });document.getElementById('next-btn').addEventListener('click',initTest);document.getElementById('export-pdf-btn').addEventListener('click',exportPDF);
</script>
