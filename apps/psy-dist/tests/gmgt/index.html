<script>
const questions = [
    {d:'sensory',t:'👁️ 感官敏感',q:"你对噪音、气味、光线等感觉敏感吗？",o:[{t:"非常敏感，一点刺激就难受",s:4},{t:"比较敏感，需要安静环境",s:3},{t:"偶尔敏感",s:2},{t:"不太敏感",s:1}]},

    {d:'sensory',t:'👁️ 感官敏感',q:"你能注意到别人注意不到的细节吗？",o:[{t:"经常能注意到",s:4},{t:"有时候会",s:3},{t:"偶尔",s:2},{t:"很少",s:1}]},
    {d:'sensory',t:'👁️ 感官敏感',q:"咖啡因、酒精等对你影响大吗？",o:[{t:"影响很大",s:4},{t:"影响比较大",s:3},{t:"影响一般",s:2},{t:"影响很小",s:1}]},
    {d:'sensory',t:'👁️ 感官敏感',q:"你对食物的味道和质地敏感吗？",o:[{t:"非常敏感，挑食",s:4},{t:"比较敏感",s:3},{t:"一般",s:2},{t:"不敏感",s:1}]},
    {d:'emotional',t:'💗 情感敏感',q:"你看电影或新闻容易流泪吗？",o:[{t:"经常被感动",s:4},{t:"比较容易",s:3},{t:"偶尔",s:2},{t:"很少",s:1}]},
    {d:'emotional',t:'💗 情感敏感',q:"别人的情绪会传染给你吗？",o:[{t:"非常容易受影响",s:4},{t:"比较容易",s:3},{t:"偶尔",s:2},{t:"很少",s:1}]},
    {d:'emotional',t:'💗 情感敏感',q:"你容易感到内疚或羞耻吗？",o:[{t:"经常",s:4},{t:"比较经常",s:3},{t:"偶尔",s:2},{t:"很少",s:1}]},
    {d:'emotional',t:'💗 情感敏感',q:"你对批评的反应是？",o:[{t:"很难过，需要很久恢复",s:4},{t:"会难过一阵",s:3},{t:"有点难过但能很快调整",s:2},{t:"能理性接受",s:1}]},
    {d:'emotional',t:'💗 情感敏感',q:"你容易感到"社死"或尴尬吗？",o:[{t:"经常感到尴尬",s:4},{t:"比较敏感",s:3},{t:"偶尔",s:2},{t:"很少",s:1}]},
    {d:'intuitive',t:'🔮 直觉敏锐',q:"你相信自己的直觉吗？",o:[{t:"非常相信，直觉很准",s:4},{t:"比较相信",s:3},{t:"有时候信",s:2},{t:"不太相信",s:1}]},
    {d:'intuitive',t:'🔮 直觉敏锐',q:"你能感知到别人隐藏的情绪吗？",o:[{t:"经常能感知到",s:4},{t:"有时候能",s:3},{t:"偶尔",s:2},{t:"很少",s:1}]},
    {d:'intuitive',t:'🔮 直觉敏锐',q:"你对环境氛围的变化敏感吗？",o:[{t:"非常敏感，能感知到微妙变化",s:4},{t:"比较敏感",s:3},{t:"偶尔",s:2},{t:"不太敏感",s:1}]},
    {d:'intuitive',t:'🔮 直觉敏锐',q:"你有没有"第六感"很强的经历？",o:[{t:"经常有",s:4},{t:"有过几次",s:3},{t:"偶尔",s:2},{t:"很少",s:1}]},
    {d:'creative',t:'🎨 创意敏锐',q:"你的思维跳跃，想法丰富吗？",o:[{t:"非常跳跃，想法很多",s:4},{t:"比较丰富",s:3},{t:"一般",s:2},{t:"比较按部就班",s:1}]},
    {d:'creative',t:'🎨 创意敏锐',q:"你对艺术、音乐、文学有强烈感受吗？",o:[{t:"非常有感受力",s:4},{t:"比较强",s:3},{t:"一般",s:2},{t:"不太强烈",s:1}]},
    {d:'creative',t:'🎨 创意敏锐',q:"你容易沉浸在自己的世界里吗？",o:[{t:"经常，幻想丰富",s:4},{t:"有时候",s:3},{t:"偶尔",s:2},{t:"很少",s:1}]},
    {d:'creative',t:'🎨 创意敏锐',q:"你善于发现美和独特的东西吗？",o:[{t:"非常善于发现",s:4},{t:"比较善于",s:3},{t:"一般",s:2},{t:"不太善于",s:1}]},
    {d:'depth',t:'📚 深度思考',q:"你喜欢深度对话还是浅层闲聊？",o:[{t:"喜欢深度对话",s:4},{t:"比较喜欢深度",s:3},{t:"都可以",s:2},{t:"更喜欢轻松的",s:1}]},
    {d:'depth',t:'📚 深度思考',q:"你会反复思考一个问题直到理解吗？",o:[{t:"必须想透才罢休",s:4},{t:"经常深度思考",s:3},{t:"偶尔",s:2},{t:"很少钻牛角尖",s:1}]}
];
const levels = [
    {max:30,l:"敏感度较低",c:"#00B894",d:"你的敏感程度相对较低，更容易适应各种环境。",advice:"你的敏感特质不太明显，但也可以学习高敏感人群的一些优势能力。",points:["保持现状","适度提升觉察力","学习专注力"]},
    {max:50,l:"轻度敏感",c:"#00CEC9",d:"你有一定的敏感特质，但不会过度影响生活。",advice:"你的敏感特质是优势，注意发挥和培养。",points:["发挥敏感优势","学习情绪调节","创造适宜环境"]},
    {max:70,l:"中度敏感",c:"#a29bfe',d:"你是高敏感人群，拥有独特的感知天赋。",advice:"接受并拥抱你的敏感特质，这是你的超能力。学会保护自己的能量。",points:["接纳敏感特质","建立边界","发挥天赋优势","寻找同类社群"]},
    {max:80,l:"高度敏感",c:"#81ecec',d:"你是高度敏感者，敏感程度较高，拥有极强的感知能力。",advice:"你的敏感需要被理解和善待。找到适合你的环境和方式，让天赋绽放。",points:["优先照顾自己","创造低刺激环境","发挥深度感知力","寻求支持系统"]}
];
let currQList=[],currIdx=0,scores={sensory:0,emotional:0,intuitive:0,creative:0,depth:0};
function goToDemo(){document.getElementById('page-intro').style.display='none';document.getElementById('page-demo').style.display='block';}
function initTest(){currQList=[...questions];currIdx=0;scores={sensory:0,emotional:0,intuitive:0,creative:0,depth:0};document.getElementById('page-demo').style.display='none';document.getElementById('page-test').style.display='flex';renderQuestion();}
function renderQuestion(){const q=currQList[currIdx];document.getElementById('progress-text').innerText=`${currIdx+1}/${currQList.length}`;document.getElementById('progress-fill').style.width=`${(currIdx/currQList.length)*100}%`;document.getElementById('dim-tag').innerText=`维度：${q.t}`;document.getElementById('q-category').innerText=q.t;const wrapper=document.getElementById('question-wrapper');wrapper.classList.remove('slide-up');void wrapper.offsetWidth;wrapper.classList.add('slide-up');document.getElementById('question-text').innerText=q.q;const box=document.getElementById('options-box');box.innerHTML='';q.o.forEach(opt=>{const btn=document.createElement('div');btn.className='option-btn';btn.innerText=opt.t;btn.onclick=()=>{Array.from(box.children).forEach(c=>c.classList.remove('selected'));btn.classList.add('selected');setTimeout(()=>handleAnswer(q.d,opt.s),200);};box.appendChild(btn);});}
function handleAnswer(dim,val){scores[dim]+=val;if(currIdx<currQList.length-1){currIdx++;renderQuestion();}else{finishTest();}}
function finishTest(){document.getElementById('page-test').style.display='none';setTimeout(()=>{document.getElementById('page-result').style.display='block';calculateResult();},2000);}
function calculateResult(){let total=Object.values(scores).reduce((a,b)=>a+b,0);let finalScore=Math.round(total);let lvl=levels.find(l=>finalScore<=l.max)||levels[levels.length-1];let start=0;const timer=setInterval(()=>{start++;document.getElementById('res-score').innerText=start;if(start>=finalScore)clearInterval(timer);},15);document.getElementById('res-level').innerText=lvl.l;document.getElementById('res-level').style.background=lvl.c;document.getElementById('res-desc').innerText=lvl.d;renderBars(scores);}
function renderBars(s){const box=document.getElementById('bars-container');const dims=[{k:'sensory',n:'感官'},{k:'emotional',n:'情感'},{k:'intuitive',n:'直觉'},{k:'creative',n:'创意'},{k:'depth',n:'思考'}];let html='';dims.forEach(d=>{let maxScore=d.k==='sensory'?20:d.k==='emotional'?20:d.k==='intuitive'?16:d.k==='creative'?16:d.k==='depth'?8;let pct=Math.min((s[d.k]/maxScore)*100,100);let color=pct>=75?'#00B894':(pct>=50?'#fdcb6e':'#fd79a8');html+=`<div class="dim-row"><div class="dim-info"><span class="dim-name">${d.n}</span></div><div class="dim-bar-bg"><div class="dim-bar-fill" style="width:${pct}%;background:${color};"></div></div><div class="dim-val" style="color:${color}">${Math.round(pct)}%</div></div>`;});box.innerHTML=html;}
function showReport(){const total=parseInt(document.getElementById('res-score').innerText);const lvl=levels.find(l=>total<=l.max)||levels[levels.length-1];let html=`<div class="report_section"><div class="r-h1">一、高敏感天赋诊断</div><div class="r-box" style="border-left:5px solid ${lvl.c};"><div style="font-size:20px;font-weight:900;color:${lvl.c};margin-bottom:8px;">敏感类型：${lvl.l}</div><p style="margin:0;font-size:14px;line-height:1.6;color:#555;">${lvl.d}</p><p style="margin:10px 0 0;font-size:14px;"><strong>核心建议：</strong>${lvl.advice}</p></div></div><div class="report_section"><div class="r-h2">二、五维敏感天赋分析</div>${Object.entries(scores).map(([k,v])=>{let maxScore=k==='sensory'?20:k==='emotional'?20:k==='intuitive'?16:k==='creative'?16:8;let level=v/maxScore>=0.75?'很强':(v/maxScore>=0.5?'较强':'一般');let color=v/maxScore>=0.75?'#00B894':(v/maxScore>=0.5?'#fdcb6e':'#fd79a8');return`<div style="margin-bottom:15px;padding:12px;background:#fafafa;border-radius:8px;"><div style="font-weight:700;margin-bottom:5px;">${['感官敏感度','情感敏感度','直觉敏锐度','创意敏锐度','深度思考力'][['sensory','emotional','intuitive','creative','depth'].indexOf(k)]}</div><div style="height:6px;background:#eee;border-radius:3px;"><div style="height:100%;width:${(v/maxScore)*100}%;background:${color};border-radius:3px;"></div></div><div style="font-size:12px;color:#999;">敏感水平：<span style="color:${color}">${level}</span></div></div>`}).join('')}</div><div class="report_section"><div class="r-h2">三、天赋发挥建议</div><div class="r-box"><ul style="margin:0;padding-left:20px;line-height:2;">${lvl.points.map(p=>`<li>${p}</li>`).join('')}</ul></div></div><div style="text-align:center;color:#ccc;font-size:12px;margin-top:40px;">2026高敏感人群天赋测试·专业心理测评</div>`;document.getElementById('report-content').innerHTML=html;document.getElementById('report-modal').style.display='block';}
function closeReport(){document.getElementById('report-modal').style.display='none';}
async function exportPDF(){const{jsPDF}=window.jspdf;const doc=new jsPDF();doc.setFillColor(162,155,254);doc.rect(0,0,210,40,'F');doc.setTextColor(255,255,255);doc.setFontSize(22);doc.text('高敏感人群天赋测试报告',105,25,{align:'center'});doc.setTextColor(100,100,100);doc.setFontSize(10);doc.text('专业心理测评·2026全新版',105,35,{align:'center'});let y=55;const lvl=levels.find(l=>parseInt(document.getElementById('res-score').innerText)<=l.max)||levels[levels.length-1];doc.setTextColor(0,0,0);doc.setFontSize(16);doc.text(`敏感类型：${lvl.l}`,15,y);y+=10;doc.setFontSize(12);doc.text(lvl.d.substring(0,150)+'...',15,y);doc.save('高敏感天赋报告.pdf');}

 goToDemo(); });document.getElementById('next-btn').addEventListener('click',initTest);document.getElementById('show-report-btn').addEventListener('click',showReport);document.getElementById('close-report-btn').addEventListener('click',closeReport);document.getElementById('export-pdf-btn').addEventListener('click',exportPDF);
