<script>
const questions = [
    {d:'clarity',t:'🎯 目标清晰度',q:"你清楚自己想转入哪个行业/岗位吗？",o:[{t:"非常清楚，目标明确",s:0},{t:"比较清楚，有几个选项",s:2},{t:"模糊，不确定是否适合",s:5},{t:"完全不知道该往哪转",s:8}]},
    {d:'clarity',t:'🎯 目标清晰度',q:"你了解目标行业的工作内容吗？",o:[{t:"非常了解，有实践经验",s:0},{t:"比较了解，通过调研",s:2},{t:"了解一些，但不深入",s:5},{t:"完全不了解",s:8}]},
    {d:'clarity',t:'🎯 目标清晰度',q:"你知道自己为什么想转行吗？",o:[{t:"目标明确，理性规划",s:0},{t:"有一定想法",s:2},{t:"只是逃避现状",s:5},{t:"随大流或一时冲动",s:8}]},
    {d:'clarity',t:'🎯 目标清晰度',q:"你为目标行业做过哪些准备？",o:[{t:"深入学习和实践过",s:0},{t:"参加过培训或兼职",s:2},{t:"只是看过一些资料",s:5},{t:"完全没有准备",s:8}]},
    {d:'risk',t:'⚠️ 风险承受力',q:"你能接受转行后薪资下降吗？",o:[{t:"完全能接受",s:0},{t:"能接受短期下降",s:2},{t:"不太能接受",s:5},{t:"完全无法接受",s:8}]},
    {d:'risk',t:'⚠️ 风险承受力',q:"如果转行失败，你的后备方案是？",o:[{t:"有清晰的备选方案",s:0},{t:"有一些人脉和资源",s:2},{t:"走一步看一步",s:5},{t:"没有想过失败",s:8}]},
    {d:'risk',t:'⚠️ 风险承受力',q:"转行需要你学习大量新知识，你准备好了吗？",o:[{t:"非常期待学习新东西",s:0},{t:"愿意学习但有顾虑",s:2},{t:"担心学习能力跟不上",s:5},{t:"害怕学习新东西",s:8}]},
    {d:'risk',t:'⚠️ 风险承受力',q:"你的经济储备能支撑多久的过渡期？",o:[{t:"足够支撑1-2年",s:0},{t:"可以支撑半年",s:2},{t:"最多3个月",s:5},{t:"几乎没有储备",s:8}]},
    {d:'skill',t:'💪 技能迁移力',q:"你有多少可迁移到新行业的技能？",o:[{t:"很多，核心技能通用",s:0},{t:"有一些可迁移技能",s:2},{t:"很少，几乎要从头学",s:5},{t:"几乎没有",s:8}]},
    {d:'skill',t:'💪 技能迁移力',q:"你的学习能力怎么样？",o:[{t:"很强，快速掌握新知识",s:0},{t:"比较好，适应较快",s:2},{t:"一般，需要时间",s:5},{t:"较弱，学习困难",s:8}]},
    {d:'skill',t:'💪 技能迁移力',q:"你在新行业有相关人脉吗？",o:[{t:"有很多行业人脉",s:0},{t:"认识一些业内人士",s:2},{t:"只有泛泛之交",s:5},{t:"完全不认识",s:8}]},
    {d:'skill',t:'💪 技能迁移力',q:"你有哪些可以用在简历上的成绩？",o:[{t:"有亮眼的跨行业成绩",s:0},{t:"有一些相关成就",s:2},{t:"成绩较少或与目标无关",s:5},{t:"几乎没有",s:8}]},
    {d:'mindset',t:'🧠 心态准备度',q:"你害怕从零开始吗？",o:[{t:"完全不怕，当作新挑战",s:0},{t:"有点担心但能克服",s:2},{t:"比较害怕",s:5},{t:"极度恐惧，不敢尝试",s:8}]},
    {d:'mindset',t:'🧠 心态准备度',q:"你能接受比原来低的职位吗？",o:[{t:"完全能，为了长远发展",s:0},{t:"勉强能接受",s:2},{t:"心理上难以接受",s:5},{t:"完全无法接受",s:8}]},
    {d:'mindset',t:'🧠 心态准备度',q:"你对转行后的未知感到兴奋还是恐惧？",o:[{t:"非常兴奋，期待新开始",s:0},{t:"有点期待也有点担心",s:2},{t:"担心大于期待",s:5},{t:"只有恐惧和焦虑",s:8}]},
    {d:'mindset',t:'🧠 心态准备度',q:"你能坚持多久看不到回报？",o:[{t:"可以坚持1-2年",s:0},{t:"半年左右",s:2},{t:"几个月",s:5},{t:"很快就会放弃",s:8}]},
    {d:'timing',t:'⏰ 时机成熟度',q:"你现在的处境适合转行吗？",o:[{t:"时机很好，适合行动",s:0},{t:"还行，可以考虑",s:2},{t:"时机不太好",s:5},{t:"非常不适合",s:8}]},
    {d:'timing',t:'⏰ 时机成熟度',q:"市场环境对你想转入的行业有利吗？",o:[{t:"非常有利，朝阳行业",s:0},{t:"还行，机会与挑战并存",s:2},{t:"不太好，竞争激烈",s:5},{t:"很差，不是好时机",s:8}]}
];
const levels = [
    {max:35,l:"适配度高",c:"#00B894",d:"你的转行适配度很高！具备良好的条件和准备，转行成功概率大。",advice:"把握时机，果断行动。可以考虑从小步快跑的方式逐步过渡。",points:["果断行动","从小步开始","善用人脉","持续学习"]},
    {max:70,l:"适配度中上",c:"#00CEC9",d:"你的转行适配度不错，但还有一些方面需要加强。",advice:"继续完善准备，补齐短板。建议先尝试兼职或项目积累经验。",points:["补齐短板","积累经验","拓展人脉","做好规划"]},
    {max:100,l:"适配度一般",c:"#FDCB6E",d:"你的转行适配度一般，需要更充分的准备才能降低风险。",advice:"建议先不要急于转行，继续积累经验和资源，等条件更成熟。",points:["延迟决策","积累经验","深度调研","培养技能"]},
    {max:144,l:"适配度低",c:"#e17055",d:"目前转行风险较高，条件还不够成熟。需要更多准备。",advice:"不建议现在转行。建议先在现有领域深耕，同时开始储备目标行业的能力和资源。",points:["暂缓转行","深耕现有","储备能力","寻找过渡"]}
];
let currQList=[],currIdx=0,scores={clarity:0,risk:0,skill:0,mindset:0,timing:0};
function goToDemo(){document.getElementById('page-intro').style.display='none';document.getElementById('page-demo').style.display='block';}
function initTest(){currQList=[...questions];currIdx=0;scores={clarity:0,risk:0,skill:0,mindset:0,timing:0};document.getElementById('page-demo').style.display='none';document.getElementById('page-test').style.display='flex';renderQuestion();}
function renderQuestion(){const q=currQList[currIdx];document.getElementById('progress-text').innerText=`${currIdx+1}/${currQList.length}`;document.getElementById('progress-fill').style.width=`${(currIdx/currQList.length)*100}%`;document.getElementById('dim-tag').innerText=`维度：${q.t}`;document.getElementById('q-category').innerText=q.t;const wrapper=document.getElementById('question-wrapper');wrapper.classList.remove('slide-up');void wrapper.offsetWidth;wrapper.classList.add('slide-up');document.getElementById('question-text').innerText=q.q;const box=document.getElementById('options-box');box.innerHTML='';q.o.forEach(opt=>{const btn=document.createElement('div');btn.className='option-btn';btn.innerText=opt.t;btn.onclick=()=>{Array.from(box.children).forEach(c=>c.classList.remove('selected'));btn.classList.add('selected');setTimeout(()=>handleAnswer(q.d,opt.s),200);};box.appendChild(btn);});}
function handleAnswer(dim,val){scores[dim]+=val;if(currIdx<currQList.length-1){currIdx++;renderQuestion();}else{finishTest();}}
function finishTest(){document.getElementById('page-test').style.display='none';setTimeout(()=>{document.getElementById('page-result').style.display='block';calculateResult();},2000);}
function calculateResult(){let total=Object.values(scores).reduce((a,b)=>a+b,0);let finalScore=Math.round(total);let lvl=levels.find(l=>finalScore<=l.max)||levels[levels.length-1];let start=0;const timer=setInterval(()=>{start++;document.getElementById('res-score').innerText=start;if(start>=finalScore)clearInterval(timer);},15);document.getElementById('res-level').innerText=lvl.l;document.getElementById('res-level').style.background=lvl.c;document.getElementById('res-desc').innerText=lvl.d;renderBars(scores);}
function renderBars(s){const box=document.getElementById('bars-container');const dims=[{k:'clarity',n:'目标'},{k:'risk',n:'风险'},{k:'skill',n:'技能'},{k:'mindset',n:'心态'},{k:'timing',n:'时机'}];let html='';dims.forEach(d=>{let maxScore=d.k==='clarity'?32:d.k==='risk'?32:d.k==='skill'?32:d.k==='mindset'?32:16;let pct=Math.min((s[d.k]/maxScore)*100,100);let color=s[d.k]/maxScore<=0.25?'#00B894':(s[d.k]/maxScore<=0.5?'#FDCB6E':'#e17055');html+=`<div class="dim-row"><div class="dim-info"><span class="dim-name">${d.n}</span></div><div class="dim-bar-bg"><div class="dim-bar-fill" style="width:${pct}%;background:${color};"></div></div><div class="dim-val" style="color:${color}">${Math.round(pct)}%</div></div>`;});box.innerHTML=html;}
function showReport(){const total=parseInt(document.getElementById('res-score').innerText);const lvl=levels.find(l=>total<=l.max)||levels[levels.length-1];let html=`<div class="report_section"><div class="r-h1">一、转行适配度评估</div><div class="r-box" style="border-left:5px solid ${lvl.c};"><div style="font-size:20px;font-weight:900;color:${lvl.c};margin-bottom:8px;">适配度等级：${lvl.l}</div><p style="margin:0;font-size:14px;line-height:1.6;color:#555;">${lvl.d}</p><p style="margin:10px 0 0;font-size:14px;"><strong>核心建议：</strong>${lvl.advice}</p></div></div><div class="report_section"><div class="r-h2">二、五维度适配分析</div>${Object.entries(scores).map(([k,v])=>{let maxScore=k==='clarity'?32:k==='risk'?32:k==='skill'?32:k==='mindset'?32:16;let level=v/maxScore<=0.25?'优秀':(v/maxScore<=0.5?'一般':'需提升');let color=v/maxScore<=0.25?'#00B894':(v/maxScore<=0.5?'#FDCB6E':'#e17055');return`<div style="margin-bottom:15px;padding:12px;background:#fafafa;border-radius:8px;"><div style="font-weight:700;margin-bottom:5px;">${['目标清晰度','风险承受力','技能迁移力','心态准备度','时机成熟度'][['clarity','risk','skill','mindset','timing'].indexOf(k)]}</div><div style="height:6px;background:#eee;border-radius:3px;"><div style="height:100%;width:${(v/maxScore)*100}%;background:${color};border-radius:3px;"></div></div><div style="font-size:12px;color:#999;">准备程度：<span style="color:${color}">${level}</span></div></div>`}).join('')}</div><div class="report_section"><div class="r-h2">三、行动建议</div><div class="r-box"><ul style="margin:0;padding-left:20px;line-height:2;">${lvl.points.map(p=>`<li>${p}</li>`).join('')}</ul></div></div><div style="text-align:center;color:#ccc;font-size:12px;margin-top:40px;">2026转行适配度风险测试·专业心理测评</div>`;document.getElementById('report-content').innerHTML=html;document.getElementById('report-modal').style.display='block';}
function closeReport(){document.getElementById('report-modal').style.display='none';}
async function exportPDF(){const{jsPDF}=window.jspdf;const doc=new jsPDF();doc.setFillColor(116,185,255);doc.rect(0,0,210,40,'F');doc.setTextColor(255,255,255);doc.setFontSize(22);doc.text('转行适配度风险测试报告',105,25,{align:'center'});doc.setTextColor(100,100,100);doc.setFontSize(10);doc.text('专业心理测评·2026全新版',105,35,{align:'center'});let y=55;const lvl=levels.find(l=>parseInt(document.getElementById('res-score').innerText)<=l.max)||levels[levels.length-1];doc.setTextColor(0,0,0);doc.setFontSize(16);doc.text(`适配度等级：${lvl.l}`,15,y);y+=10;doc.setFontSize(12);doc.text(lvl.d.substring(0,150)+'...',15,y);doc.save('转行适配度报告.pdf');}
document.getElementById('start-btn').addEventListener('click', function() {
        
 goToDemo(); });document.getElementById('next-btn').addEventListener('click',initTest);document.getElementById('show-report-btn').addEventListener('click',showReport);document.getElementById('close-report-btn').addEventListener('click',closeReport);document.getElementById('export-pdf-btn').addEventListener('click',exportPDF);
</script>
