<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="黑暗三角人格测试 - 测评报告">
    <meta name="keywords" content="黑暗三角,人格测试,D因子,心理测评报告">
    <title>黑暗三角人格测试报告</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/report.css">
</head>
<body>
    <div class="report-container" id="app">
        <!-- 加载提示 -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <div class="loading-text">正在生成报告...</div>
        </div>

        <!-- 1. D因子总分展示区 -->
        <div class="d-factor-display" id="dFactorDisplay">
            <!-- Content will be dynamically generated by report.js -->
        </div>

        <!-- 2. 魔丸灵珠判定提示 -->
        <div class="mo-ling-alert" id="moLingAlert">
            <!-- Content will be dynamically generated -->
        </div>

        <!-- 3. D因子科学解读 -->
        <div class="section-card" id="dFactorScienceSection">
            <h2 class="section-title">D因子 (Dark Factor) - 科学解读</h2>
            <p class="section-subtitle">基于Moshagen et al. (2018) 的D因子理论</p>
            <div class="d-factor-science-content" id="dFactorScienceContent">
                <!-- Content will be dynamically generated -->
            </div>
        </div>

        <!-- 4. 具体黑暗特质的得分 - 雷达图 -->
        <div class="section-card" id="radarChartSection">
            <h2 class="section-title">具体黑暗特质的得分</h2>
            <p class="section-subtitle">D可以体现在一些迥然不同的黑暗特质中。D得分很高的人通常在这些黑暗特质上的得分也很高。</p>
            <div class="radar-chart-container" id="radarChartContainer">
                <canvas id="radarChart"></canvas>
            </div>
        </div>

        <!-- 5. 主导特质分析（Top 3） -->
        <div class="section-card" id="dominantTraitsSection">
            <h2 class="section-title">🏆 您的主导特质 (Top 3)</h2>
            <div class="dominant-traits-content" id="dominantTraitsContent">
                <!-- Content will be dynamically generated -->
            </div>
        </div>

        <!-- 6. 十维度得分详情 -->
        <div class="section-card" id="dimensionsSection">
            <h2 class="section-title">维度详细解读（10个维度）</h2>
            <p class="section-subtitle">每个维度都反映了您人格的一个方面，了解它们能帮助您全面认识自己</p>
            <div class="dimensions-grid" id="dimensionsGrid">
                <!-- Dimension cards will be dynamically generated -->
            </div>
        </div>

        <!-- 7. 人际关系与职场影响 -->
        <div class="section-card" id="interpersonalSection">
            <h2 class="section-title">👥 人际关系与职场影响</h2>
            <div class="interpersonal-content" id="interpersonalContent">
                <!-- Content will be dynamically generated -->
            </div>
        </div>

        <!-- 8. 个性化建议与成长方向 -->
        <div class="section-card" id="developmentAdvice">
            <h2 class="section-title">🚀 个性化建议与成长方向</h2>
            <div class="advice-content" id="adviceContent">
                <!-- Advice content will be dynamically generated -->
            </div>
        </div>

        <!-- 9. 常见问题 FAQ -->
        <div class="section-card" id="faqSection">
            <h2 class="section-title">💡 常见问题 FAQ</h2>
            <p class="section-subtitle">关于黑暗三角人格测试的常见疑问解答</p>
            <div class="faq-content" id="faqContent">
                <!-- FAQ content will be dynamically generated -->
            </div>
        </div>

        <!-- 10. 重要提示 -->
        <div class="important-alert" id="importantAlert">
            <!-- Content will be dynamically generated -->
        </div>

        <!-- 底部说明 -->
        <div class="report-footer-info" id="reportFooterInfo">
            <!-- Content will be dynamically generated -->
        </div>

        <!-- 管理员注册引导 -->
        <div class="admin-guide" id="adminGuide">
            <!-- Content will be dynamically generated -->
        </div>

        <!-- 底部操作区 -->
        <div class="report-footer">
            <button class="footer-button primary" id="restartButton">重新测试</button>
        </div>
    </div>
    
    <!-- 引入验证SDK（必需） -->
    <script src="/static/js/link-validator.js"></script>
    <script>
        // 初始化验证SDK
        let validatorInstance = null;
        
        if (typeof PsyTestValidator !== 'undefined') {
            PsyTestValidator.init(null, {
                onSuccess: function(result, validator) {
                    console.log('SDK初始化成功，链接有效:', result);
                    validatorInstance = validator;
                    window.linkValidator = validator;
                },
                onError: function(error) {
                    console.error('SDK初始化失败，链接无效:', error);
                    if (window.PsyTestValidator && typeof window.PsyTestValidator.getInstance === 'function') {
                        validatorInstance = window.PsyTestValidator.getInstance();
                    }
                    if (validatorInstance) {
                        window.linkValidator = validatorInstance;
                    }
                },
                onLoad: function(data) {
                    console.log('SDK加载完成回调:', data);
                    if (!validatorInstance) {
                        if (window.PsyTestValidator && typeof window.PsyTestValidator.getInstance === 'function') {
                            validatorInstance = window.PsyTestValidator.getInstance();
                        }
                        if (validatorInstance) {
                            window.linkValidator = validatorInstance;
                        }
                    }
                }
            });
        }
    </script>
    
    <script type="module" src="js/report.js"></script>
</body>
</html>
