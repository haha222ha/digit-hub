function renderQuestion(){const q=currQList[currIdx];document.getElementById('progress-text').innerText=`${currIdx+1}/${currQList.length}`;document.getElementById('progress-fill').style.width=`${(currIdx/currQList.length)*100}%`;document.getElementById('dim-tag').innerText=`维度：${q.t}`;document.getElementById('q-category').innerText=q.t;const wrapper=document.getElementById('question-wrapper');wrapper.classList.remove('slide-up');void wrapper.offsetWidth;wrapper.classList.add('slide-up');document.getElementById('question-text').innerText=q.q;const box=document.getElementById('options-box');box.innerHTML='';q.o.forEach(opt=>{const btn=document.createElement('div');btn.className='option-btn';btn.innerText=opt.t;btn.onclick=()=>{Array.from(box.children).forEach(c=>c.classList.remove('selected'));btn.classList.add('selected');setTimeout(()=>handleAnswer(q.d,opt.s),200);};box.appendChild(btn);});}

function finishTest(){document.getElementById('page-test').style.display='none';setTimeout(()=>{document.getElementById('page-result').style.display='block';calculateResult();},2000);}
function calculateResult(){let total=Object.values(scores).reduce((a,b)=>a+b,0);let maxTotal=60;let typeIdx=0;let maxScore=0;const dims=[{k:'leadership',n:'领导力'},{k:'communication',n:'沟通力'},{k:'execution',n:'执行力'},{k:'creativity',n:'创新力'},{k:'stability',n:'稳定性'}];dims.forEach((d,i)=>{if(scores[d.k]>maxScore){maxScore=scores[d.k];typeIdx=i;}});let lvl=types[typeIdx];let finalScore=Math.round(total/maxTotal*100);let start=0;const timer=setInterval(()=>{start++;document.getElementById('res-score').innerText=start;if(start>=finalScore)clearInterval(timer);},15);document.getElementById('res-level').innerText=lvl.icon+' '+lvl.name;document.getElementById('res-level').style.background=lvl.color;document.getElementById('res-desc').innerText=lvl.desc;renderBars(scores);}
function renderBars(s){const box=document.getElementById('bars-container');const dims=[{k:'leadership',n:'领导力'},{k:'communication',n:'沟通力'},{k:'execution',n:'执行力'},{k:'creativity',n:'创新力'},{k:'stability',n:'稳定性'}];let html='';dims.forEach(d=>{let maxScore=d.k==='leadership'?12:d.k==='communication'?12:d.k==='execution'?12:d.k==='creativity'?12:12;let pct=Math.min((s[d.k]/maxScore)*100,100);let color='#00B894';if(pct>=75)color='#00B894';else if(pct>=50)color='#fdcb6e';else color='#fd79a8';html+=`<div class="dim-row"><div class="dim-info"><span class="dim-name">${d.n}</span></div><div class="dim-bar-bg"><div class="dim-bar-fill" style="width:${pct}%;background:${color};"></div></div><div class="dim-val" style="color:${color}">${Math.round(pct)}%</div></div>`;});box.innerHTML=html;}
function showReport(){const dims=[{k:'leadership',n:'领导力'},{k:'communication',n:'沟通力'},{k:'execution',n:'执行力'},{k:'creativity',n:'创新力'},{k:'stability',n:'稳定性'}];let maxScore=0,typeIdx=0;dims.forEach((d,i)=>{if(scores[d.k]>maxScore){maxScore=scores[d.k];typeIdx=i;}});let lvl=types[typeIdx];let html=`<div class="report_section"><div class="r-h1">一、职场人设类型</div><div class="r-box" style="border-left:5px solid ${lvl.color};"><div style="font-size:24px;font-weight:900;color:${lvl.color};margin-bottom:8px;">${lvl.icon} ${lvl.name}</div><p style="margin:0;font-size:14px;line-height:1.6;color:#555;">${lvl.desc}</p></div></div><div class="report_section"><div class="r-h2">二、人设优势</div><div class="r-box"><ul style="margin:0;padding-left:20px;line-height:2;">${lvl.strengths.map(s=>`<li>${s}</li>`).join('')}</ul></div></div><div class="report_section"><div class="r-h2">三、适合职业方向</div><div class="r-box"><ul style="margin:0;padding-left:20px;line-height:2;">${lvl.career.map(c=>`<li>${c}</li>`).join('')}</ul></div></div><div class="report_section"><div class="r-h2">四、发展建议</div><div class="r-box"><p>${lvl.advice}</p></div></div><div class="report_section"><div class="r-h2">五、五维能力分析</div>${dims.map((d,i)=>{let maxScore=12;let level=scores[d.k]/maxScore>=0.75?'很强':(scores[d.k]/maxScore>=0.5?'较强':'一般');let color=scores[d.k]/maxScore>=0.75?'#00B894':(scores[d.k]/maxScore>=0.5?'#fdcb6e':'#fd79a8');return`<div style="margin-bottom:15px;padding:12px;background:#fafafa;border-radius:8px;"><div style="font-weight:700;margin-bottom:5px;">${d.n}</div><div style="height:6px;background:#eee;border-radius:3px;"><div style="height:100%;width:${(scores[d.k]/maxScore)*100}%;background:${color};border-radius:3px;"></div></div><div style="font-size:12px;color:#999;">能力水平：<span style="color:${color}">${level}</span></div></div>`}).join('')}</div><div style="text-align:center;color:#ccc;font-size:12px;margin-top:40px;">2026职场人设类型测试·专业心理测评</div>`;document.getElementById('report-content').innerHTML=html;document.getElementById('report-modal').style.display='block';}
function closeReport(){document.getElementById('report-modal').style.display='none';}
async function exportPDF(){const{jsPDF}=window.jspdf;const doc=new jsPDF();doc.setFillColor(253,121,168);doc.rect(0,0,210,40,'F');doc.setTextColor(255,255,255);doc.setFontSize(22);doc.text('职场人设类型深度分析报告',105,25,{align:'center'});doc.setTextColor(100,100,100);doc.setFontSize(10);doc.text('专业心理测评·2026全新版',105,35,{align:'center'});let y=55;const dims=[{k:'leadership',n:'领导力'},{k:'communication',n:'沟通力'},{k:'execution',n:'执行力'},{k:'creativity',n:'创新力'},{k:'stability',n:'稳定性'}];let maxScore=0,typeIdx=0;dims.forEach((d,i)=>{if(scores[d.k]>maxScore){maxScore=scores[d.k];typeIdx=i;}});let lvl=types[typeIdx];doc.setTextColor(0,0,0);doc.setFontSize(16);doc.text(`人设类型：${lvl.name}`,15,y);y+=10;doc.setFontSize(12);doc.text(lvl.desc.substring(0,150)+'...',15,y);doc.save('职场人设类型报告.pdf');}

 goToDemo(); });document.getElementById('next-btn').addEventListener('click',initTest);document.getElementById('show-report-btn').addEventListener('click',showReport);document.getElementById('close-report-btn').addEventListener('click',closeReport);document.getElementById('export-pdf-btn').addEventListener('click',exportPDF);
