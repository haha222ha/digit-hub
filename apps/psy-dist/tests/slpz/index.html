<style>
  :root{--night:#1e1b4b;--yan:#8b5cf6;--chang:#0ea5e9;--gong:#f59e0b;--liu:#10b981;}

  .screen{position:absolute;inset:0;display:none;flex-direction:column;}

  /* 落地页 */
  #landing{align-items:center;justify-content:center;text-align:center;padding:34px;}
  .cross{font-size:74px;animation:sway 4s ease-in-out infinite;}
  @keyframes sway{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(6deg);}}
  .l1{color:#fff;font-size:24px;font-weight:800;margin-top:22px;line-height:1.5;}
  .l1 .hl{background:linear-gradient(90deg,#8b5cf6,#0ea5e9,#f59e0b,#10b981);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .l2{color:#a5b0e8;font-size:13.5px;margin-top:12px;line-height:1.9;}
  .pill{margin-top:20px;color:#8f9ad6;font-size:12px;background:rgba(255,255,255,.07);padding:6px 18px;border-radius:99px;}
  .pill b{color:#fff;}
  .btn-go{margin-top:30px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;font-size:17px;font-weight:800;padding:15px 46px;border:none;border-radius:99px;box-shadow:0 8px 26px rgba(139,92,246,.5);cursor:pointer;transition:transform .15s;}
  .btn-go:active{transform:scale(.95);}
  .foot{position:absolute;bottom:16px;font-size:10.5px;color:#565f8f;width:100%;text-align:center;}

  /* 答题 */
  .qtop{padding:14px 18px 6px;display:flex;align-items:center;gap:12px;}
  .back{color:#8f9ad6;font-size:20px;cursor:pointer;padding:4px 8px;}

  .pbar{flex:1;height:5px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;}
  .pfill{height:100%;width:0;background:linear-gradient(90deg,#8b5cf6,#0ea5e9);transition:width .4s;}
  .pnum{color:#a5b0e8;font-size:12px;font-weight:700;min-width:44px;text-align:right;}
  .dim{padding:14px 24px 0;color:#7d88c9;font-size:11px;letter-spacing:2px;}
  .qbody{flex:1;display:flex;flex-direction:column;justify-content:center;padding:6px 22px 24px;overflow-y:auto;}
  .qtext{color:#fff;font-size:18px;font-weight:700;line-height:1.6;margin-bottom:20px;}
  .opt{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);color:#e2e7ff;border-radius:14px;padding:13px 16px;font-size:14px;margin-bottom:10px;cursor:pointer;transition:all .16s;}
  .opt:active{transform:scale(.97);}
  .opt.sel{border-color:#8b5cf6;background:rgba(139,92,246,.2);color:#ddd6fe;}
  .sign{position:absolute;right:26px;top:86px;font-size:30px;opacity:0;transition:all .5s;pointer-events:none;}
  .sign.show{opacity:1;transform:translateX(-14px) rotate(-8deg);}

  /* 指南针计算页 */
  #compass{align-items:center;justify-content:center;text-align:center;}
  .comp-wrap{position:relative;width:200px;height:200px;}

  .needle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:transform 1.6s cubic-bezier(.3,1.4,.4,1);}
  .needle .n-red{width:4px;height:84px;background:linear-gradient(180deg,#f43f5e 50%,rgba(255,255,255,.25) 50%);border-radius:4px;}
  .comp-cap{color:#a5b0e8;font-size:14px;margin-top:30px;letter-spacing:2px;}
  .comp-cap b{color:#fff;}

  /* 付费墙 */

  .btn-free{margin-top:12px;background:none;border:none;color:#9ca3af;font-size:12px;text-decoration:underline;cursor:pointer;}

  .r-main{margin-top:14px;font-size:24px;font-weight:800;color:#fff;}

  .bars{padding:10px 26px 4px;}
  .brow{display:flex;align-items:center;gap:10px;margin:13px 0;}
  .brow .nm{width:44px;font-size:13px;color:#c7cdec;font-weight:600;}
  .brow .track{flex:1;height:15px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;}
  .brow .fill{height:100%;width:0;border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1);}
  .brow b{width:42px;font-size:15px;color:#fff;text-align:right;}
  .card{margin:16px 18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:19px;}
  .card h4{font-size:14.5px;color:#fff;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .card p{font-size:13px;color:#c3c9ea;line-height:1.9;}

  .acts{padding:4px 18px 10px;display:grid;gap:10px;}
  .btn-share{background:linear-gradient(135deg,#8b5cf6,#6d28d9);border:none;border-radius:99px;padding:14px;color:#fff;font-size:15px;font-weight:800;cursor:pointer;}
  .btn-again{background:rgba(255,255,255,.08);border:none;border-radius:99px;padding:12px;color:#a5b0e8;font-size:13px;cursor:pointer;}
  .r-foot{padding:4px 30px 26px;text-align:center;font-size:10.5px;color:#565f8f;}

  /* 海报 */

  .poster-card{width:86%;max-width:340px;background:linear-gradient(165deg,#262158,#16132e);border:2px solid #8b5cf6;border-radius:22px;padding:28px 22px;text-align:center;color:#fff;}

  .poster-close{margin-top:22px;background:none;border:1px solid rgba(167,139,250,.45);color:#a78bfa;border-radius:99px;padding:9px 30px;font-size:13px;cursor:pointer;}

  .particle{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:99;animation:burst 1s ease-out forwards;}
  @keyframes burst{from{opacity:1;transform:translate(0,0) scale(1);}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2);}}

  body.page-disabled{pointer-events:none;opacity:.65;}

function burst(){const r=$('bars').getBoundingClientRect();
