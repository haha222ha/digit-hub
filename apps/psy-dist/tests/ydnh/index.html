        #page-result { display: none; background: #f5f0ff; padding-bottom: 120px; overflow-y: auto; min-height: 100vh; }
        .result-header { background: #fff; padding: 40px 24px 30px; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; text-align: center; margin-bottom: 20px; }
        .score-circle { width: 140px; height: 140px; border-radius: 50%; border: 8px solid #ede7f6; margin: 0 auto 20px; display: flex; flex-direction: column; justify-content: center; }

        .compare-title { font-size: 16px; font-weight: 700; margin-bottom: 15px; color: var(--primary); }
        .compare-score { display: flex; justify-content: space-around; align-items: center; }
        .compare-item { text-align: center; }
        .compare-label { font-size: 12px; color: #95a5a6; }
        .compare-num { font-size: 24px; font-weight: 700; }
        .compare-arrow { font-size: 20px; color: #95a5a6; }
        .card { background: #fff; margin: 0 20px 20px; border-radius: 16px; padding: 24px; }
        .card-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; padding-left: 12px; border-left: 4px solid var(--primary); }
        .bottom-dock { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.95); padding: 16px 24px; border-top: 1px solid #eee; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

<div class="container">
    <div id="page-intro" data-screenshot="psych-test-月度精神内耗复测" class="fade-in">
        <div class="cover-tag">月度复测版</div>

        <div class="month-indicator">

        </div>
        <div class="intro-features">
            <div class="feature-box"><div class="feature-icon">📊</div><div class="feature-title">职业健康心理学</div><div class="feature-desc">基于职业健康心理学理论。</div></div>
            <div class="feature-box"><div class="feature-icon">📈</div><divdiv class="feature-title">对比上月数据</div><div class="feature-desc">可以看到内耗变化趋势。</div></div>
            <div class="feature-box"><div class="feature-icon">🎯</div><divdiv class="feature-title">针对性建议</div><div class="feature-desc">根据本月情况调整方案。</div></div>
            <div class="feature-box"><div class="feature-icon">📅</div><divdiv class="feature-title">月度体检</div><div class="feature-desc">把测试变成职场定期体检。</div></div>

        <div id="question-wrapper" class="slide-up question-card">
            <div class="question-tag" id="q-category">🧠 认知内耗</div>

        </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const questions = [
    {d:'cognitive',t:'认知内耗',q:"这个月你经常胡思乱想吗？",o:[{t:"几乎不会，思绪平静",s:10},{t:"偶尔会想一些",s:7},{t:"经常想很多",s:3},{t:"每天都思绪纷乱",s:0}]},
    {d:'cognitive',t:'认知内耗',q:"你会反复纠结过去的事情吗？",o:[{t:"完全不会，活在当下",s:10},{t:"偶尔会",s:7},{t:"经常纠结过去",s:3},{t:"每天都后悔过去",s:0}]},
    {d:'cognitive',t:'认知内耗',q:"你会在脑子里预演未来吗？",o:[{t:"不会，想那么多干嘛",s:10},{t:"偶尔会想一下",s:7},{t:"经常预演各种可能",s:3},{t:"每天都在担心未来",s:0}]},
    {d:'emotion',t:'情绪内耗',q:"这个月你容易焦虑吗？",o:[{t:"完全不焦虑",s:10},{t:"偶尔会",s:7},{t:"经常焦虑",s:3},{t:"每天都焦虑",s:0}]},
    {d:'emotion',t:'情绪内耗',q:"你会因为小事纠结很久吗？",o:[{t:"不会，很快做决定",s:10},{t:"偶尔会",s:7},{t:"经常纠结",s:3},{t:"每天都在纠结",s:0}]},
    {d:'emotion',t:'情绪内耗',q:"你会在意别人的评价吗？",o:[{t:"完全不在意",s:10},{t:"偶尔会在意",s:7},{t:"经常在意",s:3},{t:"非常在意，每天都在想",s:0}]},
    {d:'social',t:'社交内耗',q:"你在社交场合会感到累吗？",o:[{t:"完全不累，很享受",s:10},{t:"偶尔会累",s:7},{t:"经常感到社交疲惫",s:3},{t:"非常排斥社交",s:0}]},
    {d:'social',t:'社交内耗',q:"你会因为回复消息感到压力吗？",o:[{t:"完全不会，有消息就回",s:10},{t:"偶尔会",s:7},{t:"经常有压力",s:3},{t:"看到消息就焦虑",s:0}]},
    {d:'social',t:'社交内耗',q:"你害怕独处吗？",o:[{t:"完全不怕，很享受",s:10},{t:"偶尔会",s:7},{t:"经常害怕独处",s:3},{t:"非常害怕一个人",s:0}]},
    {d:'work',t:'工作内耗',q:"你会担心工作做不好吗？",o:[{t:"完全不担心，尽力就好",s:10},{t:"偶尔会担心",s:7},{t:"经常担心",s:3},{t:"每天都很担心",s:0}]},
    {d:'work',t:'工作内耗',q:"你会把工作情绪带回家吗？",o:[{t:"完全不会，分得很清",s:10},{t:"偶尔会",s:7},{t:"经常会把情绪带回家",s:3},{t:"每天都被工作情绪影响",s:0}]},
    {d:'work',t:'工作内耗',q:"你会担心被裁员或淘汰吗？",o:[{t:"完全不担心",s:10},{t:"偶尔会想",s:7},{t:"经常担心",s:3},{t:"每天都在担心",s:0}]},
    {d:'self',t:'自我内耗',q:"你会经常自我怀疑吗？",o:[{t:"完全不会，很自信",s:10},{t:"偶尔会",s:7},{t:"经常自我怀疑",s:3},{t:"每天都觉得自己不行",s:0}]},
    {d:'self',t:'自我内耗',q:"你会和别人比较然后自卑吗？",o:[{t:"完全不会，各有各的好",s:10},{t:"偶尔会",s:7},{t:"经常比较",s:3},{t:"每天都在比较中度过",s:0}]},
    {d:'self',t:'自我内耗',q:"你对自己满意吗？",o:[{t:"非常满意，接纳自己",s:10},{t:"比较满意",s:7},{t:"不太满意",s:3},{t:"完全不满意自己",s:0}]}
];
const levels = [
    {max:30,l:"内耗很低",c:"#2ED573",d:"这个月你的精神内耗很低！状态非常好。",advice:"继续保持，你找到了很好的内心平衡方式。",change:"下降"},
    {max:60,l:"内耗较低",c:"#00CEC9",d:"这个月内耗有所下降，比上个月好。",advice:"继续坚持目前的生活方式，内耗正在逐渐减轻。",change:"下降"},
    {max:90,l:"内耗中等",c:"#FDCB6E",d:"这个月内耗和上月差不多，维持在中等水平。",advice:"需要更加关注自己的内心世界，尝试一些放松方法。",change:"持平"},
    {max:150,l:"内耗较高",c:"#FF7675",d:"这个月内耗有所上升，比上个月严重了。",advice:"需要立即调整状态，减少内耗来源。",change:"上升"}
];
let currQList=[],currIdx=0,scores={cognitive:0,emotion:0,social:0,work:0,self:0};
const lastMonthScore=75;
function startTest(){currQList=[...questions];currIdx=0;scores={cognitive:0,emotion:0,social:0,work:0,self:0};document.getElementById('page-intro').style.display='none';document.getElementById('page-test').style.display='flex';renderQuestion();}
function renderQuestion(){const q=currQList[currIdx];document.getElementById('progress-text').innerText=`${currIdx+1}/${currQList.length}`;document.getElementById('progress-fill').style.width=`${(currIdx/currQList.length)*100}%`;document.getElementById('dim-tag').innerText=`维度：${q.t}`;document.getElementById('q-category').innerText=q.t;const wrapper=document.getElementById('question-wrapper');wrapper.classList.remove('slide-up');void wrapper.offsetWidth;wrapper.classList.add('slide-up');document.getElementById('question-text').innerText=q.q;const box=document.getElementById('options-box');box.innerHTML='';q.o.forEach(opt=>{const btn=document.createElement('div');btn.className='option-btn';btn.innerText=opt.t;btn.onclick=()=>{Array.from(box.children).forEach(c=>c.classList.remove('selected'));btn.classList.add('selected');setTimeout(()=>handleAnswer(q.d,opt.s),200);};box.appendChild(btn);});}
function handleAnswer(dim,val){scores[dim]+=val;if(currIdx<currQList.length-1){currIdx++;renderQuestion();}else{finishTest();}}
function finishTest(){document.getElementById('page-test').style.display='none';setTimeout(()=>{document.getElementById('page-result').style.display='block';calculateResult();},2000);}
function calculateResult(){let total=Object.values(scores).reduce((a,b)=>a+b,0);let finalScore=Math.round(total);let lvl=levels.find(l=>finalScore<=l.max)||levels[levels.length-1];let start=0;const timer=setInterval(()=>{start++;document.getElementById('res-score').innerText=start;if(start>=finalScore)clearInterval(timer);},20);document.getElementById('res-level').innerText=lvl.l;document.getElementById('res-level').style.background=lvl.c;document.getElementById('res-desc').innerText=lvl.d;document.getElementById('compare-now').innerText=finalScore;const trend=finalScore<lastMonthScore?'↓':(finalScore>lastMonthScore?'↑':'→');document.getElementById('trend-arrow').innerText=trend;document.getElementById('trend-arrow').style.color=trend==='↓'?'#2ED573':(trend==='↑'?'#FF7675':'#95a5a6');const trendText=finalScore<lastMonthScore?'相比上月下降了'+(lastMonthScore-finalScore)+'分，内耗明显减少！':(finalScore>lastMonthScore?'相比上月上升了'+(finalScore-lastMonthScore)+'分，内耗有所增加，需要注意。':'和上月持平，内耗维持在中等水平。');document.getElementById('trend-desc').innerText=trendText;}
async function exportPDF(){const{jsPDF}=window.jspdf;const doc=new jsPDF();doc.setFillColor(165,94,234);doc.rect(0,0,210,40,'F');doc.setTextColor(255,255,255);doc.setFontSize(22);doc.text('月度精神内耗复测报告',105,25,{align:'center'});doc.setTextColor(100,100,100);doc.setFontSize(10);doc.text('专业心理测评·2026全新版',105,35,{align:'center'});let y=55;const score=parseInt(document.getElementById('res-score').innerText);const lvl=levels.find(l=>score<=l.max)||levels[levels.length-1];doc.setTextColor(0,0,0);doc.setFontSize(16);doc.text(`内耗等级：${lvl.l}`,15,y);y+=10;doc.setFontSize(12);doc.text(lvl.d.substring(0,150)+'...',15,y);doc.save('月度精神内耗复测.pdf');}
document.getElementById('start-btn').document.getElementById('start-btn').addEventListener('click',function(){var modal=document.getElementById('sys-auth-modal');if(modal){modal.style.display='flex';var inp=document.getElementById('sys-auth-code');if(inp)inp.focus();}startTest();document.getElementById('page-intro').style.display='none';document.getElementById('page-test').style.display='flex';});document.getElementById('export-pdf-btn').addEventListener('click',exportPDF);
</script>



<script>window.__PSY_TEST_CODE__ = "ydnh";</script>
