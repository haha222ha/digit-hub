<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>恋爱脑测试结果</title>
    <!-- 引入安全工具库（必须在head中尽早加载） -->
    <script src="/static/js/test-security.js"></script>
    <style>
        :root {
            --bg: #f5f6fb; /* 背景颜色保持不变 */
            --card: #ffffff; /* 卡片颜色 */
            --muted: #8c8fa3; /* 次要文字颜色 */
            --text: #2d2f3a; /* 主要文字颜色 */
            --accent: linear-gradient(135deg, #f57c63, #fe5c8f); /* 粉色渐变背景 */
            --chip: #ffe6f0; /* 粉色调的底色 */
            --score-color: #fe5c8f; /* 分数颜色为粉色 */
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .page {
            max-width: 960px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 18px;
        }

        .report-title {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
        }

        .report-sub {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .report-no {
            font-size: 14px;
            color: var(--muted);
        }

        .hero-card {
            background: var(--card);
            border-radius: 28px;
            padding: 32px;
            display: flex;
            justify-content: space-between;
            gap: 24px;
            position: relative;
            box-shadow: 0 24px 60px rgba(255, 131, 98, 0.18);
            overflow: hidden;
        }

        .hero-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: var(--accent);
            opacity: 0.1;
        }

        .hero-card > * {
            position: relative;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 999px;
            background: var(--chip);
            color: #f0673d;
            font-size: 13px;
            font-weight: 600;
            margin: 0 0 14px;
        }

        .result-type {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
        }

        .result-tagline {
            margin: 12px 0 0;
            color: var(--muted);
            line-height: 1.7;
        }

        .score-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .score-ring {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: conic-gradient(#ff7c5c 0deg, #ffd3a1 120deg, #ffe3c4 360deg);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1; /* 使score-ring保持在背面 */
        }

        .score-ring::after {
            content: "";
            position: absolute;
            inset: 10px;
            background: var(--card);
            border-radius: 50%;
            z-index: 2; /* 确保内圆位于前面 */
        }

        .score-inner {
            position: relative;
            text-align: center;
            z-index: 3; /* 确保文本部分位于最上层 */
        }

        .score-inner span {
            display: block;
            font-size: 38px;
            font-weight: 800;
            color: #ff6b3d;
        }

        .score-inner small {
            color: var(--muted);
            font-size: 14px;
        }

        .panel {
            margin-top: 24px;
            background: var(--card);
            border-radius: 20px;
            padding: 0 24px 8px;
            box-shadow: 0 12px 35px rgba(35, 38, 60, 0.1);
        }

        .panel summary {
            list-style: none;
            cursor: pointer;
            padding: 20px 0;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
        }

        .panel summary::-webkit-details-marker {
            display: none;
        }

        .panel summary span {
            color: var(--muted);
            font-size: 24px;
        }

        .panel-body {
            border-top: 1px solid #f0f2f8;
            padding: 18px 0 26px;
        }

        .foreword-list {
            margin: 0;
            padding-left: 18px;
            color: var(--muted);
            line-height: 1.8;
        }

        .analysis-text {
            margin: 0;
            color: var(--text);
            line-height: 1.9;
            font-size: 15px;
            white-space: pre-line;
        }

        .action-bar {
            margin-top: 32px;
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .action-btn {
            min-width: 120px;
            padding: 12px 32px;
            border-radius: 999px;
            border: none;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .action-btn.primary {
            background: var(--accent);
            color: #fff;
        }

        .action-btn.ghost {
            background: #eef0f8;
            color: #5c6179;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .pure-love-index {
            text-align: center; /* 确保文本居中 */
            font-size: 25px;     /* 设置字体大小 */
            font-weight: 700;    /* 设置字体加粗 */
            color: #f57c63; /* 使用粉色 */
            margin-bottom: 10px; /* 增加与分数的间距 */
            margin-right: 25px;
        }

        @media (max-width: 720px) {
            .hero-card {
                flex-direction: column;
            }

            .score-wrapper {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="report-header">
            <div>
                <p class="report-title">测评报告</p>
                <p class="report-sub">恋爱脑测试结果</p>
            </div>
            <div class="report-no">No. <span id="reportNo">—</span></div>
        </div>

        <section class="hero-card">
            <div>
                <p class="badge">测评结果</p>
                <h1 class="result-type" id="resultType">--</h1>
                <p class="result-tagline" id="resultTagline">加载中...</p>
            </div>
            
            <div class="score-wrapper">
                <div class="pure-love-index">
                    <p>纯<br>爱<br>指<br>数</p>   
                </div>
                <div class="score-ring" id="scoreRing">
                    <div class="score-inner">
                        <span id="scoreValue">0</span>
                        <small>/ 80</small>
                    </div>
                </div>
            </div>
        </section>

        <details class="panel" open>
            <summary>前言 <span>⌄</span></summary>
            <div class="panel-body">
                <ul class="foreword-list" id="forewordList"></ul>
            </div>
        </details>

        <details class="panel" open>
            <summary>结果分析与解读 <span>⌄</span></summary>
            <div class="panel-body">
                <p class="analysis-text" id="analysisText">加载中...</p>
            </div>
        </details>

        <div class="action-bar">
            <button class="action-btn ghost" id="homeBtn">重新测试</button>
            <!-- <button class="action-btn primary" id="shareBtn">分享</button> -->
        </div>
    </div>

    <!-- 启用安全功能（在本地开发环境会自动禁用，方便调试） -->
    <script>
        // 等待DOM加载完成后再启用安全功能
        (function() {
            function enableSecurity() {
                if (typeof TestSecurity !== 'undefined') {
                    TestSecurity.enable();
                } else {
                    console.error('[TestSecurity] 安全工具库未加载');
                }
            }
            
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', enableSecurity);
            } else {
                enableSecurity();
            }
        })();
    </script>
    
    <!-- 引入验证SDK（必需） -->
    <script src="/static/js/link-validator.js"></script>
    <script>
        // 检查URL中是否有token，如果没有，尝试从localStorage获取并重定向
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            let token = urlParams.get('token');
            
            // 如果URL中没有token，尝试从localStorage获取
            if (!token) {
                try {
                    // 从localStorage中查找token（遍历所有test_result_开头的key）
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        if (key && key.startsWith('test_result_')) {
                            const foundToken = key.replace('test_result_', '');
                            // 验证token格式（通常是长字符串）
                            if (foundToken && foundToken.length > 10) {
                                token = foundToken;
                                break;
                            }
                        }
                    }
                } catch (e) {
                    console.warn('从localStorage获取token失败:', e);
                }
                
                // 如果找到了token，重定向到带token的URL
                if (token) {
                    const urlParams = new URLSearchParams();
                    urlParams.set('token', token);
                    const queryString = urlParams.toString();
                    const newUrl = window.location.pathname + (queryString ? '?' + queryString : '');
                    window.location.replace(newUrl);
                    return; // 停止执行，等待重定向
                }
            }
        })();
        
        // 初始化验证SDK（报告页面也需要验证链接有效性）
        if (typeof PsyTestValidator !== 'undefined') {
            PsyTestValidator.init(null, {
                onSuccess: function(result, validator) {
                    console.log('SDK初始化成功，链接有效:', result);
                    window.linkValidator = validator;
                },
                onError: function(error) {
                    console.error('SDK初始化失败，链接无效:', error);
                    if (window.PsyTestValidator && typeof window.PsyTestValidator.getInstance === 'function') {
                        window.linkValidator = window.PsyTestValidator.getInstance();
                    }
                },
                onLoad: function(data) {
                    console.log('SDK加载完成回调:', data);
                    if (!window.linkValidator) {
                        if (window.PsyTestValidator && typeof window.PsyTestValidator.getInstance === 'function') {
                            window.linkValidator = window.PsyTestValidator.getInstance();
                        }
                    }
                }
            });
        } else {
            console.error('验证SDK未加载');
        }
    </script>
    
    <script src="result.js"></script>
</body>
</html>
