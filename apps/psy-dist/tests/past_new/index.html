<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="历史人物匹配 - 原站 Vue 完整体验">
  <title>历史人物匹配</title>
  <script src="/static/js/test-security.js"></script>
  <style>
    html, body {
      margin: 0; height: 100%; background: #fafbfc;
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    }
    #gate {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; color: #909399; font-size: 14px;
    }
    #gate .spinner {
      width: 32px; height: 32px; border: 3px solid #e4e7ed;
      border-top-color: #7a4b12; border-radius: 50%;
      animation: spin .8s linear infinite; margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script src="/static/js/link-validator.js"></script>
  <script src="/shared/past-mirror-entry.js"></script>
</head>
<body>
  <div id="gate">
    <div class="spinner"></div>
    <span>正在验证链接…</span>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var token = params.get('token') || '';
      var unlimited = params.get('unlimited') === 'true';

      function mirrorUrl() {
        var q = new URLSearchParams();
        q.set('psy_integrated', '1');
        q.set('test_code', 'past_new');
        q.set('scale', 'past');
        q.set('token', token);
        if (unlimited) q.set('unlimited', 'true');
        return '/xlx-mirror/past?' + q.toString();
      }

      function showError(msg) {
        var gate = document.getElementById('gate');
        if (!gate) return;
        gate.innerHTML =
          '<p style="color:#c45656;font-size:15px;margin:0 24px 8px;text-align:center">链接无效</p>' +
          '<p style="color:#909399;font-size:13px;margin:0 24px;text-align:center;line-height:1.6">' +
          (msg || '请检查分销链接是否过期') + '</p>';
      }

      if (!token) {
        showError('缺少访问令牌，请通过分销链接打开');
        return;
      }

      if (typeof PsyTestValidator === 'undefined') {
        showError('验证组件加载失败，请刷新重试');
        return;
      }

      PsyTestValidator.init('past_new', {
        onSuccess: function () {
          location.replace(mirrorUrl());
        },
        onError: function (err) {
          showError((err && err.message) || '链接校验失败');
        },
      });

      if (typeof TestSecurity !== 'undefined') TestSecurity.enable();
    })();
  </script>
</body>
</html>
