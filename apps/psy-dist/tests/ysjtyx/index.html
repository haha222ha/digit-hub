<script>
const questions = [
    {d:'attachment',t:'🔗 依恋模式',q:"你小时候和父母的关系是？",o:[{t:"亲密依恋，充满安全感",s:0},{t:"比较正常",s:2},{t:"有些疏离",s:5},{t:"严重缺乏安全感",s:8}]},
    {d:'attachment',t:'🔗 依恋模式',q:"在亲密关系中你是否害怕被抛弃？",o:[{t:"完全不怕",s:0},{t:"偶尔有点担心",s:2},{t:"经常担心",s:5},{t:"极度恐惧被抛弃",s:8}]},
    {d:'attachment',t:'🔗 依恋模式',q:"你容易在人际关系中建立信任吗？",o:[{t:"很容易信任他人",s:0},{t:"一般能信任",s:2},{t:"很难信任",s:5},{t:"完全无法信任",s:8}]},
    {d:'attachment',t:'🔗 依恋模式',q:"面对分离你的反应是？",o:[{t:"能平静接受",s:0},{t:"稍微难过",s:2},{t:"非常痛苦",s:5},{t:"极度恐惧分离",s:8}]},
    {d:'attachment',t:'🔗 依恋模式',q:"你是否经常担心伴侣不爱你？",o:[{t:"很少担心",s:0},{t:"偶尔",s:2},{t:"经常担心",s:5},{t:"总是焦虑不安",s:8}]},
    {d:'emotion',t:'💔 情感模式',q:"你父母会用情感来控制你吗？",o:[{t:"完全不会",s:0},{t:"偶尔",s:2},{t:"经常",s:5},{t:"非常严重",s:8}]},
    {d:'emotion',t:'💔 情感模式',q:"你是否觉得必须讨好才能被爱？",o:[{t:"完全没这种感觉",s:0},{t:"偶尔",s:2},{t:"经常",s:5},{t:"总是这样",s:8}]},
    {d:'emotion',t:'💔 情感模式',q:"你会压抑自己的情绪来满足他人吗？",o:[{t:"很少",s:0},{t:"偶尔",s:2},{t:"经常",s:5},{t:"总是",s:8}]},
    {d:'emotion',t:'💔 情感模式',q:"你的情绪表达受到过限制吗？",o:[{t:"完全没有，可以自由表达",s:0},{t:"稍微限制",s:2},{t:"经常被限制",s:5},{t:"完全不被允许表达",s:8}]},
    {d:'self',t:'🧠 自我认知',q:"你经常自我否定吗？",o:[{t:"很少",s:0},{t:"偶尔",s:2},{t:"经常",s:5},{t:"总是",s:8}]},
    {d:'self',t:'🧠 自我认知',q:"你觉得自己值得被爱吗？",o:[{t:"完全值得",s:0},{t:"大部分时候觉得",s:2},{t:"偶尔觉得",s:5},{t:"完全不值得",s:8}]},
    {d:'self',t:'🧠 自我认知',q:"面对批评你会过度自责吗？",o:[{t:"理性看待",s:0},{t:"稍微难过",s:2},{t:"经常自责",s:5},{t:"严重自我否定",s:8}]},
    {d:'self',t:'🧠 自我认知',q:"你是否对自己要求过于苛刻？",o:[{t:"不会，适度就好",s:0},{t:"偶尔苛刻",s:2},{t:"经常苛刻",s:5},{t:"永远不满意自己",s:8}]},
    {d:'boundaries',t:'🚧 边界感',q:"你很难对别人说"不"吗？",o:[{t:"能轻松拒绝",s:0},{t:"一般能",s:2},{t:"很难拒绝",s:5},{t:"完全不会拒绝",s:8}]},
    {d:'boundaries',t:'🚧 边界感',q:"你会为了维持关系而牺牲自己吗？",o:[{t:"很少",s:0},{t:"偶尔",s:2},{t:"经常",s:5},{t:"总是牺牲自己",s:8}]},
    {d:'boundaries',t:'🚧 边界感',q:"你能保护自己的私人空间吗？",o:[{t:"完全能",s:0},{t:"基本能",s:2},{t:"很难",s:5},{t:"完全不能",s:8}]},
    {d:'boundaries',t:'🚧 边界感',q:"别人侵犯你的边界时你会？",o:[{t:"立即制止",s:0},{t:"表达不满",s:2},{t:"隐忍",s:5},{t:"完全默默承受",s:8}]},
    {d:'repetition',t:'🔄 重复模式',q:"你发现自己和父母的相处模式在重复吗？",o:[{t:"完全不会",s:0},{t:"偶尔相似",s:2},{t:"经常重复",s:5},{t:"完全复制",s:8}]}
];
const levels = [
    {max:35,l:"影响较小",c:"#00B894",d:"你的原生家庭影响相对较小，拥有健康的心理模式。",advice:"继续保持这种状态，同时关注下一代的教育方式。",points:["保持心理健康","关注下一代","持续成长"]},
    {max:70,l:"轻度影响",c:"#00CEC9",d:"你受到一定的原生家庭影响，但影响程度可控。",advice:"通过自我觉察和持续成长，可以逐渐化解这些影响。",points:["加强自我觉察","建立健康关系","寻求专业支持"]},
    {max:100,l:"中度影响",c:"#FDCB6E",d:"你受到较明显的原生家庭影响，已经影响到生活各个方面。",advice:"建议寻求专业帮助，同时通过阅读和自我反思来逐步疗愈。",points:["寻求专业帮助","阅读相关书籍","进行心理疗愈"]},
    {max:144,l:"影响较深",c:"#e17055",d:"你的原生家庭影响较深，已经形成较固定的心理模式。",advice:"建议寻求专业心理咨询和治疗，这是走出创伤的重要一步。",points:["寻求专业治疗","进行深度疗愈","建立支持系统","自我关怀"]}
];
let currQList=[],currIdx=0,scores={attachment:0,emotion:0,self:0,boundaries:0,repetition:0};
function goToDemo(){document.getElementById('page-intro').style.display='none';document.getElementById('page-demo').style.display='block';}
function initTest(){currQList=[...questions];currIdx=0;scores={attachment:0,emotion:0,self:0,boundaries:0,repetition:0};document.getElementById('page-demo').style.display='none';document.getElementById('page-test').style.display='flex';renderQuestion();}
function renderQuestion(){const q=currQList[currIdx];document.getElementById('progress-text').innerText=currIdx+1+'/'+currQList.length;document.getElementById('progress-fill').style.width=(currIdx/currQList.length)*100+'%';document.getElementById('dim-tag').innerText='维度：'+q.t;document.getElementById('q-category').innerText=q.t;const wrapper=document.getElementById('question-wrapper');wrapper.classList.remove('slide-up');void wrapper.offsetWidth;wrapper.classList.add('slide-up');document.getElementById('question-text').innerText=q.q;const box=document.getElementById('options-box');box.innerHTML='';q.o.forEach(opt=>{const btn=document.createElement('div');btn.className='option-btn';btn.innerText=opt.t;btn.onclick=()=>{Array.from(box.children).forEach(c=>c.classList.remove('selected'));btn.classList.add('selected');setTimeout(()=>handleAnswer(q.d,opt.s),200);};box.appendChild(btn);});}
function handleAnswer(dim,val){scores[dim]+=val;if(currIdx<currQList.length-1){currIdx++;renderQuestion();}else{finishTest();}}
function finishTest(){document.getElementById('page-test').style.display='none';setTimeout(()=>{document.getElementById('page-result').style.display='block';calculateResult();},2000);}
function calculateResult(){let total=Object.values(scores).reduce((a,b)=>a+b,0);let finalScore=Math.round(total);let lvl=levels.find(l=>finalScore<=l.max)||levels[levels.length-1];let start=0;const timer=setInterval(()=>{start++;document.getElementById('res-score').innerText=start;if(start>=finalScore)clearInterval(timer);},15);document.getElementById('res-level').innerText=lvl.l;document.getElementById('res-level').style.background=lvl.c;document.getElementById('res-desc').innerText=lvl.d;renderBars(scores);}
function renderBars(s){const box=document.getElementById('bars-container');const dims=[{k:'attachment',n:'依恋'},{k:'emotion',n:'情感'},{k:'self',n:'自我'},{k:'boundaries',n:'边界'},{k:'repetition',n:'重复'}];let html='';dims.forEach(d=>{let maxScore=d.k==='attachment'?40:d.k==='emotion'?32:d.k==='self'?32:d.k==='boundaries'?32:8;let pct=Math.min((s[d.k]/maxScore)*100,100);let color=pct<=25?'#00B894':(pct<=50?'#FDCB6E':'#e17055');html+=`<div class="dim-row"><div class="dim-info"><span class="dim-name">${d.n}</span></div><div class="dim-bar-bg"><div class="dim-bar-fill" style="width:${pct}%;background:${color};"></div></div><div class="dim-val" style="color:${color}">${Math.round(pct)}%</div></div>`;});box.innerHTML=html;}
function showReport(){const total=parseInt(document.getElementById('res-score').innerText);const lvl=levels.find(l=>total<=l.max)||levels[levels.length-1];let html=`<div class="report_section"><div class="r-h1">一、原生家庭影响诊断</div><div class="r-box" style="border-left:5px solid ${lvl.c};"><div style="font-size:20px;font-weight:900;color:${lvl.c};margin-bottom:8px;">影响等级：${lvl.l}</div><p style="margin:0;font-size:14px;line-height:1.6;color:#555;">${lvl.d}</p><p style="margin:10px 0 0;font-size:14px;"><strong>核心建议：</strong>${lvl.advice}</p></div></div><div class="report_section"><div class="r-h2">二、五维度影响分析</div>${Object.entries(scores).map(([k,v])=>{let maxScore=k==='attachment'?40:k==='emotion'?32:k==='self'?32:k==='boundaries'?32:8;let level=v/maxScore<=0.25?'较低':(v/maxScore<=0.5?'中等':'较高');let color=v/maxScore<=0.25?'#00B894':(v/maxScore<=0.5?'#FDCB6E':'#e17055');return`<div style="margin-bottom:15px;padding:12px;background:#fafafa;border-radius:8px;"><div style="font-weight:700;margin-bottom:5px;">${['依恋模式','情感模式','自我认知','边界感','重复模式'][['attachment','emotion','self','boundaries','repetition'].indexOf(k)]}</div><div style="height:6px;background:#eee;border-radius:3px;"><div style="height:100%;width:${(v/maxScore)*100}%;background:${color};border-radius:3px;"></div></div><div style="font-size:12px;color:#999;">影响程度：<span style="color:${color}">${level}</span></div></div>`}).join('')}</div><div class="report_section"><div class="r-h2">三、疗愈建议</div><div class="r-box"><ul style="margin:0;padding-left:20px;line-height:2;">${lvl.points.map(p=>`<li>${p}</li>`).join('')}</ul></div></div><div style="text-align:center;color:#ccc;font-size:12px;margin-top:40px;">2026原生家庭影响测试·专业心理测评</div>`;document.getElementById('report-content').innerHTML=html;document.getElementById('report-modal').style.display='block';}
function closeReport(){document.getElementById('report-modal').style.display='none';}
async function exportPDF(){const{jsPDF}=window.jspdf;const doc=new jsPDF();doc.setFillColor(116,185,255);doc.rect(0,0,210,40,'F');doc.setTextColor(255,255,255);doc.setFontSize(22);doc.text('原生家庭影响深度分析报告',105,25,{align:'center'});doc.setTextColor(100,100,100);doc.setFontSize(10);doc.text('专业心理测评·2026全新版',105,35,{align:'center'});let y=55;const lvl=levels.find(l=>parseInt(document.getElementById('res-score').innerText)<=l.max)||levels[levels.length-1];doc.setTextColor(0,0,0);doc.setFontSize(16);doc.text('影响等级：'+lvl.l,15,y);y+=10;doc.setFontSize(12);doc.text(lvl.d.substring(0,150)+'...',15,y);doc.save('原生家庭影响报告.pdf');}

 goToDemo(); });document.getElementById('next-btn').addEventListener('click',initTest);document.getElementById('show-report-btn').addEventListener('click',showReport);document.getElementById('close-report-btn').addEventListener('click',closeReport);document.getElementById('export-pdf-btn').addEventListener('click',exportPDF);
