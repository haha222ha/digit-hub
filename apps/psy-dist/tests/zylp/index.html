<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>职业罗盘 — 发现最适合你的职业方向</title>
<meta name="description" content="通过25道深度问题，从8个维度精准匹配最契合你的职业方向，覆盖中国大陆60+热门职业。" />
<script src="/static/js/test-security.js"></script>
<script>
  if (typeof TestSecurity !== 'undefined') {
    TestSecurity.enable();
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FDF3E7; --paper:#FFFFFF; --orange:#E8853D; --orange-d:#C96A28;
  --sage:#8FA88A; --blue:#7BA3C4; --pink:#E8A5A5; --ink:#3D3325;
  --sand:#F5EBD9; --dim:#A08A68; --dim-l:#B8A888;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Noto Sans SC",-apple-system,"PingFang SC",sans-serif;background:#e4ddd2;color:var(--ink);line-height:1.65}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--cream);position:relative;box-shadow:0 0 40px rgba(90,70,40,.18)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.card{background:var(--paper);border-radius:18px;box-shadow:0 6px 18px -10px rgba(90,70,40,.18)}
.press{transition:transform .15s}
.press:active{transform:scale(.97)}
h1,h2,h3,.serif{font-family:"Noto Serif SC",serif}

/* ============ LANDING ============ */
.land-nav{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 22px;background:rgba(253,243,231,.92);backdrop-filter:blur(10px)}
.land-nav .logo{font-family:"Noto Serif SC",serif;font-weight:900;font-size:17px;display:flex;align-items:center;gap:8px}
.land-nav .logo i{font-style:normal;width:28px;height:28px;background:var(--orange);color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 3px 8px -3px rgba(232,133,61,.5)}
.land-nav .btn{font-size:12px;background:var(--orange);color:#fff;padding:7px 16px;border-radius:99px;font-weight:600;box-shadow:0 4px 10px -4px rgba(232,133,61,.5)}
.hero{padding:16px 22px 8px;text-align:center}
.badge{display:inline-flex;align-items:center;font-size:10.5px;color:var(--orange-d);background:#fff;padding:5px 14px;border-radius:99px;font-weight:600;box-shadow:0 3px 10px -5px rgba(90,70,40,.25);margin-bottom:14px}
.badge .dot{width:6px;height:6px;border-radius:50%;background:var(--orange);margin-right:6px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.3}}
.hero .illu{margin:0 auto 10px;max-width:340px}
.hero .illu svg{width:100%;display:block}
.hero h1{font-size:26px;font-weight:900;line-height:1.45;color:#2d2415;margin-bottom:10px}
.hero h1 em{font-style:normal;color:var(--orange);position:relative}
.hero h1 em::after{content:"";position:absolute;left:0;right:0;bottom:3px;height:8px;background:rgba(232,133,61,.18);z-index:-1;border-radius:4px}
.hero .desc{font-size:12px;color:var(--dim);line-height:1.85;margin-bottom:18px;padding:0 4px}
.cta-row{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;margin-bottom:10px}
.btn-primary{background:var(--orange);color:#fff;padding:13px 34px;border-radius:99px;font-size:15px;font-weight:700;box-shadow:0 10px 20px -8px rgba(232,133,61,.6)}
.btn-secondary{font-size:12.5px;color:var(--orange-d);border-bottom:1.5px solid var(--orange);padding-bottom:2px;font-weight:600}
.hero .hint{font-size:10px;color:var(--dim-l)}
.hero .hint b{color:var(--orange-d)}
.feats{display:flex;gap:9px;padding:18px 20px 2px}
.feat{flex:1;background:#fff;border-radius:16px;padding:13px 9px;text-align:center;box-shadow:0 5px 14px -8px rgba(90,70,40,.18)}
.feat i{font-style:normal;font-size:20px;display:block;margin-bottom:5px}
.feat b{font-size:12px;display:block;color:#2d2415;margin-bottom:3px}
.feat p{font-size:8.5px;color:var(--dim);line-height:1.55}
.strip-wrap{overflow:hidden;margin:4px 0 14px;background:#fff;border-radius:99px;box-shadow:0 5px 14px -8px rgba(90,70,40,.18);padding:9px 0}
.strip{display:inline-flex;white-space:nowrap;animation:mq 24s linear infinite}
.strip span{font-size:11px;color:#8a6f4a;margin-right:18px;display:inline-flex;align-items:center}
.strip span::before{content:"◆";color:var(--orange);font-size:8px;margin-right:6px}
@keyframes mq{to{transform:translateX(-50%)}}
.lsec{margin:14px 20px 0}
.lsec#why{scroll-margin-top:64px}
.lsec .card{padding:16px 18px}
.lsec .st{font-family:"Noto Serif SC",serif;font-weight:700;font-size:15px;color:#2d2415;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.lsec .st i{font-style:normal;width:26px;height:26px;border-radius:9px;background:var(--sand);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.lsec .sp{font-size:11.5px;color:var(--dim);line-height:1.8}
.lsec .sp b{color:var(--orange-d);font-weight:600}
.cat-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cat-grid span{font-size:10.5px;background:var(--sand);color:#8a6f4a;padding:4px 11px;border-radius:99px;font-weight:500}
.more-txt{font-size:9.5px;color:var(--dim-l);margin-top:7px}
.dim-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.dim-grid .d{display:flex;gap:9px;align-items:center;background:var(--sand);border-radius:12px;padding:8px 11px}
.dim-grid .d i{font-style:normal;font-size:17px;flex-shrink:0}
.dim-grid .d b{font-size:11px;display:block;color:#2d2415}
.dim-grid .d span{font-size:8px;color:var(--dim);display:block;line-height:1.45}
.cta-end{margin:20px 20px 28px;background:#3d3325;border-radius:20px;padding:24px 20px;text-align:center;color:#F5EBD9;position:relative;overflow:hidden}
.cta-end .deco{position:absolute;font-size:44px;opacity:.12}
.cta-end .d1{top:6px;left:12px}
.cta-end .d2{bottom:6px;right:12px}
.cta-end .t{font-family:"Noto Serif SC",serif;font-weight:900;font-size:20px;margin-bottom:6px;position:relative}
.cta-end .t em{font-style:normal;color:#E8A55D}
.cta-end .p{font-size:10.5px;color:var(--dim-l);margin-bottom:16px;position:relative}
.cta-end .b{display:inline-block;background:var(--orange);color:#fff;padding:12px 36px;border-radius:99px;font-size:14px;font-weight:700;box-shadow:0 8px 18px -6px rgba(232,133,61,.5);position:relative}
.land-foot{text-align:center;font-size:9px;color:var(--dim-l);padding:18px 20px 26px;line-height:1.8}

/* ============ QUIZ ============ */
.quiz-top{position:sticky;top:0;z-index:20;background:rgba(253,243,231,.94);backdrop-filter:blur(10px);padding:14px 22px 14px}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.quiz-meta .cat{font-size:11px;font-weight:600;background:#fff;color:#8a6f4a;padding:5px 13px;border-radius:99px;box-shadow:0 3px 8px -4px rgba(90,70,40,.2)}
.quiz-meta .num{font-family:"Noto Serif SC",serif;font-size:13px;color:var(--dim)}
.quiz-meta .num b{color:var(--orange);font-size:18px}
.path-track{position:relative;height:22px}
.path-track .line{position:absolute;top:11px;left:0;right:0;border-top:2px dashed #D8C9AE}
.path-track .fill{position:absolute;top:11px;left:0;border-top:2px solid var(--orange);transition:width .4s ease}
.path-track .walker{position:absolute;top:0;font-size:16px;transform:translateX(-50%);transition:left .4s ease;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
.quiz-body{padding:18px 20px 30px}
.q-card{background:#fff;border-radius:18px;padding:20px 18px;box-shadow:0 6px 18px -10px rgba(90,70,40,.2);margin-bottom:16px;position:relative;overflow:hidden}
.quiz-body.is-enter .q-card,.quiz-body.is-enter .opt{animation:qin .28s ease both}
@keyframes qin{from{opacity:0;transform:translateY(10px)}}
.q-card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--orange),var(--pink),var(--blue),var(--sage))}
.q-card .qno{font-family:"Noto Serif SC",serif;font-size:11px;color:var(--orange);letter-spacing:.1em;margin-bottom:6px}
.q-card .q{font-family:"Noto Serif SC",serif;font-size:17.5px;font-weight:700;line-height:1.6;color:#2d2415}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:11px;background:#fff;border-radius:14px;padding:13px 14px;text-align:left;font-size:12.5px;line-height:1.65;font-weight:500;box-shadow:0 4px 12px -8px rgba(90,70,40,.18);border:2px solid transparent;transition:border-color .15s,background .15s,box-shadow .15s;width:100%}
.opt .k{width:24px;height:24px;border-radius:50%;background:var(--sand);color:#8a6f4a;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px}
.opt.sel{border-color:var(--orange);background:#FFF9F2;box-shadow:0 6px 16px -8px rgba(232,133,61,.4)}
.opt.sel .k{background:var(--orange);color:#fff}
.opt.neutral{border-style:dashed;border-color:#D8C9AE;color:#a89880;box-shadow:none;background:transparent}
.opt.neutral.sel{border-color:var(--dim);color:var(--ink);background:var(--sand)}
.quiz-foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
.btn-back{font-size:12.5px;font-weight:600;color:var(--orange-d);background:#fff;padding:9px 20px;border-radius:99px;box-shadow:0 4px 10px -6px rgba(90,70,40,.25)}
.btn-back:disabled{opacity:.35}
.quiz-foot .tip{font-size:10px;color:var(--dim-l)}

/* ============ LOADING ============ */
.load-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}
.load-illu{width:220px;height:180px;margin-bottom:26px;position:relative}
.load-illu svg{width:100%;height:100%}
.needle{transform-origin:110px 96px;animation:seek 2.4s ease-in-out infinite}
@keyframes seek{0%{transform:rotate(0)}25%{transform:rotate(50deg)}50%{transform:rotate(-25deg)}75%{transform:rotate(120deg)}100%{transform:rotate(360deg)}}
.float-c{animation:floatc 3.5s ease-in-out infinite}
@keyframes floatc{50%{transform:translateY(-6px)}}
.load-msg{font-family:"Noto Serif SC",serif;font-weight:700;font-size:18px;color:#2d2415;min-height:30px}
.load-sub{font-size:11px;color:var(--dim);margin-top:6px}
.load-dots{display:flex;gap:7px;margin-top:20px}
.load-dots i{width:8px;height:8px;border-radius:50%;background:#E3D5BC}
.load-dots i.on{background:var(--orange);animation:bounce .8s ease infinite}
@keyframes bounce{50%{transform:translateY(-5px)}}

/* ============ RESULT ============ */
.res-head{background:#3d3325;padding:30px 22px 26px;text-align:center;position:relative;overflow:hidden}
.res-head::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 90% 65% at 50% 0%,rgba(232,165,93,.22) 0%,transparent 65%);pointer-events:none}
.res-head .mtn{position:absolute;bottom:-4px;left:0;right:0;height:44px;opacity:.16;pointer-events:none}
.res-head .tag{display:inline-block;font-size:11px;color:#fff;background:var(--sage);padding:5px 16px;border-radius:99px;font-weight:600;margin-bottom:14px;position:relative;z-index:1}
.res-head h1{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:#F5EBD9;position:relative;z-index:1;margin-bottom:20px}
.res-hero{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:15px;margin-bottom:18px}
.res-hero .icon{width:72px;height:72px;background:#FDF3E7;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:37px;flex-shrink:0;box-shadow:0 10px 22px -8px rgba(0,0,0,.45)}
.res-hero .dside{text-align:left}
.res-hero .dtitle{font-family:"Noto Serif SC",serif;font-style:italic;font-weight:900;font-size:24px;color:#F0D9A8;line-height:1.3}
.res-hero .plabel{display:inline-block;font-size:10px;color:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);padding:3px 11px;border-radius:99px;margin-top:7px;font-weight:500}
.res-hero .pct{font-size:11.5px;color:rgba(255,255,255,.75);margin-top:7px}
.res-hero .pct b{font-family:"Noto Serif SC",serif;font-size:25px;color:#E8A55D;font-weight:900;margin-left:4px}
.res-dims{position:relative;z-index:1;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.res-dims .dp{background:rgba(255,255,255,.14);backdrop-filter:blur(4px);color:#fff;font-size:11px;padding:7px 14px;border-radius:99px;border:1px solid rgba(255,255,255,.18)}
.res-dims .dp b{font-family:"Noto Serif SC",serif;color:#F0D9A8;margin-right:5px}
.res-cta{position:relative;z-index:1;display:flex;justify-content:center;gap:11px}
.res-cta .b{font-size:13.5px;font-weight:700;padding:11px 26px;border-radius:99px}
.res-cta .b.w{background:#fff;color:#3d3325}
.res-sec{padding:20px 20px 0}
.res-sec .st{font-family:"Noto Serif SC",serif;font-weight:700;font-size:16px;color:#2d2415;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.res-sec .st i{font-style:normal;width:26px;height:26px;border-radius:9px;background:var(--sand);display:flex;align-items:center;justify-content:center;font-size:13px}
.res-sec .ssub{font-size:10.5px;color:var(--dim);margin-bottom:12px;line-height:1.7}
.radar-card{background:#fff;border-radius:18px;box-shadow:0 6px 18px -10px rgba(90,70,40,.2);padding:14px 6px 6px}
.dim-bars{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.dim-bars .db{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:8px 12px;box-shadow:0 3px 10px -7px rgba(90,70,40,.18)}
.dim-bars .db .n{font-size:11px;font-weight:600;width:56px;flex-shrink:0}
.dim-bars .db .bar{flex:1;height:7px;background:var(--sand);border-radius:99px;overflow:hidden}
.dim-bars .db .bar i{display:block;height:100%;background:linear-gradient(90deg,#F0A95E,var(--orange));border-radius:99px}
.dim-bars .db .v{font-family:"Noto Serif SC",serif;font-size:12px;color:var(--orange-d);width:28px;text-align:right;font-weight:700}
.match-card{background:#fff;border-radius:18px;box-shadow:0 6px 18px -10px rgba(90,70,40,.2);margin-bottom:14px;overflow:hidden;animation:qin .35s ease;position:relative}
.match-card .priority-badge{
  position:absolute;top:12px;right:-28px;z-index:2;
  background:var(--orange);color:#fff;
  font-size:10px;font-weight:700;letter-spacing:.04em;
  padding:4px 32px;transform:rotate(45deg);
  box-shadow:0 2px 8px -2px rgba(232,133,61,.55);
  pointer-events:none;
}
.match-card .mc-top{display:flex;align-items:center;gap:13px;padding:15px 16px 12px}
.match-card .rank{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:"Noto Serif SC",serif;font-weight:900;font-size:19px;flex-shrink:0}
.match-card.rank0 .rank{background:var(--orange);color:#fff;box-shadow:0 5px 12px -4px rgba(232,133,61,.55)}
.match-card.rank0 .mc-top{padding-right:52px}
.match-card .rank{background:var(--sand);color:#8a6f4a}
.match-card .micon{font-size:26px;flex-shrink:0}
.match-card .mtitle{flex:1;min-width:0}
.match-card .mtitle .tt{font-family:"Noto Serif SC",serif;font-weight:900;font-size:17px;color:#2d2415;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.match-card .mtitle .cat{font-size:9.5px;font-weight:600;color:#fff;padding:2px 9px;border-radius:99px}
.match-card .mtitle .dir{font-size:10.5px;color:var(--dim);margin-top:3px}
.match-card .pct{text-align:center;flex-shrink:0}
.match-card .pct b{font-family:"Noto Serif SC",serif;font-weight:900;font-size:22px;color:var(--orange);line-height:1;display:block}
.match-card .pct span{font-size:8.5px;color:var(--dim-l);font-weight:600}
.match-card .mc-body{padding:0 16px 15px}
.match-card .path{display:inline-block;font-size:10px;font-weight:600;padding:3px 11px;border-radius:99px;margin-bottom:9px}
.match-card .path.skill{background:#EAF3E8;color:#5d8055}
.match-card .path.explore{background:#E9F1F8;color:#53779a}
.match-card .path.experience{background:#FDF0E2;color:#b56f22}
.match-card .path.professional{background:#FBEAEA;color:#b05757}
.match-card .desc{font-size:11.5px;color:#77685a;line-height:1.8;margin-bottom:10px}
.match-card .hint{font-size:10px;color:#8a6f4a;background:var(--sand);border-radius:10px;padding:7px 10px;margin-bottom:11px}
.match-card .hint b{color:var(--orange-d)}
.match-card .rows{display:flex;gap:8px;margin-bottom:11px}
.match-card .row{flex:1;background:var(--sand);border-radius:12px;padding:8px 10px}
.match-card .row .k{font-size:8.5px;color:var(--dim-l);font-weight:600;margin-bottom:2px}
.match-card .row .v{font-size:10.5px;font-weight:700;color:#2d2415;line-height:1.5}
.match-card .traits{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.match-card .traits span{font-size:10px;background:#FFF3E3;color:var(--orange-d);padding:3px 10px;border-radius:99px;font-weight:600}
.match-card .tags{display:flex;flex-wrap:wrap;gap:5px}
.match-card .tags span{font-size:9.5px;color:var(--blue);background:#EDF4FA;padding:3px 9px;border-radius:8px;font-weight:500}
.notice{margin:18px 20px 0;background:#FFF9EC;border:1.5px dashed #E0C896;border-radius:16px;padding:13px 15px}
.notice b{font-family:"Noto Serif SC",serif;font-size:12.5px;color:#8a6f2a;display:block;margin-bottom:5px}
.notice p{font-size:10px;color:#9a8a6a;line-height:1.8}
.res-btns{display:flex;gap:11px;padding:20px}
.res-btns .rb{flex:1;text-align:center;font-size:14px;font-weight:700;padding:13px;border-radius:99px}
.res-btns .rb.dark{background:#3d3325;color:#F5EBD9}
.res-foot{text-align:center;font-size:9px;color:var(--dim-l);padding-bottom:26px}
.toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);background:#3d3325;color:#F5EBD9;font-size:13px;font-weight:600;padding:11px 24px;border-radius:99px;opacity:0;pointer-events:none;transition:.3s;z-index:99;box-shadow:0 8px 20px -8px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:480px){body{padding:20px 0}#app{border-radius:28px;overflow:hidden}}

/* SDK 推广链接容器（单页应用） */
.welcome-footer{
  text-align:center;font-size:9px;color:var(--dim-l);padding:18px 20px 26px;line-height:1.8;
  display:block !important;visibility:visible !important;
}
.welcome-footer #link-validator-promotion-link{
  width:100%;text-align:center;padding-top:16px;margin-top:16px;border-top:1px solid #e5e7eb;
  box-sizing:border-box;display:block !important;visibility:visible !important;opacity:1 !important;
}
.report-footer{
  display:flex;flex-direction:column;align-items:center;gap:16px;
  margin-top:8px;padding:0 20px 24px;width:100%;box-sizing:border-box;
}
.report-footer #link-validator-promotion-link{
  width:100%;text-align:center;padding-top:16px;margin-top:16px;border-top:1px solid #e5e7eb;box-sizing:border-box;
}
body.page-disabled{pointer-events:none;opacity:.6;cursor:not-allowed}
</style>
</head>
<body class="page-disabled">
<div id="app"></div>

/* ---------- scoring (same algorithm as original) ---------- */
function maxScores(){
  const max = Object.fromEntries(DIMS.map(d => [d, 0]));
  QUESTIONS.forEach(q => {
    const qm = Object.fromEntries(DIMS.map(d => [d, 0]));
    q.options.forEach(o => Object.entries(o.scores).forEach(([k, v]) => { qm[k] = Math.max(qm[k] || 0, v); }));
    DIMS.forEach(d => { max[d] += qm[d]; });
  });
  return max;
}
function userScores(){
  const t = Object.fromEntries(DIMS.map(d => [d, 0]));
  QUESTIONS.forEach(q => {
    const oid = answers[q.id];
    if (!oid) return;
    const opt = q.options.find(o => o.id === oid);
    if (opt) Object.entries(opt.scores).forEach(([k, v]) => { t[k] += v; });
  });
  return t;
}
function computeMatches(scores){
  const max = maxScores();
  const norm = DIMS.map(d => (scores[d] || 0) / (max[d] || 1));
  const mean = norm.reduce((a, b) => a + b, 0) / norm.length;
  const has = norm.some(v => v > 0);
  const ds = Object.fromEntries(DIMS.map((d, i) => [d, has ? clamp(5 + (norm[i] - mean) * 20, 0, 10) : 5]));
  const list = CAREERS.map(c => {
    const req = c.requiredDimensions;
    let m = 0, p = 0;
    Object.entries(req).forEach(([d, S]) => {
      const x = ds[d] || 0;
      let sim = clamp(1 - Math.abs(x - S) / 10, 0, 1);
      if (x < S - 2.5) sim *= 0.72;
      m += sim * S; p += S;
    });
    const g = p > 0 ? m / p : 0;
    return { career: c, score: g, matchPercent: Math.round(48 + g * 47) };
  });
  list.sort((a, b) => b.score - a.score);
  return { list, dimScores: ds };
}
function topDiverse(list, n){
  const r = [], seen = new Set();
  list.forEach(it => { if (r.length < n && !seen.has(it.career.category)) { r.push(it); seen.add(it.career.category); } });
  list.forEach(it => { if (r.length < n && !r.some(x => x.career.id === it.career.id)) r.push(it); });
  return r;
}

        return `<button type="button" class="${cls}" data-id="${o.id}" onclick="choose('${o.id}')"><span class="k">${letters[i]}</span><span>${o.text}</span></button>`;

function choose(oid){
  if (locking) return;
  locking = true;
  const q = QUESTIONS[qi];
  answers[q.id] = oid;

  // 只切换选中样式，不整页重绘
  app.querySelectorAll(".opt").forEach(btn => {
    btn.classList.toggle("sel", btn.dataset.id === oid);
  });

  setTimeout(() => {
    locking = false;
    if (qi < QUESTIONS.length - 1) {
      qi++;
      renderQuiz({ animate: true, scrollTop: true });
    } else {
      finishQuiz();
    }
  }, 220);
}
function goBack(){
  if (locking) return;
  if (qi > 0) {
    qi--;
    renderQuiz({ animate: true, scrollTop: true });
  }
}

function getStorageKey(token){
  return 'test_result_' + (token || (window.linkValidator && window.linkValidator.token) || 'local');
}

function getCompletionFlagKey(){
  const token = window.linkValidator && window.linkValidator.token;
  return 'zylp_test_completed_' + (token || '');
}

function saveTestResult(testResult){
  let token = window.linkValidator && window.linkValidator.token;
  if (!token) {

  }
  try {
    localStorage.setItem(getStorageKey(token), JSON.stringify({

async function waitForValidator(){
  let waitCount = 0;
  while (!window.linkValidator && waitCount < 30) {
    await new Promise(resolve => setTimeout(resolve, 100));
    waitCount++;
    if (waitCount % 10 === 0 && window.PsyTestValidator && typeof window.PsyTestValidator.getInstance === 'function') {
      const instance = window.PsyTestValidator.getInstance();
      if (instance) {
        window.linkValidator = instance;
        break;
      }
    }
  }
  return window.linkValidator;
}

async function validateAndStartTest(){
  const validator = await waitForValidator();
  if (!validator) {
    alert('验证SDK未初始化，无法开始测试。请刷新页面重试。');
    return false;
  }

  let isValid = false;
  if (typeof validator.validateForUserAction === 'function') {
    try {
      isValid = await validator.validateForUserAction();
      if (!isValid || validator.valid === false) return false;
    } catch (error) {
      console.error('链接验证失败:', error);
      validator.valid = false;
      return false;
    }
  } else {
    if (validator.valid === false) {
      alert(validator.validationError || '测试链接无效，请检查链接是否正确');
      return false;
    }
    isValid = validator.valid !== false;
  }

  if (!isValid || validator.valid === false) return false;

  const urlParams = new URLSearchParams(window.location.search);
  const isRestart = urlParams.get('restart') === 'true';
  if (!isRestart && !window.__zylp_test_started) {
    try {
      window.__zylp_test_started = true;
      await validator.startTest();
      console.log('测试开始记录成功');
    } catch (error) {
      console.error('记录测试开始失败:', error);
      window.__zylp_test_started = false;
      return false;
    }
  } else if (isRestart) {
    console.log('重新测试模式，跳过startTest()调用，避免重复扣除次数');
    window.__zylp_test_started = false;
    window.__zylp_test_completed = false;
  }

  return true;
}

function restoreResultFromStorage(){
  const token = (window.linkValidator && window.linkValidator.token)
    || new URLSearchParams(window.location.search).get('token');
  if (!token) return false;
  try {
    const raw = localStorage.getItem(getStorageKey(token));
    if (!raw) return false;
    const saved = JSON.parse(raw);
    const result = saved.result || saved;
    if (!result || !result.dimScores || !Array.isArray(result.topMatches)) return false;

    dimScores = result.dimScores;
    answers = result.answers || {};
    const byId = Object.fromEntries(CAREERS.map(c => [c.id, c]));
    topMatches = result.topMatches
      .map(m => {
        const career = byId[m.careerId];
        if (!career) return null;
        return { career, matchPercent: m.matchPercent, score: m.score };
      })
      .filter(Boolean);
    if (!topMatches.length) return false;

    phase = 'result';
    window.__zylp_test_completed = true;
    renderResult({ skipComplete: true });
    return true;
  } catch (error) {
    console.error('恢复本地结果失败:', error);
    return false;
  }
}

  return `<svg viewBox="0 0 310 236" style="width:100%;display:block">
    ${[0.33, 0.66, 1].map(f => `<polygon points="${ring(f)}" fill="none" stroke="#E8D9BE" stroke-width="1.2" stroke-dasharray="${f === 1 ? "0" : "3 4"}"/>`).join("")}
    ${DIMS.map((_, i) => { const [x, y] = pt(i, R); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#F0E4CC" stroke-width="1.2"/>`; }).join("")}
    <polygon points="${vals}" fill="rgba(232,133,61,.22)" stroke="#E8853D" stroke-width="2.5" stroke-linejoin="round"/>
    ${DIMS.map((d, i) => { const [x, y] = pt(i, R * ((dimScores[d] || 0) / 10)); return `<circle cx="${x}" cy="${y}" r="4" fill="#E8853D" stroke="#fff" stroke-width="1.5"/>`; }).join("")}
    ${DIMS.map((d, i) => { const [x, y] = pt(i, R + 20); const v = Math.round((dimScores[d] || 0) * 10); return `<text x="${x}" y="${y}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3D3325" font-family="Noto Sans SC">${DIM_LABEL[d]}</text><text x="${x}" y="${y + 12}" text-anchor="middle" font-size="9" fill="#B8A888" font-family="Noto Serif SC">${v}</text>`; }).join("")}

  let token = urlParams.get('token');

          window.__zylp_test_started = true; // 重新测试已扣过次数，后续 start 跳过
          urlParams.delete('restart');
          const newUrl = window.location.pathname + (urlParams.toString() ? '?' + urlParams.toString() : '');
          window.history.replaceState({}, '', newUrl);
          return;
        }

        if (data.valid && data.has_local_result) {
          if (typeof window.zylpRestoreResult === 'function') {
            window.zylpRestoreResult();
          }
        }
      }
    });
  } else {
    console.error('验证SDK未加载');
    document.body.classList.remove('page-disabled');
  }
})();
</script>
</body>
</html>
