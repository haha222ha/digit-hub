<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=7" />
    <title>订单领取测评链接 · 心象测</title>
    <meta name="description" content="输入订单号领取测评链接" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/order-claim.css?v=20260814oc3" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <main class="claim-shell">
      <header class="claim-brand">
        <svg class="brand-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="40" height="40" aria-hidden="true" focusable="false">
          <circle cx="73" cy="100" r="54" fill="#0F766E" />
          <circle cx="127" cy="100" r="54" fill="#0F766E" />
          <path fill="#FFFFFF" d="M100 46.14 A54 54 0 0 0 100 153.86 A54 54 0 0 0 100 46.14 Z" />
          <path fill="#B8952E" d="M100 90.5 C104.8 96.8 104.8 105.2 100 111.5 C95.2 105.2 95.2 96.8 100 90.5 Z" />
        </svg>
        <div>
          <p class="brand-name">心象测</p>
          <p class="brand-sub">订单领取测评链接</p>
        </div>
      </header>

      <section class="claim-panel" aria-labelledby="claim-title">
        <h1 id="claim-title">输入订单号领取</h1>
        <p class="hint">请填写购买时的订单号。同一订单始终对应同一条测评链接。</p>

        <label class="field-label" for="orderId">订单号</label>
        <div class="field-row">
          <input
            id="orderId"
            name="orderId"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="粘贴或输入订单号"
            maxlength="64"
          />
          <button type="button" id="claimBtn" class="btn-primary">领取链接</button>
        </div>

        <p id="statusMsg" class="status" role="status" hidden></p>

        <div id="resultBox" class="result" hidden>
          <label class="field-label" for="resultUrl">测评链接</label>
          <div class="field-row">
            <input id="resultUrl" type="text" readonly />
            <button type="button" id="copyBtn" class="btn-secondary">复制</button>
          </div>
          <a id="openLink" class="open-link" href="#" target="_blank" rel="noopener noreferrer">打开测评</a>
        </div>
      </section>

      <p class="foot-note">如提示订单未同步，请稍候再试，或联系商家客服。</p>
    </main>
    <script src="/order-claim.js?v=20260814oc3" defer></script>
  </body>
</html>
