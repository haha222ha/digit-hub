<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>授权码管理 · 统一运营后台</title>
  <style>
    :root {
      --ink: #1c2430;
      --muted: #5c6570;
      --paper: #f3ede3;
      --line: #d9d0c3;
      --seal: #1f6b5c;
      --danger: #a33b2d;
      --ok: #2f7d4e;
      --radius: 10px;
      --font: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background: var(--paper);
      min-height: 100vh;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    .sub { color: var(--muted); margin: 0 0 20px; font-size: 0.92rem; }
    .card {
      background: rgba(255, 250, 243, 0.9);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .stat b { display: block; font-size: 1.4rem; margin-top: 4px; }
    .stat span { color: var(--muted); font-size: 0.85rem; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 4px; }
    input, select, textarea, button {
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 8px 10px;
    }
    input, select, textarea { width: 100%; background: #fff; }
    textarea { min-height: 120px; font-family: ui-monospace, monospace; font-size: 0.85rem; }
    button {
      cursor: pointer;
      background: var(--seal);
      color: #fff;
      border: none;
      padding: 9px 14px;
    }
    button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    button.danger { background: var(--danger); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .tab {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .tab.on { background: var(--seal); color: #fff; border-color: var(--seal); }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th, td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .code { font-family: ui-monospace, monospace; font-size: 0.82rem; word-break: break-all; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; }
    .tag.unused { background: #e8f5ee; color: var(--ok); }
    .tag.active { background: #dceaf5; color: #1a5f8a; }
    .tag.revoked { background: #f5e0dc; color: var(--danger); }
    .msg { padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 0.9rem; }
    .msg.err { background: #fdecea; color: var(--danger); }
    .msg.ok { background: #e8f5ee; color: var(--ok); }
    .hidden { display: none !important; }
    .login-box { max-width: 360px; margin: 80px auto; }
    .field { margin-bottom: 12px; }
    @media (max-width: 800px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <div id="loginView" class="wrap login-box">
    <div class="card">
      <h1>统一授权码后台</h1>
      <p class="sub">心象测 · 选品 insight · 云发卡（预留）共用 xhs-cloud 内核</p>
      <div id="loginMsg" class="msg err hidden"></div>
      <div class="field">
        <label>管理员账号</label>
        <input id="loginUser" autocomplete="username" placeholder="XHS_CLOUD_ADMIN_USER" />
      </div>
      <div class="field">
        <label>密码</label>
        <input id="loginPass" type="password" autocomplete="current-password" />
      </div>
      <button id="loginBtn" style="width:100%">登录</button>
    </div>
  </div>

  <div id="appView" class="wrap hidden">
    <div class="row" style="justify-content:space-between">
      <div>
        <h1>授权码管理</h1>
        <p class="sub">按产品模块发码 · 列表 · 吊销 · 导出激活链接</p>
      </div>
      <div class="row">
        <span id="adminName" class="sub" style="margin:0"></span>
        <button class="ghost" id="logoutBtn">退出</button>
      </div>
    </div>

    <div id="topMsg" class="msg hidden"></div>

    <div class="grid card" id="statsGrid">
      <div class="stat"><span>有效会员</span><b id="stMembers">—</b></div>
      <div class="stat"><span>未用授权码</span><b id="stUnused">—</b></div>
      <div class="stat"><span>已激活码</span><b id="stActive">—</b></div>
      <div class="stat"><span>授权码总数</span><b id="stTotal">—</b></div>
    </div>

    <div class="card">
      <div class="tabs" id="productTabs"></div>
      <div class="row">
        <div style="flex:1;min-width:140px">
          <label>规格 SKU</label>
          <select id="skuSelect"></select>
        </div>
        <div style="width:100px">
          <label>数量</label>
          <input id="genCount" type="number" min="1" max="100" value="10" />
        </div>
        <div style="width:100px">
          <label>可激活次数</label>
          <input id="genMax" type="number" min="1" max="10" value="1" />
        </div>
        <div style="flex:1;min-width:160px">
          <label>渠道/批次（小红书/闲鱼/订单号）</label>
          <input id="genChannel" placeholder="xianyu-batch-001" />
        </div>
        <div style="align-self:flex-end">
          <button id="genBtn">生成授权码</button>
        </div>
      </div>
      <div id="genResult" class="hidden">
        <label>生成结果（码 + 激活链接 TSV，可复制到发卡平台）</label>
        <textarea id="genText" readonly></textarea>
        <div class="row">
          <button id="copyGenBtn" class="ghost">复制全部</button>
          <span id="genMeta" class="sub" style="margin:0"></span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div style="width:140px">
          <label>状态筛选</label>
          <select id="filterStatus">
            <option value="">全部</option>
            <option value="unused">未使用</option>
            <option value="active">已激活</option>
            <option value="revoked">已吊销</option>
          </select>
        </div>
        <div style="align-self:flex-end">
          <button class="ghost" id="refreshBtn">刷新列表</button>
        </div>
      </div>
      <div style="overflow:auto">
        <table>
          <thead>
            <tr>
              <th>授权码</th>
              <th>套餐</th>
              <th>天数</th>
              <th>激活</th>
              <th>状态</th>
              <th>渠道/备注</th>
              <th>创建</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="codeRows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const TOKEN_KEY = "xhs_admin_portal_token";
    const API = "/api/v1/portal/admin";
    let products = [];
    let currentProduct = "assess";

    const $ = (id) => document.getElementById(id);
    const token = () => localStorage.getItem(TOKEN_KEY) || "";

    function showMsg(el, text, type = "err") {
      if (!text) { el.classList.add("hidden"); return; }
      el.textContent = text;
      el.className = "msg " + type;
    }

    async function api(path, opts = {}) {
      const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
      if (token()) headers.Authorization = "Bearer " + token();
      const res = await fetch(API + path, { ...opts, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || data.error || res.statusText);
      return data;
    }

    function noteMeta(note) {
      try {
        const j = JSON.parse(note || "{}");
        const m = j.meta || {};
        return [m.channel, m.remark].filter(Boolean).join(" · ");
      } catch { return note || "—"; }
    }

    function fmtTime(s) {
      if (!s) return "—";
      return String(s).replace("T", " ").slice(0, 19);
    }

    function renderTabs() {
      const box = $("productTabs");
      box.innerHTML = products.map((p) =>
        `<button type="button" class="tab ${p.product === currentProduct ? "on" : ""}" data-p="${p.product}">${p.label}</button>`
      ).join("");
      box.querySelectorAll(".tab").forEach((btn) => {
        btn.onclick = () => { currentProduct = btn.dataset.p; renderTabs(); renderSkus(); loadCodes(); };
      });
    }

    function renderSkus() {
      const prod = products.find((p) => p.product === currentProduct);
      const sel = $("skuSelect");
      sel.innerHTML = (prod?.skus || []).filter((s) => !s.reserved).map((s) =>
        `<option value="${s.sku}">${s.label} · ${s.duration_days}天 · ${s.plan_code}</option>`
      ).join("");
    }

    async function loadProducts() {
      const data = await api("/auth-products");
      products = (data.products || []).filter((p) => (p.skus || []).some((s) => !s.reserved));
      if (!products.find((p) => p.product === currentProduct)) currentProduct = products[0]?.product || "assess";
      renderTabs();
      renderSkus();
    }

    async function loadStats() {
      const data = await api("/stats");
      const s = data.stats || {};
      $("stMembers").textContent = s.active_members ?? "—";
      $("stUnused").textContent = s.auth_codes_unused ?? "—";
      $("stActive").textContent = s.auth_codes_active ?? "—";
      $("stTotal").textContent = s.auth_codes_total ?? "—";
    }

    async function loadCodes() {
      const st = $("filterStatus").value;
      const q = new URLSearchParams({ limit: "100", product: currentProduct });
      if (st) q.set("status", st);
      const data = await api("/auth-codes?" + q.toString());
      const rows = data.items || [];
      $("codeRows").innerHTML = rows.map((r) => `
        <tr>
          <td class="code">${r.code}<br><button class="ghost" style="padding:2px 6px;font-size:0.75rem" data-copy="${r.code}">复制</button></td>
          <td>${r.plan_label || r.plan_code}</td>
          <td>${r.duration_days}</td>
          <td>${r.current_activations}/${r.max_activations}</td>
          <td><span class="tag ${r.status}">${r.status}</span></td>
          <td>${noteMeta(r.note)}</td>
          <td>${fmtTime(r.created_at)}</td>
          <td>${r.status !== "revoked" ? `<button class="danger" style="padding:4px 8px;font-size:0.75rem" data-revoke="${r.code}">吊销</button>` : ""}</td>
        </tr>`).join("") || `<tr><td colspan="8">暂无数据</td></tr>`;

      $("codeRows").querySelectorAll("[data-copy]").forEach((b) => {
        b.onclick = () => navigator.clipboard.writeText(b.dataset.copy);
      });
      $("codeRows").querySelectorAll("[data-revoke]").forEach((b) => {
        b.onclick = async () => {
          if (!confirm("确认吊销 " + b.dataset.revoke + "？")) return;
          await api("/auth-codes/" + encodeURIComponent(b.dataset.revoke) + "/revoke", { method: "POST" });
          showMsg($("topMsg"), "已吊销", "ok");
          loadCodes();
          loadStats();
        };
      });
    }

    async function enterApp() {
      $("loginView").classList.add("hidden");
      $("appView").classList.remove("hidden");
      $("adminName").textContent = "已登录";
      await loadProducts();
      await loadStats();
      await loadCodes();
    }

    $("loginBtn").onclick = async () => {
      showMsg($("loginMsg"), "");
      try {
        const data = await api("/login", {
          method: "POST",
          body: JSON.stringify({ username: $("loginUser").value.trim(), password: $("loginPass").value }),
        });
        localStorage.setItem(TOKEN_KEY, data.access_token);
        await enterApp();
      } catch (e) {
        showMsg($("loginMsg"), e.message || "登录失败");
      }
    };

    $("logoutBtn").onclick = () => {
      localStorage.removeItem(TOKEN_KEY);
      location.reload();
    };

    $("genBtn").onclick = async () => {
      showMsg($("topMsg"), "");
      try {
        const data = await api("/auth-codes", {
          method: "POST",
          body: JSON.stringify({
            product: currentProduct,
            sku: $("skuSelect").value,
            count: Number($("genCount").value || 1),
            max_activations: Number($("genMax").value || 1),
            channel: $("genChannel").value.trim(),
          }),
        });
        $("genResult").classList.remove("hidden");
        $("genText").value = data.export_tsv || (data.codes || []).join("\n");
        $("genMeta").textContent = `已生成 ${(data.codes || []).length} 个 · ${data.label || ""}`;
        showMsg($("topMsg"), "生成成功", "ok");
        loadCodes();
        loadStats();
      } catch (e) {
        showMsg($("topMsg"), e.message || "生成失败");
      }
    };

    $("copyGenBtn").onclick = () => navigator.clipboard.writeText($("genText").value);
    $("refreshBtn").onclick = () => { loadCodes(); loadStats(); };
    $("filterStatus").onchange = loadCodes;

    (async function boot() {
      if (!token()) return;
      try {
        await api("/me");
        await enterApp();
      } catch {
        localStorage.removeItem(TOKEN_KEY);
      }
    })();
  </script>
</body>
</html>
