# V2 情报类目树（标题关键词 → 赛道 / 子类）
# 匹配顺序：从上到下，首个命中生效；均未命中 → fallback
# category 一律用日报规范名；aliases 兼容历史异名 / 千帆脏类
version: "taxonomy-v1.2"
fallback:
  category: 综合类目
  sub_category: 其他

aliases:
  小学教辅: 小学资料
  幼教启蒙: 小学资料
  家居收纳: 家居生活
  家纺床品: 家居生活
  家居软装: 家居生活
  美甲美睫: 美妆护肤
  彩妆: 美妆护肤
  美妆: 美妆护肤
  食品轻食: 食品生鲜
  水产肉类: 食品生鲜
  粮油调味: 食品生鲜
  零食: 食品生鲜
  文创文具: 文具教具
  文具电教: 文具教具
  洗护清洁剂: 家清日用
  教育培训: 网盘课程
  数字素材: 设计素材
  电子资源: 网盘课程
  虚拟商品: 其他虚拟
  虚拟综合: 其他虚拟
  带货笔记: 未分类
  收纳整理: 家居生活
  女装: 女装服饰
  男装: 男装服饰
  服装: 女装服饰
  书籍: 图书文教
  宠物: 宠物用品
  家居: 家居生活
  玩具: 潮玩玩具
  模玩: 潮玩玩具
  厨房: 厨房用品
  厨房电器: 厨房用品
  户外: 户外露营
  数码: 数码配件
  数码相机: 数码配件
  母婴: 童装母婴
  婴童用品: 童装母婴
  女士内衣: 内衣配饰
  女鞋: 鞋靴箱包
  流行男鞋: 鞋靴箱包
  箱包皮具: 鞋靴箱包
