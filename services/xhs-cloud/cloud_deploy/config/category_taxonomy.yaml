    category: 小学资料
    sub_category: K12
  - pattern: "幼儿园|早教|绘本|识字|拼音"
    category: 小学资料
    sub_category: K12
  - pattern: "美甲|穿戴甲|甲片|甲油"
    category: 美妆护肤
    sub_category: 美业
  - pattern: "假睫毛|美睫|眼线"
    category: 美妆护肤
    sub_category: 美业
  - pattern: "收纳|置物|整理|储物|衣架|挂钩"
