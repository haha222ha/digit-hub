# 选品云端 API 反代（独立域名或路径，不影响 vuemonitor :8000）
# 安装: sudo cp 到 /etc/nginx/sites-available/xhs-monitor.conf && ln -s sites-enabled

upstream xhs_monitor_api {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    server_name monitor.xhs365.cn;   # 改成你的域名

    client_max_body_size 64m;

    # 报告 zip 上传 + ingest（大 bundle 可能较慢）
    location /api/v1/sync/report-upload {
        proxy_pass http://xhs_monitor_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        client_body_timeout 600s;
        proxy_buffering off;
    }

    location /api/v1/member/reports/ {
        proxy_pass http://xhs_monitor_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://xhs_monitor_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# 若与 vuemonitor 同域不同路径，可在现有 server 块内追加:
