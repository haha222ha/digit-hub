var VIRTUAL_KEYWORDS=['自动发货','电子版','PDF','秒发','课件','教案','模板','word','PPT','ppt','题库','真题','答案','解析','密钥','激活','优惠券','兑换券','月卡','会员','视频课程','网课','资料包','网盘','刻录盘'];
function isVirtualByKeyword(title){ return VIRTUAL_KEYWORDS.some(function(kw){ return title.toLowerCase().includes(kw.toLowerCase()); }); }

function buildItem(r){
var v1d=parseFloat(r[IDX.v1d])||0;
var sold=parseInt(r[IDX.sold])||0;
var actualRaw=typeof IDX.actual_v1d!=='undefined'?r[IDX.actual_v1d]:null;
var actualV1d=(actualRaw===null||actualRaw===undefined||actualRaw==='')?0:parseFloat(actualRaw);
if(isNaN(actualV1d)) actualV1d=0;
var actualGrRaw=typeof IDX.actual_gr!=='undefined'?r[IDX.actual_gr]:null;
var actualGr=(actualGrRaw===null||actualGrRaw===undefined||actualGrRaw==='')?0:parseFloat(actualGrRaw);
if(isNaN(actualGr)) actualGr=0;
var estVsr=typeof IDX.vsr!=='undefined'?(parseFloat(r[IDX.vsr])||0):(sold>0?v1d/sold:0);
var actualVsrRaw=typeof IDX.actual_vsr!=='undefined'?r[IDX.actual_vsr]:null;
var actualVsr=(actualVsrRaw===null||actualVsrRaw===undefined||actualVsrRaw==='')?null:parseFloat(actualVsrRaw);
if(actualVsr===null&&actualV1d!==null&&sold>0) actualVsr=actualV1d/sold;
var estVsrPct=estVsr*100;
var actualVsrPct=actualVsr!==null?actualVsr*100:null;
var anomaly=typeof IDX.anomaly!=='undefined'?parseInt(r[IDX.anomaly],10)===1:((sold>0&&v1d>sold)||estVsrPct>100);
return {
gid:r[IDX.goods_id]||'',
title:r[IDX.title]||'',
price:r[IDX.price],
sold:sold,
actualV1d:actualV1d,
v1d:v1d,
actualGr:actualGr,
actualVsr:actualVsr,
actualVsrPct:actualVsrPct,
estVsr:estVsr,
estVsrPct:estVsrPct,
burst:parseFloat(r[IDX.burst])||0,
pool:r[IDX.pool]||'',
firstSeen:r[IDX.first_seen]||'',
storeId:r[IDX.store_id]||'',
storeName:r[IDX.store_name]||'',
shopSales:r[IDX.shop_sales]||'',
shopFans:r[IDX.shop_fans]||'',
shopFsr:(typeof IDX.shop_fsr!=='undefined'&&r[IDX.shop_fsr]!==null&&r[IDX.shop_fsr]!=='')?parseFloat(r[IDX.shop_fsr]):null,
goodsFsr:(typeof IDX.goods_fsr!=='undefined'&&r[IDX.goods_fsr]!==null&&r[IDX.goods_fsr]!=='')?parseFloat(r[IDX.goods_fsr]):null,
behavior:r[IDX.behavior]||'',
isVirtual:parseInt(r[IDX.is_virtual],10)===1,
anomaly:anomaly
};
}

var ALL_ITEMS=[];
var PHYSICAL_ITEMS=[];
var VIRTUAL_ITEMS=[];
D.items.forEach(function(r){
var v1d=parseFloat(r[IDX.v1d])||0;
var actualRaw=typeof IDX.actual_v1d!=='undefined'?r[IDX.actual_v1d]:null;
var actualV1d=(actualRaw===null||actualRaw===undefined||actualRaw==='')?0:parseFloat(actualRaw);
if(isNaN(actualV1d)) actualV1d=0;
if(v1d>0||actualV1d>0){
var obj=buildItem(r);
ALL_ITEMS.push(obj);
if(obj.isVirtual) VIRTUAL_ITEMS.push(obj);
else PHYSICAL_ITEMS.push(obj);
}
});

function initSort(arr,col,desc){
arr.sort(function(a,b){
var va=a[col],vb=b[col];
if(col==='actualV1d'||col==='actualGr'||col==='actualVsrPct'||col==='shopFsr'||col==='goodsFsr'){
va=(va===null||va===undefined||isNaN(va))?-1:va;
vb=(vb===null||vb===undefined||isNaN(vb))?-1:vb;
}
if(typeof va==='number') return desc?(vb-va):(va-vb);
if(typeof va==='string') va=va.toLowerCase();
if(typeof vb==='string') vb=vb.toLowerCase();
return desc?(vb>va?1:vb<va?-1:0):(va>vb?1:va<vb?-1:0);
});
}

initSort(PHYSICAL_ITEMS,'actualV1d',true);

function buildVsrEstChart(){

ALL_ITEMS.forEach(function(item){

dist[b]++;
});
return dist;
}

function parseNum(v){
if(v===''||v===null||v===undefined) return null;
var n=parseFloat(v);
return isNaN(n)?null:n;
}

function readAdvancedForm(tab){
var p=TAB_PREFIX[tab];
var pools=[];
document.querySelectorAll('#af-'+p+'-pools input:checked').forEach(function(cb){pools.push(cb.value);});
var adv=defaultAdv();
ADV_NUM_KEYS.forEach(function(k){
adv[k]=parseNum(document.getElementById('af-'+p+'-'+k).value);
});
ADV_TEXT_KEYS.forEach(function(k){
adv[k]=document.getElementById('af-'+p+'-'+k).value.trim().toLowerCase();
});
ADV_BOOL_KEYS.forEach(function(k){
adv[k]=document.getElementById('af-'+p+'-'+k).checked;
});
adv.pools=pools.length?pools:null;
TABS[tab].adv=adv;
}

function kwMatch(text,kwStr){
if(!kwStr) return true;
var kws=kwStr.split(/\s+/).filter(Boolean);
return kws.every(function(kw){return text.indexOf(kw)>=0;});
}

function numGte(val,min){
if(min===null) return true;
if(val===null||val===undefined||isNaN(val)) return false;
return val>=min;
}
function numLte(val,max){
if(max===null) return true;
if(val===null||val===undefined||isNaN(val)) return false;
return val<=max;
}

function matchesAdvanced(item,adv){
if(!numGte(item.price,adv.priceMin)||!numLte(item.price,adv.priceMax)) return false;
if(!numGte(item.sold,adv.soldMin)||!numLte(item.sold,adv.soldMax)) return false;
if(!numGte(item.actualV1d,adv.actualMin)||!numLte(item.actualV1d,adv.actualMax)) return false;
if(!numGte(item.actualGr,adv.actualGrMin)) return false;
if(!numGte(item.actualVsrPct,adv.actualVsrMin)) return false;
if(!numLte(item.goodsFsr,adv.goodsFsrMax)) return false;
if(!numLte(item.shopFsr,adv.shopFsrMax)) return false;
if(!numGte(item.v1d,adv.v1dMin)) return false;
if(!numGte(item.estVsrPct,adv.estVsrMin)) return false;
if(!numGte(item.burst,adv.burstMin)) return false;
if(adv.pools&&adv.pools.length&&adv.pools.indexOf(item.pool)<0) return false;
var blob=(item.title+' '+item.behavior).toLowerCase();
if(adv.includeKw&&!kwMatch(blob,adv.includeKw)) return false;
if(adv.excludeKw){
var ex=adv.excludeKw.split(/\s+/).filter(Boolean);
for(var i=0;i<ex.length;i++){if(blob.indexOf(ex[i])>=0) return false;}
}
if(adv.storeKw&&item.storeName.toLowerCase().indexOf(adv.storeKw)<0) return false;
if(adv.noAnomaly&&item.anomaly) return false;
return true;
}

function hasAdvancedActive(adv){
if(!adv) return false;
for(var i=0;i<ADV_NUM_KEYS.length;i++){if(adv[ADV_NUM_KEYS[i]]!==null) return true;}
for(var j=0;j<ADV_TEXT_KEYS.length;j++){if(adv[ADV_TEXT_KEYS[j]]) return true;}
for(var k=0;k<ADV_BOOL_KEYS.length;k++){if(adv[ADV_BOOL_KEYS[k]]) return true;}
if(adv.pools&&adv.pools.length) return true;
return false;
}

function buildFilterTags(tab){
var t=TABS[tab];
var tags=[];
if(t.activePreset&&t.activePreset!=='all'&&PRESETS[t.activePreset]) tags.push(PRESETS[t.activePreset].label);
var adv=t.adv||{};
if(adv.actualMin!==null||adv.actualMax!==null){
tags.push('真实增量'+(adv.actualMin!==null?'>='+adv.actualMin:'')+(adv.actualMax!==null?(adv.actualMin!==null?' ':'')+'<='+adv.actualMax:''));
}
if(adv.actualGrMin!==null) tags.push('真实日增速≥'+adv.actualGrMin+'%');
if(adv.actualVsrMin!==null) tags.push('真实增销比≥'+adv.actualVsrMin+'%');
if(adv.goodsFsrMax!==null) tags.push('商品粉销比≤'+adv.goodsFsrMax);
if(adv.shopFsrMax!==null) tags.push('店铺粉销比≤'+adv.shopFsrMax);
if(adv.burstMin!==null) tags.push('爆发分≥'+adv.burstMin);
if(adv.v1dMin!==null) tags.push('预估日增量≥'+adv.v1dMin);
if(adv.estVsrMin!==null) tags.push('预估增销比≥'+adv.estVsrMin+'%');
if(adv.priceMin!==null||adv.priceMax!==null){
tags.push('价格'+(adv.priceMin!==null?adv.priceMin:'0')+'-'+(adv.priceMax!==null?adv.priceMax:'∞'));
}
if(adv.soldMin!==null||adv.soldMax!==null) tags.push('销量区间');
if(adv.pools&&adv.pools.length) tags.push('分层:'+adv.pools.join('/'));
if(adv.includeKw) tags.push('含:'+adv.includeKw);
if(adv.excludeKw) tags.push('排除:'+adv.excludeKw);
if(adv.storeKw) tags.push('店铺:'+adv.storeKw);
if(adv.noAnomaly) tags.push('排除异常');
var q=document.getElementById('si-'+tab).value.trim();
if(q) tags.push('搜索:'+q);
return tags;
}

window.doSort=function(tab,col){
var t=TABS[tab];
if(t.sortCol===col){t.sortDesc=!t.sortDesc;}else{t.sortCol=col;t.sortDesc=true;}
var items=getFiltered(tab);
items.sort(function(a,b){
var va=a[col],vb=b[col];
if(col==='actualV1d'||col==='actualGr'||col==='actualVsrPct'||col==='shopFsr'||col==='goodsFsr'){
va=(va===null||va===undefined||isNaN(va))?-1:va;
vb=(vb===null||vb===undefined||isNaN(vb))?-1:vb;
}
if(typeof va==='number') return t.sortDesc?(vb-va):(va-vb);
if(typeof va==='string') va=va.toLowerCase();
if(typeof vb==='string') vb=vb.toLowerCase();
return t.sortDesc?(vb>va?1:vb<va?-1:0):(va>vb?1:va<vb?-1:0);
});
t.page=0;
renderHead(tab);
renderBody(tab);
};

window.goPage=function(tab,p){
var t=TABS[tab];
var totalPages=Math.ceil(getFiltered(tab).length/t.pageSize)||1;
t.page=Math.max(0,Math.min(p,totalPages-1));
renderBody(tab);
};

cb.checked=(pool!=='ALL'&&cb.value===pool);
});
readAdvancedForm(tab);

else TABS[tab].adv.pools=[pool];
doFilter(tab);

function doFilter(tab){
var t=TABS[tab];
var q=document.getElementById('si-'+tab).value.toLowerCase().trim();
var preset=PRESETS[t.activePreset]||PRESETS.all;
var adv=t.adv||defaultAdv();
t.filtered=t.items.filter(function(item){
if(!preset.test(item)) return false;
if(!matchesAdvanced(item,adv)) return false;
if(q){
if(item.title.toLowerCase().indexOf(q)<0&&item.storeName.toLowerCase().indexOf(q)<0&&item.gid.toLowerCase().indexOf(q)<0) return false;
}
return true;
});
t.page=0;
renderBody(tab);
}

{h:'商品ID',v:function(i){return '"'+i.gid+'"';}},

{h:'爆发分',v:function(i){return i.burst.toFixed(1);}},
{h:'价格',v:function(i){return i.price;}},
{h:'销量',v:function(i){return i.sold;}},
{h:'店铺名称',v:function(i){return '"'+i.storeName.replace(/"/g,'""')+'"';}},
{h:'店铺销量',v:function(i){return '"'+i.shopSales+'"';}},
{h:'店铺粉丝',v:function(i){return '"'+i.shopFans+'"';}},
{h:'店铺ID',v:function(i){return '"'+i.storeId+'"';}},
{h:'行为数据',v:function(i){return '"'+i.behavior.replace(/"/g,'""')+'"';}},
{h:'首次发现',v:function(i){return '"'+i.firstSeen+'"';}},
{h:'数据异常',v:function(i){return i.anomaly?'是':'否';}},
{h:'类型',v:function(i){return i.isVirtual?'虚拟':'实体';}}
];
var header=exportCols.map(function(c){return c.h;}).join(',');
var body=items.map(function(item){
return exportCols.map(function(c){return c.v(item);}).join(',');
}).join('\n');
var blob=new Blob(['\uFEFF'+header+'\n'+body],{type:'text/csv;charset=utf-8'});
var url=URL.createObjectURL(blob);
var a=document.createElement('a');
a.href=url;
a.download='选品数据_'+m.date+'_'+typeName+(TABS[tab].activePreset!=='all'?'_'+TABS[tab].activePreset:'')+'.csv';
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
URL.revokeObjectURL(url);
};

/* ---- 风险避坑 Tab ---- */
var RISK_DATA=D.risk||null;
var RISK_STATE={level:'ALL',todayOnly:false,page:0,pageSize:100,filtered:[]};
var RISK_ITEMS=[];

function riskLevelLabel(lv){
var L=(RISK_DATA&&RISK_DATA.level_labels)||{high:'高危',medium:'中危',low:'低危'};
return L[lv]||lv;
}

function buildRiskItems(){
if(!RISK_DATA||!RISK_DATA.items) return;
RISK_ITEMS=RISK_DATA.items.map(function(r){
return {
gid:r[0]||'',title:r[1]||'',level:r[2]||'low',label:r[3]||'',
sold:parseInt(r[4],10)||0,v1d:parseFloat(r[5])||0,pool:r[6]||'',
storeId:r[7]||'',storeName:r[8]||'',detectedAt:r[9]||'',source:r[10]||'',
category:r[11]||'',isToday:parseInt(r[12],10)===1
};
});
}

function renderRiskIntro(){
var el=document.getElementById('risk-intro');
if(!el) return;
if(!RISK_DATA||!RISK_DATA.meta){
el.innerHTML='<b style="color:#ff6b6b">风险避坑</b> — 暂无数据。请运行 python gen_report.py 生成含风险清单的报告。';
return;
}
var rm=RISK_DATA.meta,g=rm.guide||{};
var h='<b style="color:#ff6b6b">'+(g.title||'风险避坑')+'</b> — '+esc(rm.note||'');
h+='<div style="margin-top:8px;font-size:11px;color:#8b949e">';
(g.lines||[]).forEach(function(l){h+='<div style="margin:3px 0">• '+esc(l)+'</div>';});
h+='</div><div style="margin-top:8px;font-size:11px">累计注册 <b style="color:#ffa502">'+fmtNum(rm.total_registry||0)+'</b> | 本表 <b>'+fmtNum(rm.count||0)+'</b> | 高危 <b style="color:#ff4757">'+fmtNum(rm.high_count||0)+'</b></div>';
el.innerHTML=h;
}

function initRiskLevelBtns(){
var box=document.getElementById('risk-level-btns');
if(!box) return;
var opts=[['ALL','全部'],['high','高危'],['medium','中危'],['low','低危'],['today','仅今日']];
box.innerHTML=opts.map(function(o){
return '<button type="button" class="risk-lv-btn'+(RISK_STATE.level===o[0]?' active':'')+'" onclick="setRiskLevel(\''+o[0]+'\',this)">'+o[1]+'</button>';
}).join('');
}

window.setRiskLevel=function(lv,btn){
RISK_STATE.level=lv;RISK_STATE.todayOnly=(lv==='today');
if(lv==='today') RISK_STATE.level='ALL';
document.querySelectorAll('#risk-level-btns .risk-lv-btn').forEach(function(b){b.classList.remove('active');});
if(btn) btn.classList.add('active');filterRisk();
};

function filterRisk(){
var q=(document.getElementById('si-risk').value||'').toLowerCase().trim();
RISK_STATE.filtered=RISK_ITEMS.filter(function(it){
if(RISK_STATE.todayOnly&&!it.isToday) return false;
if(RISK_STATE.level!=='ALL'&&RISK_STATE.level!=='today'&&it.level!==RISK_STATE.level) return false;
if(q&&(it.title.toLowerCase().indexOf(q)<0&&it.storeName.toLowerCase().indexOf(q)<0&&it.gid.toLowerCase().indexOf(q)<0)) return false;
return true;
});
RISK_STATE.page=0;renderRiskBody();
}

window.debounceRiskFilter=function(){clearTimeout(window._riskDeb);window._riskDeb=setTimeout(filterRisk,300);};

function renderRiskHead(){
var tr=document.getElementById('thead-risk');
if(tr) tr.innerHTML=['风险','商品ID','标题','销量','日增量','池','店铺','发现时间','来源','今日'].map(function(h){return '<th>'+h+'</th>';}).join('');
}

function copyRiskGid(gid){
if(!gid) return;
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(gid).catch(function(){});
}else{
var ta=document.createElement('textarea');ta.value=gid;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
}
}

function renderRiskBody(){
var tb=document.getElementById('tbody-risk'),fc=document.getElementById('fc-risk');
if(!tb) return;
var list=RISK_STATE.filtered,totalPages=Math.ceil(list.length/RISK_STATE.pageSize)||1;
RISK_STATE.page=Math.max(0,Math.min(RISK_STATE.page,totalPages-1));
var start=RISK_STATE.page*RISK_STATE.pageSize,slice=list.slice(start,start+RISK_STATE.pageSize);
if(fc) fc.textContent=fmtNum(list.length)+' 条';
tb.innerHTML=slice.map(function(it){
var gid=it.gid||'';
return '<tr><td><span class="risk-badge '+esc(it.level)+'">'+esc(riskLevelLabel(it.level))+'</span></td>'+
'<td class="risk-gid"><code data-gid="'+gid+'" style="cursor:pointer;font-size:11px;color:#58a6ff" title="点击复制">'+esc(gid)+'</code></td>'+
'<td title="'+esc(it.title)+'">'+esc(it.title.substring(0,40))+(it.title.length>40?'…':'')+'</td>'+
'<td class="n">'+fmtNum(it.sold)+'</td><td class="n">'+it.v1d+'</td><td>'+esc(it.pool)+'</td>'+
'<td title="'+esc(it.storeId)+'">'+esc((it.storeName||it.storeId||'').substring(0,16))+'</td>'+
'<td>'+esc((it.detectedAt||'').substring(0,16))+'</td><td>'+esc(it.source)+'</td>'+
'<td>'+(it.isToday?'<span class="risk-today">是</span>':'')+'</td></tr>';
}).join('');
var pg=document.getElementById('pager-risk');
if(pg) pg.innerHTML='第 '+(RISK_STATE.page+1)+' / '+totalPages+' 页 <button onclick="riskPage(-1)">上一页</button> <button onclick="riskPage(1)">下一页</button>';
}

window.riskPage=function(d){RISK_STATE.page+=d;renderRiskBody();};

function renderRiskShops(){
var el=document.getElementById('risk-shops');
if(!el) return;
if(!RISK_DATA||!RISK_DATA.top_shops||!RISK_DATA.top_shops.length){el.innerHTML='<span style="color:#8b949e;font-size:11px">暂无</span>';return;}
el.innerHTML=RISK_DATA.top_shops.map(function(s){
return '<span class="risk-shop-chip">'+esc(s[1]||s[0])+' · 冻结'+s[2]+' · 高危'+s[3]+'</span>';
}).join('');
}

window.exportRiskCSV=function(){
if(!RISK_ITEMS.length){alert('无风险数据');return;}
var header='商品ID,标题,风险等级,风险类型,销量,日增量,池,店铺ID,店铺名,发现时间,来源,品类,是否今日';
var body=RISK_STATE.filtered.map(function(it){
return ['"'+it.gid+'"','"'+it.title.replace(/"/g,'""')+'"',it.level,'"'+it.label+'"',it.sold,it.v1d,it.pool,'"'+it.storeId+'"','"'+it.storeName.replace(/"/g,'""')+'"','"'+it.detectedAt+'"','"'+it.source+'"','"'+it.category+'"',it.isToday?'是':'否'].join(',');
}).join('\n');
var blob=new Blob(['\uFEFF'+header+'\n'+body],{type:'text/csv;charset=utf-8'});
var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='风险商品清单_'+(m.date||'report')+'.csv';
document.body.appendChild(a);a.click();document.body.removeChild(a);
};

buildRiskItems();
document.getElementById('countRisk').textContent='('+fmtNum(RISK_ITEMS.length)+')';
var riskTb=document.getElementById('tbody-risk');
if(riskTb&&!riskTb._gidCopyBound){
riskTb._gidCopyBound=true;
riskTb.addEventListener('click',function(e){
var el=e.target.closest('[data-gid]');
if(el) copyRiskGid(el.getAttribute('data-gid'));
});
}
renderRiskIntro();initRiskLevelBtns();renderRiskHead();
RISK_STATE.filtered=RISK_ITEMS.slice();renderRiskBody();renderRiskShops();

TABS.virtual.adv=defaultAdv();
TABS.physical.adv=defaultAdv();
mountAdvPanel('virtual');
mountAdvPanel('physical');
renderTab('virtual');
renderTab('physical');
doFilter('virtual');
doFilter('physical');

var heroSub=document.getElementById('trialHeroSub');
var heroBadges=document.getElementById('trialHeroBadges');
if(heroSub){heroSub.textContent='样本 '+fmtNum(m.count)+' 条 · 虚拟 '+fmtNum(m.virtual_count||0)+' / 实体 '+fmtNum(m.physical_count||0)+' · '+(m.date||'');}
if(heroBadges&&m.tier_counts){
 ['S','A','B','C'].forEach(function(t){
  if(m.tier_counts[t])heroBadges.innerHTML+='<span class="trial-badge">'+t+' <strong>'+m.tier_counts[t]+'</strong></span>';
 });
}
var zipBtn=document.getElementById('trialZipBtn');
if(zipBtn&&location.protocol==='file:')zipBtn.href='./';

};
</script>
