<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电商选品分析报告</title>
<style>
:root{
--bg:#000000;--bg2:#1c1c1e;--surface:rgba(255,255,255,0.05);--surface2:rgba(255,255,255,0.08);
--border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.15);
--text:#f5f5f7;--text2:#a1a1a6;--text3:#6e6e73;
--blue:#0A84FF;--green:#30D158;--purple:#BF5AF2;--orange:#FF9F0A;--red:#FF453A;--cyan:#64D2FF;--gold:#FFD60A;
--mono:'SF Mono',Menlo,Monaco,'JetBrains Mono',monospace;
--sans:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','PingFang SC','Microsoft YaHei',sans-serif;
--radius:14px;--radius-sm:8px;--radius-lg:18px;
--shadow:0 4px 24px rgba(0,0,0,0.4);--shadow-lg:0 8px 40px rgba(0,0,0,0.5);
--transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);color:var(--text);padding:20px;-webkit-font-smoothing:antialiased;min-height:100vh}
.c{max-width:1600px;margin:0 auto}
h1{font-size:28px;font-weight:700;letter-spacing:-0.5px;background:linear-gradient(135deg,#f5f5f7 0%,#a1a1a6 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.sub{color:var(--text3);font-size:13px;margin-bottom:24px;font-family:var(--mono);letter-spacing:0.3px}
.s{background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.st{color:var(--text);font-size:16px;font-weight:600;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:10px;letter-spacing:-0.3px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.sc{background:var(--surface2);border-radius:var(--radius-sm);padding:14px;text-align:center;transition:var(--transition);border:1px solid transparent}
.sc:hover{border-color:var(--border2);transform:translateY(-2px)}
.sc .v{font-size:22px;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-0.5px}
.sc .l{font-size:11px;color:var(--text3);margin-top:4px;letter-spacing:0.3px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cb{background:var(--surface2);border-radius:var(--radius-sm);padding:14px}
.ct{color:var(--text);font-size:13px;font-weight:600;margin-bottom:10px}
.br{display:flex;align-items:center;margin-bottom:4px}
.bl{width:70px;font-size:11px;text-align:right;padding-right:8px;color:var(--text3);flex-shrink:0;font-family:var(--mono)}
.bt{flex:1;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden}
.bf{height:100%;border-radius:3px;transition:width 0.4s cubic-bezier(0.4,0,0.2,1)}
.bv{width:50px;font-size:11px;padding-left:8px;color:var(--text2);flex-shrink:0;font-family:var(--mono)}
.tw{overflow-x:auto}
.tw::-webkit-scrollbar{height:6px}
.tw::-webkit-scrollbar-track{background:transparent}
.tw::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}
.tw::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.2)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:rgba(255,255,255,0.04);color:var(--text2);padding:10px 6px;text-align:left;position:sticky;top:0;z-index:1;cursor:pointer;white-space:nowrap;user-select:none;font-weight:600;letter-spacing:0.3px;border-bottom:1px solid var(--border)}
th:hover{background:rgba(255,255,255,0.08);color:var(--text)}
th .arrow{font-size:10px;margin-left:3px;opacity:0.4}
th.sorted .arrow{opacity:1;color:var(--blue)}
.gid-link{color:var(--blue);text-decoration:none;font-size:11px;word-break:break-all;font-family:var(--mono);transition:color 0.2s}
.gid-link:hover{text-decoration:underline;color:var(--cyan)}
td{padding:8px 6px;border-bottom:1px solid rgba(255,255,255,0.04);white-space:nowrap}
tr:hover{background:rgba(255,255,255,0.03)}
.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.hl{color:var(--red);font-weight:600}
.hl2{color:var(--orange);font-weight:600}
.tc{max-width:260px;overflow:hidden;text-overflow:ellipsis;cursor:default}
.tc:hover{white-space:normal;word-break:break-all;background:rgba(255,255,255,0.04);position:relative;z-index:2}
.kc{max-width:120px;overflow:hidden;text-overflow:ellipsis}
a{color:var(--blue);text-decoration:none;transition:color 0.2s}
a:hover{text-decoration:underline}
.tag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;margin:3px;background:var(--surface2);color:var(--text2);transition:var(--transition)}
.tag.hot{background:rgba(255,69,58,0.15);color:var(--red)}
.sb{margin-bottom:12px;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.sb input{background:rgba(0,0,0,0.3);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:var(--radius-sm);width:280px;font-size:13px;transition:var(--transition);font-family:var(--sans)}
.sb input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,132,255,0.2)}
.sb input::placeholder{color:var(--text3)}
.pf button{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:11px;transition:var(--transition);font-weight:500}
.pf button.a{border-color:var(--blue);color:var(--blue);background:rgba(10,132,255,0.1)}
.pf button:hover{border-color:var(--blue);color:var(--text)}
.pager{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text3);margin-bottom:8px;font-family:var(--mono)}
.pager button{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:11px;transition:var(--transition)}
.pager button:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
.pager button:disabled{opacity:0.3;cursor:default}
.pager select{background:rgba(0,0,0,0.3);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:6px;font-size:11px;outline:none}
.tc-wrap{max-height:70vh;overflow-y:auto;border-radius:var(--radius-sm)}
.tc-wrap::-webkit-scrollbar{width:4px}
.tc-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}
.ins{background:rgba(255,255,255,0.03);border-left:3px solid var(--blue);padding:12px 16px;margin-bottom:8px;border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.ins .it{color:var(--text);font-weight:600;font-size:13px;margin-bottom:6px}
.ins .ix{color:var(--text2);font-size:12px;line-height:1.7}
.loading{text-align:center;padding:48px;color:var(--text3);font-size:16px}
.export-btn{background:var(--blue);border:none;color:#fff;padding:7px 16px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;margin-left:8px;transition:var(--transition);font-weight:600}
.export-btn:hover{background:#0071e3;transform:translateY(-1px);box-shadow:0 4px 12px rgba(10,132,255,0.3)}
.tab-nav{display:flex;border-bottom:2px solid var(--border);margin-bottom:0;gap:0}
.tab-nav button{background:transparent;border:none;color:var(--text3);padding:12px 28px;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:var(--transition);font-weight:600;letter-spacing:0.3px}
.tab-nav button:hover{color:var(--text)}
.tab-nav button.active{font-weight:700}
.tab-nav button.tab-virtual.active{color:var(--purple);border-bottom-color:var(--purple)}
.tab-nav button.tab-physical.active{color:var(--green);border-bottom-color:var(--green)}
.tab-nav button.tab-risk.active{color:var(--red);border-bottom-color:var(--red)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.type-tag{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700}
.type-tag.virtual{background:rgba(191,90,242,0.15);color:var(--purple)}
.type-tag.physical{background:rgba(48,209,88,0.15);color:var(--green)}
.guide-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:12px}
.guide-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:12px}
.guide-full{margin-bottom:12px}
.guide-box{background:rgba(255,255,255,0.03);border-radius:var(--radius-sm);padding:16px;border:1px solid var(--border)}
.guide-box h3{color:var(--text);font-size:14px;margin-bottom:10px;font-weight:600}
.guide-box h4{color:var(--text);font-size:13px;margin:12px 0 8px;font-weight:600}
.guide-principle{background:rgba(10,132,255,0.06);border-left:3px solid var(--blue);padding:12px 16px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:12px;line-height:1.8;color:var(--text2);margin-bottom:12px}
.guide-table{width:100%;font-size:11px;border-collapse:collapse}
.guide-table th{background:rgba(255,255,255,0.03);color:var(--text3);padding:8px 10px;text-align:left;font-weight:600;border-bottom:1px solid var(--border);position:static;cursor:default}
.guide-table td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:top;line-height:1.5}
.guide-table td:first-child{color:var(--orange);font-weight:600;white-space:nowrap}
.guide-table .ref{color:var(--green)}
.guide-steps{display:flex;flex-direction:column;gap:10px}
.guide-step{background:rgba(255,255,255,0.03);border-left:3px solid var(--green);padding:10px 14px;border-radius:0 6px 6px 0;font-size:12px;line-height:1.6}
.guide-step .sn{color:var(--green);font-weight:700;margin-right:6px;font-family:var(--mono)}
.guide-pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.guide-pool span{font-size:11px;padding:5px 12px;border-radius:6px;background:rgba(255,255,255,0.03);border:1px solid var(--border);line-height:1.5}
.guide-priority{margin:0;padding-left:20px;font-size:12px;line-height:2;color:var(--text2)}
.guide-priority li{margin-bottom:2px}
.guide-grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.guide-grade-card{background:rgba(255,255,255,0.03);border-radius:var(--radius-sm);padding:12px 14px;border-top:3px solid var(--text3)}
.guide-grade-card .gh{font-size:15px;font-weight:700;margin-bottom:6px}
.guide-grade-card .gl{font-size:11px;color:var(--text3);margin-bottom:6px}
.guide-grade-card ul{margin:0;padding-left:18px;font-size:11px;line-height:1.6;color:var(--text2)}
.guide-grade-card .ga{font-size:11px;color:var(--blue);margin-top:6px;font-style:italic}
.guide-list{margin:0;padding-left:20px;font-size:12px;line-height:1.8;color:var(--text2)}
.guide-list li{margin-bottom:4px}
.guide-band-table td,.guide-band-table th{font-size:11px}
.guide-routine{background:rgba(255,69,58,0.06);border:1px solid rgba(255,69,58,0.15);border-radius:var(--radius-sm);padding:10px 14px;font-size:12px;line-height:1.7;color:var(--text2);margin-top:10px}
.guide-routine b{color:var(--red)}
tr.anomaly-row{background:rgba(255,159,10,0.06)}
tr.anomaly-row:hover{background:rgba(255,159,10,0.1)}
td.anomaly-cell{color:var(--orange)!important;font-weight:600}
td.na{color:var(--text3)}
.preset-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.preset-bar .pl{font-size:11px;color:var(--text3);margin-right:4px;letter-spacing:0.3px}
.preset-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:5px 14px;border-radius:6px;cursor:pointer;font-size:11px;transition:var(--transition);font-weight:500}
.preset-btn:hover{border-color:var(--blue);color:var(--text)}
.preset-btn.active{border-color:var(--blue);color:var(--blue);background:rgba(10,132,255,0.1)}
.tag-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.tag-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:5px 14px;border-radius:16px;cursor:pointer;font-size:11px;transition:var(--transition)}
.tag-btn:hover{border-color:var(--green);color:var(--text)}
.tag-btn.active{border-color:var(--green);color:var(--green);background:rgba(48,209,88,0.1)}
.cat-bar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;align-items:center}
.cat-bar .cat-label{font-size:11px;color:var(--text3);font-weight:600;margin-right:4px;letter-spacing:0.3px}
.cat-chip{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:5px 12px;border-radius:16px;cursor:pointer;font-size:11px;transition:var(--transition)}
.cat-chip:hover{border-color:var(--blue);color:var(--text)}
.cat-chip.active{border-color:var(--blue);color:var(--blue);background:rgba(10,132,255,0.1);font-weight:600}
.cat-chip .n{opacity:0.7;margin-left:4px;font-family:var(--mono);font-size:10px}
.cat-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;background:rgba(10,132,255,0.12);color:var(--blue);border:1px solid rgba(10,132,255,0.25);white-space:nowrap}
.view-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.view-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:5px 14px;border-radius:6px;cursor:pointer;font-size:11px;transition:var(--transition)}
.view-btn.active{border-color:var(--blue);color:var(--blue);background:rgba(10,132,255,0.1)}
.pick-banner{background:rgba(48,209,88,0.06);border:1px solid rgba(48,209,88,0.2);border-radius:var(--radius-sm);padding:10px 16px;margin-bottom:12px;font-size:12px;line-height:1.7;color:var(--text2)}
.pick-banner b{color:var(--green)}
.collapsible{margin-bottom:16px}
.collapsible summary{cursor:pointer;color:var(--text);font-size:16px;font-weight:600;padding:12px 0;list-style:none;letter-spacing:-0.3px}
.collapsible summary::-webkit-details-marker{display:none}
.collapsible[open] summary{border-bottom:1px solid var(--border);margin-bottom:14px}
.compact-hint{font-size:11px;color:var(--text3);margin-left:8px}
.tw.compact-mode{overflow-x:visible}
.tw.compact-mode table{table-layout:fixed}
.tw.compact-mode .tc{max-width:320px}
.filter-status{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;padding:10px 14px;background:rgba(255,255,255,0.03);border-radius:var(--radius-sm);font-size:12px;border:1px solid var(--border)}
.filter-status .fs-label{color:var(--text3)}
.filter-status .fs-count{color:var(--green);font-weight:600;font-family:var(--mono)}
.filter-status .fs-tags{color:var(--blue)}
.filter-status .fs-clear{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--text3);padding:4px 12px;border-radius:6px;cursor:pointer;font-size:11px;transition:var(--transition)}
.filter-status .fs-clear:hover{border-color:var(--red);color:var(--red)}
.adv-toggle{background:var(--surface2);border:1px solid var(--border);color:var(--blue);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:11px;margin-bottom:8px;transition:var(--transition);font-weight:500}
.adv-toggle:hover{border-color:var(--blue);background:rgba(10,132,255,0.05)}
.adv-panel{display:none;background:rgba(0,0,0,0.2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px}
.adv-panel.open{display:block}
.adv-hint{font-size:11px;color:var(--text3);margin:0 0 12px;line-height:1.5}
.adv-section{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.04)}
.adv-section:last-of-type{border-bottom:none}
.adv-section-title{font-size:12px;color:var(--text);font-weight:600;margin-bottom:8px;letter-spacing:0.3px}
.adv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:4px}
.adv-checks{display:flex;flex-wrap:wrap;gap:12px 16px;margin:10px 0 12px;font-size:11px;color:var(--text2)}
.adv-checks label{cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.adv-field label{display:block;font-size:11px;color:var(--text3);margin-bottom:4px}
.adv-field input[type=number],.adv-field input[type=text]{width:100%;background:rgba(0,0,0,0.3);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:12px;box-sizing:border-box;transition:var(--transition)}
.adv-field input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,132,255,0.15)}
.adv-pools{display:flex;flex-wrap:wrap;gap:8px}
.adv-pools label{font-size:11px;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:4px}
.adv-actions{display:flex;gap:8px;flex-wrap:wrap}
.adv-actions button{padding:6px 16px;border-radius:6px;cursor:pointer;font-size:12px;border:1px solid var(--border);transition:var(--transition);font-weight:500}
.adv-apply{background:var(--blue);border-color:var(--blue);color:#fff}
.adv-apply:hover{background:#0071e3}
.adv-reset{background:var(--surface2);color:var(--text2)}
.adv-reset:hover{border-color:var(--blue);color:var(--text)}
.report-footer{margin-top:24px;padding:20px;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:var(--radius);font-size:11px;line-height:1.8;color:var(--text3)}
.report-footer h2{font-size:13px;color:var(--text2);margin-bottom:10px;font-weight:600}
.report-footer ul{margin:0;padding-left:20px}
.report-footer li{margin-bottom:6px}
.report-footer .fd-ver{font-size:10px;color:var(--text3);margin-top:10px;font-family:var(--mono)}
.tier-section{margin-bottom:20px}
.tier-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tier-pill{padding:14px 16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);cursor:pointer;text-align:left;transition:var(--transition)}
.tier-pill:hover{border-color:var(--border2);transform:translateY(-2px)}
.tier-pill.active{border-color:var(--blue);background:rgba(10,132,255,0.08);box-shadow:0 0 0 1px rgba(10,132,255,0.3)}
.tier-pill.t-wide.active{border-color:var(--green);background:rgba(48,209,88,0.08)}
.tier-pill.t-strict.active{border-color:var(--orange);background:rgba(255,159,10,0.08)}
.tier-pill-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.tier-pill-count{font-size:11px;font-weight:700;color:var(--blue);background:rgba(10,132,255,0.1);padding:3px 10px;border-radius:999px;font-family:var(--mono)}
.tier-pill-title{font-size:14px;font-weight:600;color:var(--text)}
.tier-pill-desc{font-size:11px;color:var(--text3);line-height:1.45;margin-top:4px}
.tier-compare{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;font-size:11px;color:var(--text3)}
.tier-compare span{padding:4px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border)}
.tier-compare .hl{color:var(--text);font-weight:600}
.tier-guide-box{background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:20px}
.tier-guide-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.tier-guide-icon{font-size:28px;line-height:1}
.tier-guide-title{font-size:16px;font-weight:600;color:var(--text)}
.tier-guide-tagline{font-size:12px;color:var(--text3);margin-top:4px;line-height:1.5}
.tier-guide-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:12px}
.tier-guide-block{background:rgba(255,255,255,0.03);border-radius:var(--radius-sm);padding:12px 14px;font-size:12px;line-height:1.65;color:var(--text2)}
.tier-guide-block .lbl{font-size:10px;font-weight:700;color:var(--text3);margin-bottom:4px;letter-spacing:0.5px;text-transform:uppercase}
.tier-guide-criteria{margin:0;padding-left:20px;font-size:12px;line-height:1.75;color:var(--text2)}
.tier-guide-compare{margin-top:10px;padding:10px 14px;border-radius:var(--radius-sm);background:rgba(10,132,255,0.05);border:1px solid rgba(10,132,255,0.15);font-size:12px;line-height:1.6;color:var(--text2)}
.tier-guide-all{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}
.tier-guide-all summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--blue);list-style:none}
.tier-guide-all summary::-webkit-details-marker{display:none}
.tier-mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:10px}

<script src="data.js"></script>
<script>
(function(){
if(typeof REPORT_DATA==='undefined'){
document.getElementById('loading').textContent='数据加载失败: data.js 文件未找到';
return;
}

var TIER_GUIDES={
full:{id:'full',short:'全量严选',icon:'📊',tagline:'全库扫描 · 双赛道严门槛（日批主报告）',filter_label:'全库；实体 v1d>5/真实≥5；虚拟 v1d>1/真实≥1',scope:'扫描范围：全库所有在库商品，无「最近 1 天」时间窗口限制。',criteria:['实体：v1d > 5 或 真实增量 ≥ 5','虚拟：v1d > 1 或 真实增量 ≥ 1','同标题去重保留最高真实增量'],when_to_use:'日批主名单；推云、精品池、跟踪库均以此档为准。',how_to_read:'虚拟/实体分 Tab；按真实增量降序；优先 BURST/ACCEL。',compare_hint:'全库基准，与复扫两档对比可看触达面与漏斗差异。'},
rescan_wide:{id:'rescan_wide',short:'复扫宽',icon:'🔍',tagline:'今日扫描 · 真实增量≥1',filter_label:'今日扫描；真实增量≥1（统一）',scope:'仅「最近 1 天（日历日今日）」有扫描记录的商品。',criteria:['今日被扫描触及','真实增量 ≥ 1（实体+虚拟统一）','捕捉刚动起来的候选'],when_to_use:'看当天谁开始动；挖早、挖新。',how_to_read:'按真实增量降序；关注 actual≥5 且三角指标抬升。',compare_hint:'与日报同口径（最近 1 天）。'},
rescan_strict:{id:'rescan_strict',short:'复扫严',icon:'⚡',tagline:'今日扫描 · delta≥1',filter_label:'今日扫描；delta≥1',scope:'仅今日扫描触及的商品（最近 1 天窗口）。',criteria:['今日扫描触及','delta ≥ 1','窗口内强动销候选'],when_to_use:'日批增量精品；当日重点跟进。',how_to_read:'最近 1 天窗口；优先 BURST/ACCEL + Top50。',compare_hint:'与日报同口径。'}
};

var BUNDLE_ROOT=null,IS_BUNDLE=false,ACTIVE_TIER='full',TIER_LIST=[];
var D,m,COLS,IDX={};
var ALL_ITEMS=[],PHYSICAL_ITEMS=[],VIRTUAL_ITEMS=[];
var RISK_DATA=null;

function fmtNum(n){ return Number(n).toLocaleString(); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function inferTierFromMeta(meta){
if(!meta) return 'full';
var kind=meta.report_kind||'';
if(kind==='rescan_wide') return 'rescan_wide';
if(kind==='rescan_strict') return 'rescan_strict';
if(kind==='daily_full'||kind==='daily') return 'full';
var label=meta.filter_label||'';
if(label.indexOf('真实增量≥1')>=0&&(label.indexOf('今日')>=0||label.indexOf('昨今')>=0)) return 'rescan_wide';
if((label.indexOf('今日')>=0||label.indexOf('昨今')>=0)&&label.indexOf('v1d>5')>=0) return 'rescan_strict';
return 'full';
}

function includeAllItemsInTable(meta){
if(!meta) return false;
var kind=String(meta.report_kind||'');
if(kind.indexOf('custom_search')===0) return true;
if(meta.filter_mode==='custom_full') return true;
if(meta.display_top_n===0||meta.display_top_n==='0') return true;
var label=String(meta.filter_label||'');
if(label.indexOf('无门槛')>=0) return true;
return false;
}

function tierGuideFor(id){
var guides=(m&&m.tier_guides)||(BUNDLE_ROOT&&BUNDLE_ROOT.meta&&BUNDLE_ROOT.meta.tier_guides)||TIER_GUIDES;
return guides[id]||TIER_GUIDES[id]||null;
}

function tierShortTitle(id){
var t=TIER_LIST.filter(function(x){return x.id===id;})[0];
if(t&&t.short) return t.short;
if(TIER_GUIDES[id]&&TIER_GUIDES[id].short) return TIER_GUIDES[id].short;
return (t&&t.title)?t.title:id;
}

function resolveBundle(raw){
if(raw&&raw.tiers&&typeof raw.tiers==='object'){
IS_BUNDLE=true;BUNDLE_ROOT=raw;
TIER_LIST=((raw.meta&&raw.meta.tier_list)||[]).map(function(t){
return Object.assign({},t,{short:t.short||((TIER_GUIDES[t.id]&&TIER_GUIDES[t.id].short)||t.title||t.id),count:t.count||0});
});
var hash=(location.hash||'').match(/tier=([a-z_]+)/i);
var def=(hash&&hash[1])||raw.active_tier||(raw.meta&&raw.meta.active_tier)||'full';
ACTIVE_TIER=(def in raw.tiers)?def:Object.keys(raw.tiers)[0];
return raw.tiers[ACTIVE_TIER]||raw;
}
IS_BUNDLE=false;BUNDLE_ROOT=null;TIER_LIST=[];
ACTIVE_TIER=inferTierFromMeta(raw&&raw.meta);
return raw;
}

function renderTierGuide(tierId){
var g=tierGuideFor(tierId),el=document.getElementById('tier-guide-section');
if(!g||!el){if(el) el.innerHTML='';return;}
var h='<div class="tier-guide-box">';
h+='<div class="tier-guide-head"><span class="tier-guide-icon">'+(g.icon||'📦')+'</span><div>';
h+='<div class="tier-guide-title">'+esc(g.short)+' · 使用说明</div>';
h+='<div class="tier-guide-tagline">'+esc(g.tagline)+'</div></div></div>';
h+='<div class="tier-guide-grid">';
h+='<div class="tier-guide-block"><div class="lbl">扫描范围</div>'+esc(g.scope)+'</div>';
h+='<div class="tier-guide-block"><div class="lbl">适用场景</div>'+esc(g.when_to_use)+'</div>';
h+='<div class="tier-guide-block"><div class="lbl">阅读方式</div>'+esc(g.how_to_read)+'</div></div>';
h+='<div class="tier-guide-block"><div class="lbl">入选门槛（筛选标准）</div><ul class="tier-guide-criteria">';
(g.criteria||[]).forEach(function(c){h+='<li>'+esc(c)+'</li>';});
h+='</ul></div>';
if(g.compare_hint) h+='<div class="tier-guide-compare"><b>与其他档位：</b>'+esc(g.compare_hint)+'</div>';
if(IS_BUNDLE&&TIER_LIST.length>1){
h+='<details class="tier-guide-all"><summary>查看三档口径对照 ▾</summary><div class="tier-mini-grid">';
TIER_LIST.forEach(function(t){
var tg=tierGuideFor(t.id);if(!tg) return;
h+='<div class="tier-mini-card"><b>'+esc(tg.icon+' '+tg.short)+'</b>'+esc(tg.filter_label)+'<br><br>'+esc(tg.when_to_use)+'</div>';
});
h+='</div></details>';
}
h+='</div>';
el.innerHTML=h;
}

function renderTierUI(){
var box=document.getElementById('tier-section');
if(!box) return;
if(!IS_BUNDLE||TIER_LIST.length<2){box.style.display='none';box.innerHTML='';return;}
box.style.display='block';
var h='<div class="tier-bar">';
TIER_LIST.forEach(function(t,idx){
var cls='tier-pill';
if(t.id==='full') cls+=' t-full';
else if(t.id==='rescan_wide') cls+=' t-wide';
else cls+=' t-strict';
if(t.id===ACTIVE_TIER) cls+=' active';
h+='<div class="'+cls+'" onclick="switchReportTier(\''+t.id+'\')">';
h+='<div class="tier-pill-head"><span class="tier-pill-title">'+(TIER_GUIDES[t.id]?TIER_GUIDES[t.id].icon:'')+' '+esc(tierShortTitle(t.id))+(idx<3?' · 按 '+(idx+1):'')+'</span>';
h+='<span class="tier-pill-count">'+fmtNum(t.count||0)+' 条</span></div>';
h+='<div class="tier-pill-desc">'+esc(t.filter_label||'')+'</div></div>';
});
h+='</div><div class="tier-compare">';
TIER_LIST.forEach(function(t){
h+='<span'+(t.id===ACTIVE_TIER?' class="hl"':'')+'>'+esc(tierShortTitle(t.id))+' '+fmtNum(t.count||0)+' 条</span>';
});
h+='</div>';
box.innerHTML=h;
}

window.switchReportTier=function(tierId){
if(!IS_BUNDLE||!BUNDLE_ROOT||ACTIVE_TIER===tierId) return;
var payload=(BUNDLE_ROOT.tiers||{})[tierId];
if(!payload) return;
ACTIVE_TIER=tierId;
history.replaceState(null,'',location.pathname+location.search+'#tier='+tierId);
bootstrapReport(payload);
renderTierUI();
renderTierGuide(ACTIVE_TIER);
window.scrollTo(0,0);
};

document.addEventListener('keydown',function(e){
if(!IS_BUNDLE||TIER_LIST.length<2) return;
var tag=(e.target&&e.target.tagName)||'';
if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
var idx=Number(e.key)-1;
if(idx>=0&&idx<TIER_LIST.length){e.preventDefault();switchReportTier(TIER_LIST[idx].id);}
});

var HAS_DB_VIRTUAL=false,HAS_VSR_CHART=false;
var VIRTUAL_KEYWORDS=['自动发货','电子版','PDF','秒发','课件','教案','模板','word','PPT','ppt','题库','真题','答案','解析','密钥','激活','优惠券','兑换券','月卡','会员','视频课程','网课','资料包','网盘','刻录盘'];
function isVirtualByKeyword(title){ return VIRTUAL_KEYWORDS.some(function(kw){ return title.toLowerCase().includes(kw.toLowerCase()); }); }

function buildItem(r){
var v1d=parseFloat(r[IDX.v1d])||0;
var sold=parseInt(r[IDX.sold])||0;
var actualRaw=typeof IDX.actual_v1d!=='undefined'?r[IDX.actual_v1d]:null;
var actualV1d=(actualRaw===null||actualRaw===undefined||actualRaw==='')?0:parseFloat(actualRaw);
if(isNaN(actualV1d)) actualV1d=0;
if(!actualV1d&&typeof IDX.delta!=='undefined'){actualV1d=parseFloat(r[IDX.delta])||0;}
var actualGrRaw=typeof IDX.actual_gr!=='undefined'?r[IDX.actual_gr]:null;
var actualGr=(actualGrRaw===null||actualGrRaw===undefined||actualGrRaw==='')?0:parseFloat(actualGrRaw);
if(isNaN(actualGr)) actualGr=0;
var estVsr=typeof IDX.vsr!=='undefined'?(parseFloat(r[IDX.vsr])||0):(sold>0?v1d/sold:0);
var actualVsrRaw=typeof IDX.actual_vsr!=='undefined'?r[IDX.actual_vsr]:null;
var actualVsr=(actualVsrRaw===null||actualVsrRaw===undefined||actualVsrRaw==='')?null:parseFloat(actualVsrRaw);
if(actualVsr===null&&actualV1d!==null&&sold>0) actualVsr=actualV1d/sold;
var estVsrPct=estVsr*100;
var actualVsrPct=actualVsr!==null?actualVsr*100:null;
var anomaly=typeof IDX.anomaly!=='undefined'?parseInt(r[IDX.anomaly],10)===1:((sold>0&&v1d>sold)||estVsrPct>100);
return {
gid:r[IDX.goods_id]||'',
title:r[IDX.title]||'',
price:r[IDX.price],
sold:sold,
actualV1d:actualV1d,
v1d:v1d,
actualGr:actualGr,
actualVsr:actualVsr,
actualVsrPct:actualVsrPct,
estVsr:estVsr,
estVsrPct:estVsrPct,
burst:parseFloat(r[IDX.burst])||0,
pool:r[IDX.pool]||'',
firstSeen:r[IDX.first_seen]||'',
storeId:r[IDX.store_id]||'',
storeName:r[IDX.store_name]||'',
shopSales:r[IDX.shop_sales]||'',
shopFans:r[IDX.shop_fans]||'',
behavior:r[IDX.behavior]||'',
cart24h:(typeof IDX.cart_24h!=='undefined'&&r[IDX.cart_24h])?String(r[IDX.cart_24h]):'',
isVirtual:parseInt(r[IDX.is_virtual],10)===1,
isUnclassified:parseInt(r[IDX.is_virtual],10)===2,
anomaly:anomaly,
categoryTag:(typeof IDX.category_tag!=='undefined'&&r[IDX.category_tag])?String(r[IDX.category_tag]).trim():'',
detailUrl:(typeof IDX.detail_url!=='undefined'&&r[IDX.detail_url])?r[IDX.detail_url]:goodsDetailUrl(r[IDX.goods_id]||'')
};
}

function initSort(arr,col,desc){
arr.sort(function(a,b){
var va=a[col],vb=b[col];
if(col==='actualV1d'||col==='actualGr'||col==='actualVsrPct'){
va=(va===null||va===undefined||isNaN(va))?-1:va;
vb=(vb===null||vb===undefined||isNaN(vb))?-1:vb;
}
if(typeof va==='number') return desc?(vb-va):(va-vb);
if(typeof va==='string') va=va.toLowerCase();
if(typeof vb==='string') vb=vb.toLowerCase();
return desc?(vb>va?1:vb<va?-1:0):(va>vb?1:va<vb?-1:0);
});
}

function barC(d,c){
var mx=0;for(var k in d){if(d[k]>mx)mx=d[k];}
var h='';
for(var k in d){h+='<div class="br"><span class="bl">'+k+'</span><div class="bt"><div class="bf" style="width:'+(d[k]/mx*100)+'%;background:'+c+'"></div></div><span class="bv">'+d[k]+'</span></div>';}
return h;
}

function rebuildItemsFromD(){
ALL_ITEMS=[];PHYSICAL_ITEMS=[];VIRTUAL_ITEMS=[];
if(!D||!D.items) return;
var showAll=includeAllItemsInTable(m);
D.items.forEach(function(r){
var v1d=parseFloat(r[IDX.v1d])||0;
var actualRaw=typeof IDX.actual_v1d!=='undefined'?r[IDX.actual_v1d]:null;
var actualV1d=(actualRaw===null||actualRaw===undefined||actualRaw==='')?0:parseFloat(actualRaw);
if(isNaN(actualV1d)) actualV1d=0;
var delta=parseFloat(r[IDX.delta])||0;
if(showAll||v1d>0||actualV1d>0||delta>0){
var obj=buildItem(r);
ALL_ITEMS.push(obj);
if(obj.isVirtual) VIRTUAL_ITEMS.push(obj);
else PHYSICAL_ITEMS.push(obj);
}
});
initSort(VIRTUAL_ITEMS,'actualV1d',true);
initSort(PHYSICAL_ITEMS,'actualV1d',true);
}

function applyCatalogKwType(){
var ct=String((m&&m.catalog_kw_type)||'').toLowerCase();
if(ct!=='physical'&&ct!=='virtual') return;
var tabNav=document.querySelector('.tab-nav');
if(!tabNav) return;
var btnVirtual=tabNav.querySelector('.tab-virtual');
var btnPhysical=tabNav.querySelector('.tab-physical');
var panelVirtual=document.getElementById('panel-virtual');
var panelPhysical=document.getElementById('panel-physical');
if(ct==='physical'){
if(btnVirtual) btnVirtual.style.display='none';
if(panelVirtual) panelVirtual.style.display='none';
if(btnPhysical){btnPhysical.style.display='';btnPhysical.classList.add('active');}
if(btnVirtual) btnVirtual.classList.remove('active');
if(panelPhysical){panelPhysical.classList.add('active');panelPhysical.style.display='';}
if(panelVirtual) panelVirtual.classList.remove('active');
}else{
if(btnPhysical) btnPhysical.style.display='none';
if(panelPhysical) panelPhysical.style.display='none';
if(btnVirtual){btnVirtual.style.display='';btnVirtual.classList.add('active');}
if(btnPhysical) btnPhysical.classList.remove('active');
if(panelVirtual){panelVirtual.classList.add('active');panelVirtual.style.display='';}
if(panelPhysical) panelPhysical.classList.remove('active');
}
}

function bootstrapReport(payload){
D=payload||{};

function itemCategoryTag(item){
return (item.categoryTag||'').trim()||'未分类';
}

function countCategories(items){
var map={};
(items||[]).forEach(function(item){
var tag=itemCategoryTag(item);
map[tag]=(map[tag]||0)+1;
});
return Object.keys(map).map(function(tag){return {tag:tag,count:map[tag]};})
.sort(function(a,b){return b.count-a.count||a.tag.localeCompare(b.tag,'zh');});
}

function fillAdvForm(tab,adv){
var p=TAB_PREFIX[tab];
ADV_NUM_KEYS.forEach(function(k){
var el=document.getElementById('af-'+p+'-'+k);
if(el) el.value=(adv[k]!==null&&adv[k]!==undefined)?adv[k]:'';
});
ADV_TEXT_KEYS.forEach(function(k){
var el=document.getElementById('af-'+p+'-'+k);
if(el) el.value=adv[k]||'';
});
ADV_BOOL_KEYS.forEach(function(k){
var el=document.getElementById('af-'+p+'-'+k);
if(el) el.checked=!!adv[k];
});
document.querySelectorAll('#af-'+p+'-pools input').forEach(function(cb){
cb.checked=adv.pools&&adv.pools.indexOf(cb.value)>=0;
});
}

}

function parseNum(v){
if(v===''||v===null||v===undefined) return null;
var n=parseFloat(v);
return isNaN(n)?null:n;
}

function readAdvancedForm(tab){
var p=TAB_PREFIX[tab];
var pools=[];
document.querySelectorAll('#af-'+p+'-pools input:checked').forEach(function(cb){pools.push(cb.value);});
var adv=defaultAdv();
ADV_NUM_KEYS.forEach(function(k){
adv[k]=parseNum(document.getElementById('af-'+p+'-'+k).value);
});
ADV_TEXT_KEYS.forEach(function(k){
adv[k]=document.getElementById('af-'+p+'-'+k).value.trim().toLowerCase();
});
ADV_BOOL_KEYS.forEach(function(k){
adv[k]=document.getElementById('af-'+p+'-'+k).checked;
});
adv.pools=pools.length?pools:null;
TABS[tab].adv=adv;
}

function kwMatch(text,kwStr){
if(!kwStr) return true;
var kws=kwStr.split(/\s+/).filter(Boolean);
return kws.every(function(kw){return text.indexOf(kw)>=0;});
}

function numGte(val,min){
if(min===null) return true;
if(val===null||val===undefined||isNaN(val)) return false;
return val>=min;
}
function numLte(val,max){
if(max===null) return true;
if(val===null||val===undefined||isNaN(val)) return false;
return val<=max;
}

function matchesAdvanced(item,adv){
if(!numGte(item.price,adv.priceMin)||!numLte(item.price,adv.priceMax)) return false;
if(!numGte(item.sold,adv.soldMin)||!numLte(item.sold,adv.soldMax)) return false;
if(!numGte(item.actualV1d,adv.actualMin)||!numLte(item.actualV1d,adv.actualMax)) return false;
if(!numGte(item.actualGr,adv.actualGrMin)) return false;
if(!numGte(item.actualVsrPct,adv.actualVsrMin)) return false;
if(!numGte(item.burst,adv.burstMin)) return false;
if(adv.pools&&adv.pools.length&&adv.pools.indexOf(item.pool)<0) return false;
var blob=(item.title+' '+item.behavior).toLowerCase();
if(adv.includeKw&&!kwMatch(blob,adv.includeKw)) return false;
if(adv.excludeKw){
var ex=adv.excludeKw.split(/\s+/).filter(Boolean);
for(var i=0;i<ex.length;i++){if(blob.indexOf(ex[i])>=0) return false;}
}
if(adv.storeKw&&item.storeName.toLowerCase().indexOf(adv.storeKw)<0) return false;
if(adv.noAnomaly&&item.anomaly) return false;
return true;
}

function hasAdvancedActive(adv){
if(!adv) return false;
for(var i=0;i<ADV_NUM_KEYS.length;i++){if(adv[ADV_NUM_KEYS[i]]!==null) return true;}
for(var j=0;j<ADV_TEXT_KEYS.length;j++){if(adv[ADV_TEXT_KEYS[j]]) return true;}
for(var k=0;k<ADV_BOOL_KEYS.length;k++){if(adv[ADV_BOOL_KEYS[k]]) return true;}
if(adv.pools&&adv.pools.length) return true;
return false;
}

function buildFilterTags(tab){
var t=TABS[tab];
var tags=[];
if(t.activePreset&&t.activePreset!=='all'&&PRESETS[t.activePreset]) tags.push(PRESETS[t.activePreset].label);
var adv=t.adv||{};
if(adv.actualMin!==null||adv.actualMax!==null){
tags.push('真实增量'+(adv.actualMin!==null?'>='+adv.actualMin:'')+(adv.actualMax!==null?(adv.actualMin!==null?' ':'')+'<='+adv.actualMax:''));
}
if(adv.actualGrMin!==null) tags.push('真实日增速≥'+adv.actualGrMin+'%');
if(adv.actualVsrMin!==null) tags.push('真实增销比≥'+adv.actualVsrMin+'%');
if(adv.burstMin!==null) tags.push('爆发分≥'+adv.burstMin);
if(adv.priceMin!==null||adv.priceMax!==null){
tags.push('价格'+(adv.priceMin!==null?adv.priceMin:'0')+'-'+(adv.priceMax!==null?adv.priceMax:'∞'));
}
if(adv.soldMin!==null||adv.soldMax!==null) tags.push('销量区间');
if(adv.pools&&adv.pools.length) tags.push('分层:'+adv.pools.join('/'));
if(adv.includeKw) tags.push('含:'+adv.includeKw);
if(adv.excludeKw) tags.push('排除:'+adv.excludeKw);
if(adv.storeKw) tags.push('店铺:'+adv.storeKw);
if(adv.noAnomaly) tags.push('排除异常');
if(t.categoryFilter&&t.categoryFilter!=='ALL') tags.push('类目:'+t.categoryFilter);
var q=document.getElementById('si-'+tab).value.trim();
if(q) tags.push('搜索:'+q);
return tags;
}

window.doSort=function(tab,col){
var t=TABS[tab];
if(t.sortCol===col){t.sortDesc=!t.sortDesc;}else{t.sortCol=col;t.sortDesc=true;}
var items=getFiltered(tab);
items.sort(function(a,b){
var va=a[col],vb=b[col];
if(col==='actualV1d'||col==='actualGr'||col==='actualVsrPct'){
va=(va===null||va===undefined||isNaN(va))?-1:va;
vb=(vb===null||vb===undefined||isNaN(vb))?-1:vb;
}
if(typeof va==='number') return t.sortDesc?(vb-va):(va-vb);
if(typeof va==='string') va=va.toLowerCase();
if(typeof vb==='string') vb=vb.toLowerCase();
return t.sortDesc?(vb>va?1:vb<va?-1:0):(va>vb?1:va<vb?-1:0);
});
t.page=0;
renderHead(tab);
renderBody(tab);
};

window.goPage=function(tab,p){
var t=TABS[tab];
var totalPages=Math.ceil(getFiltered(tab).length/t.pageSize)||1;
t.page=Math.max(0,Math.min(p,totalPages-1));
renderBody(tab);
};

function doFilter(tab){
var t=TABS[tab];
var q=document.getElementById('si-'+tab).value.toLowerCase().trim();
var preset=PRESETS[t.activePreset]||PRESETS.all;
var adv=t.adv||defaultAdv();

});

}
